<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#E8552F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestionale">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Gestionale — Agenzia Grafica &amp; Stampa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1C2A4A; --paper:#F4F6F7; --card:#FFFFFF;
    --sidebar-bg:#FFFFFF; --sidebar-hover:#F1F3F5;
    --accent:#E8552F; --accent-dark:#C6431F; --teal:#1F7A8C; --text:#1C2430;
    --muted:#6B7280; --border:#DDE2E5; --ok:#2E7D4F; --warn:#B8860B; --danger:#C0392B;
    --radius-card:10px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  #app{display:flex;min-height:100vh;}
  aside.sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);color:var(--text);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-size:19px;font-weight:700;color:var(--text);padding:6px 8px 2px;}
  .brand small{display:block;font-family:'Inter';font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
  .brand-logo{padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .brand-logo img{width:100%;height:auto;display:block;}
  .brand-logo small{display:block;font-family:'Inter';font-weight:500;font-size:11.5px;color:var(--muted);margin-top:8px;letter-spacing:.2px;}
  .stat.clickable{cursor:pointer;transition:border-color .15s, transform .1s;}
  .stat.clickable:hover{border-color:var(--accent);}
  .stat.clickable:active{transform:scale(.99);}
  .modal-section{background:var(--paper);border-radius:10px;padding:20px 22px;margin:20px 0;border-left:4px solid var(--accent);}
  .modal-section h3{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--text);}
  .modal p, .modal .field label, .modal .ticket-meta{font-size:15px;}
  .modal{font-size:16.5px;line-height:1.6;}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;}
  .list-row:hover{border-color:var(--accent);}
  .list-row .lr-main{font-weight:600;font-size:13.5px;}
  .list-row .lr-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  nav.tabs{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
  nav.tabs button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;}
  nav.tabs button:hover{background:var(--sidebar-hover);color:var(--text);}
  nav.tabs button.active{background:var(--accent);color:#fff;}
  nav.tabs .icon{width:18px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--muted);line-height:1.5;}
  main{flex:1;min-width:0;padding:26px 30px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;position:relative;z-index:100;}
  .global-search{flex:1;max-width:320px;position:relative;z-index:110;}
  .global-search input{width:100%;padding:10px 14px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;}
  .global-search-dropdown{display:none;position:fixed;right:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 18px 45px rgba(20,29,43,.22);max-height:320px;overflow-y:auto;z-index:9999;}
  .gsd-item{padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);}
  .gsd-item:last-child{border-bottom:none;}
  .gsd-item:hover{background:var(--paper);color:var(--accent);}
  .gsd-empty{padding:12px 14px;font-size:13px;color:var(--muted);}
  .topbar h1{font-size:22px;margin:0 0 4px;}
  .topbar p{margin:0;color:var(--muted);font-size:14px;}
  .btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--accent);}
  .btn-outline:hover{border-color:var(--accent);background:#FFF3EE;}
  .btn-ghost{color:var(--muted);padding:6px 8px;font-weight:500;}
  .btn-ghost:hover{color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  section.view{display:none;}
  section.view.active{display:block;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-auto{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;}
  .stat .stat-label{font-size:12.5px;color:var(--muted);margin:0 0 6px;}
  .stat .stat-value{font-size:24px;font-weight:700;font-family:'Space Grotesk';}
  .stat .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable-row{cursor:pointer;}
  tr.clickable-row:hover{background:var(--paper);}
  .star{cursor:pointer;font-size:16px;color:var(--border);user-select:none;}
  .star.active{color:#F1C40F;text-shadow:0 0 0 #F1C40F;}
  .star:hover{color:var(--accent);}
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);}
  .pill{display:inline-block;padding:3px 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;white-space:nowrap;}
  .pill-todo{background:#F2F2F0;color:#6B6B63;border:1px solid var(--border);}
  .pill-lavorazione{background:#FBE1DA;color:var(--danger);}
  .pill-produzione{background:#FCF3CF;color:#8A6D0B;}
  .pill-done{background:#DFF0E4;color:var(--ok);}
  .pill-delivered{background:#E3E7F0;color:#3D4A78;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.15);}
  .riga-status-select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;min-width:130px;}
  .desc-lavoro{width:100%;min-height:110px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:16px;font-family:inherit;resize:vertical;}
  .desc-lavoro:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .pill-open{background:#FBE1DA;color:var(--danger);}
  .pill-accepted{background:#DFF0E4;color:var(--ok);}
  .pill-sent{background:#DDEAF3;color:var(--teal);}
  .pill-draft{background:#EDEDED;color:var(--muted);}
  .pill-refused{background:#FBE1DA;color:var(--danger);}
  .pill-business{background:#DCE7F5;color:#1D5A9E;}
  .pill-family{background:#FBE7CC;color:#B9660C;}
  .client-dot-business{background:#1D5A9E;}
  .client-dot-family{background:#D9820A;}
  .form-panel{background:var(--card);border:1px dashed var(--accent);border-radius:var(--radius-card);padding:18px;margin-bottom:18px;display:none;}
  .form-panel.open{display:block;}
  .form-panel h3{margin:0 0 14px;font-size:15px;}
  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:800px){.form-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field input, .field select, .field textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--paper);color:var(--text);}
  #clientForm{padding:26px;}
  #clientForm h3{font-size:19px;margin-bottom:20px;}
  #clientForm .field label{font-size:14px;}
  #clientForm .field input, #clientForm .field select{font-size:16px;padding:12px 14px;}
  #clientForm .form-grid{gap:16px;}
  .field textarea{resize:vertical;min-height:56px;}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .checkfield{display:flex;align-items:center;gap:9px;font-size:15px;}
  .checkfield input{width:16px;height:16px;}
  .form-actions{margin-top:14px;display:flex;gap:10px;}
  select.inline{border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:12.5px;padding:5px 8px;border-radius:6px;font-family:inherit;}
  input.inline{border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:12.5px;padding:5px 8px;border-radius:6px;font-family:inherit;}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
  .kanban{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:14px;overflow-x:auto;}
  @media(max-width:1100px){.kanban{grid-template-columns:repeat(5,300px);}}
  .kanban-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;min-width:250px;}
  .kanban-col h4{margin:2px 8px 12px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;font-weight:600;}
  .job-card{background:var(--paper);border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px;border-top:4px dashed var(--accent);font-size:14px;cursor:pointer;}
  .job-card.job-card-business{border-top-color:#1D5A9E;}
  .job-card.job-card-family{border-top-color:#B9660C;}
  .job-card:hover{border-color:var(--accent);}
  .job-card.job-card-importante{border:2px solid #F1C40F;border-top:4px solid #F1C40F;background:#FFFBEB;box-shadow:0 2px 8px rgba(241,196,15,.25);}
  .job-card .jc-star{color:#B8860B;font-size:11.5px;font-weight:800;letter-spacing:.4px;margin-bottom:6px;}
  .job-card .jc-client{font-weight:700;font-size:15px;margin-bottom:4px;}
  .job-card .jc-cat{color:var(--teal);font-size:12.5px;font-weight:600;margin-bottom:6px;}
  .job-card .jc-lines{margin-bottom:8px;}
  .job-card .jc-line{color:var(--teal);font-size:12.5px;font-weight:600;line-height:1.6;}
  .job-card .jc-desc{font-size:13px;color:var(--text);margin-bottom:8px;}
  .job-card .jc-meta{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;margin-top:8px;font-weight:600;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:100000;overflow-y:auto;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;max-width:1080px;width:100%;padding:32px;position:relative;margin-bottom:40px;}
  .modal h2{margin:0 0 4px;font-size:26px;font-weight:800;}
  .jobcard-eyebrow{margin:0;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .jobcard-flags{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .jobcard-flags .checkfield{font-size:13px;white-space:nowrap;gap:6px;}
  .ticket-meta-big{grid-template-columns:1fr 1fr 1fr;}
  .inline-big{font-size:19px !important;padding:13px 14px !important;font-weight:700;}
  input[type="date"].inline-big{font-size:22px !important;padding:16px 16px !important;}
  input[type="date"].inline-big::-webkit-calendar-picker-indicator{transform:scale(1.5);margin-left:8px;cursor:pointer;}
  .status-select-big{border:none;border-radius:7px;}
  @media(max-width:700px){.ticket-meta-big{grid-template-columns:1fr;}}
  .modal h3{font-size:18.5px;font-weight:800;margin:22px 0 12px;}
  .modal .close-x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:24px;background:none;border:none;}
  .modal .btn{font-size:14.5px;padding:11px 20px;}
  .modal .btn-sm{font-size:13px;padding:7px 13px;}
  .ticket-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin:16px 0 20px;font-size:16.5px;font-weight:700;}
  .ticket-meta div span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
  .steps{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .step-row{display:flex;align-items:center;gap:12px;font-size:15px;padding:9px 12px;border-radius:7px;background:var(--card);}
  .step-row input{width:16px;height:16px;}
  .step-row.done label{color:var(--muted);}
  .fasi-group-title{font-size:13.5px;font-weight:700;color:var(--teal);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.3px;}
  .fasi-group-title:first-child{margin-top:0;}
  .low-stock{color:var(--danger);font-weight:700;}
  .demo-tag{background:var(--accent);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:80;}
  .toast.show{opacity:1;transform:translateY(0);}
  a.link{color:var(--teal);text-decoration:none;font-weight:600;}
  .helptext{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:14px;line-height:1.5;}
  .lines-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  .lines-table th{font-size:14px;padding:8px 10px;}
  .lines-table td{padding:10px 10px;border-bottom:none;}
  .lines-table input{width:100%;padding:9px 10px;font-size:15px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .lines-table .num{width:78px;}
  .lines-table .desc-input{min-width:260px;font-weight:600;}
  .riga-categoria-select{width:100%;min-width:190px;padding:14px 14px;font-size:19px;font-weight:700;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .totals-box{background:var(--card);border-radius:8px;padding:14px 18px;margin:12px 0 16px;font-size:15px;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:4px 0;}
  .totals-box .trow.grand{font-weight:700;font-size:19px;border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}
  .pay-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .pay-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:6px;padding:9px 12px;font-size:14.5px;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:360px;}

  /* ============ MOBILE APP / PWA ============ */
  @media(max-width:760px){
    html,body{min-height:100%;overscroll-behavior-y:none;}
    body{
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      background:var(--paper);
    }
    #app{flex-direction:column;min-height:100dvh;}
    aside.sidebar{
      width:100%;height:auto;position:sticky;top:0;z-index:40;
      padding:8px 10px;border-right:none;border-bottom:1px solid var(--border);
      overflow:visible;background:var(--card);
    }
    .brand-logo{display:none;}
    nav.tabs{
      margin-top:0;flex-direction:row;gap:6px;overflow-x:auto;
      -webkit-overflow-scrolling:touch;padding:2px 0 6px;scrollbar-width:none;
    }
    nav.tabs::-webkit-scrollbar{display:none;}
    nav.tabs button{
      flex:0 0 auto;padding:10px 12px;font-size:12.5px;white-space:nowrap;
    }
    .sidebar-footer{display:none;}
    main{padding:14px 12px 34px;width:100%;}
    .topbar{align-items:stretch;margin-bottom:14px;gap:10px;}
    .topbar>div:first-child{width:100%;}
    .topbar h1{font-size:20px;}
    .global-search{order:3;max-width:none;width:100%;}
    #topbarActions{width:100%;display:flex;gap:8px;flex-wrap:wrap;}
    #topbarActions .btn{flex:1;justify-content:center;min-width:120px;}
    .grid-2,.grid-auto{grid-template-columns:1fr;}
    .card{padding:14px;}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{min-width:720px;}
    .modal-backdrop{padding:8px;align-items:flex-start;}
    .modal{padding:18px 14px 28px;border-radius:12px;max-width:none;}
    .modal h2{font-size:22px;padding-right:28px;}
    .ticket-meta,.ticket-meta-big{grid-template-columns:1fr;}
    .lines-table{min-width:760px;}
    .form-grid{grid-template-columns:1fr;}
    .field input,.field select,.field textarea{font-size:16px;}
    input.inline,select.inline{font-size:16px;}
    .btn{min-height:42px;}
    .kanban{grid-template-columns:repeat(5,82vw);}
    .toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center;}
  }


  /* ============ APP STYLE REFRESH ============ */
  :root{
    --menuWeight: 700;
    --headingWeight: 800;
  }
  h1,h2,h3,.section-title,.stat-value,.brand-title{font-weight:var(--headingWeight);}
  .btn{font-weight:700; letter-spacing:.01em;}
  .pill{font-weight:700;}
  .topbar h1{font-weight:800;}
  nav.tabs button{
    font-weight:var(--menuWeight);
    color:#5E6673;
    border-radius:14px;
    transition:all .15s ease;
  }
  nav.tabs button.active{
    font-weight:800;
    color:#fff;
    background:var(--accent);
    box-shadow:0 8px 18px rgba(232,85,47,.18);
  }
  nav.tabs button:not(.active){background:transparent;}
  .table-wrap table thead th{font-weight:800;}
  .card, .modal{
    box-shadow:0 8px 24px rgba(20, 29, 43, .04);
  }

  @media(max-width:760px){
    body{
      background:#F4F6F7;
    }
    aside.sidebar{
      box-shadow:0 6px 18px rgba(20,29,43,.06);
      border-bottom:1px solid #E5E7EB;
    }
    nav.tabs{
      gap:10px;
      padding:6px 2px 8px;
    }
    nav.tabs button{
      padding:12px 16px;
      font-size:14px;
      border:1px solid transparent;
      min-height:48px;
    }
    nav.tabs button.active{
      min-width:max-content;
    }
    .topbar h1{
      font-size:28px;
      line-height:1.08;
    }
    .section-sub, .muted{
      font-size:15px;
    }
    .card{
      border-radius:18px;
    }
    .table-wrap{
      border-radius:18px;
      overflow:hidden;
    }
    .table-wrap table{
      min-width:780px;
    }
    .field label{
      font-weight:700;
      color:#6B7280;
      letter-spacing:.01em;
    }
    .field input,.field select,.field textarea{
      border-radius:14px;
      min-height:48px;
      font-weight:600;
    }
    .modal{
      border-radius:18px;
    }
    .modal h2{
      font-weight:800;
    }
    .btn{
      border-radius:14px;
    }
  }


  /* ============ PREMIUM APP UI ============ */
  :root{
    --paper:#F3F5F7;
    --card:#FFFFFF;
    --text:#1F2937;
    --muted:#6B7280;
    --border:#E7EBF0;
    --accent:#E85A32;
    --accentDark:#D84E26;
    --shadowSoft:0 10px 30px rgba(20,29,43,.06);
    --shadowTiny:0 4px 12px rgba(20,29,43,.05);
    --radius-xl:24px;

  .mail-reader-close{border:0;background:#F5F6F8;width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:20px;flex:0 0 auto;}
  .mail-reader-body{padding:16px;}
  .mail-reader-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .mail-reader-actions .btn{min-height:38px;}
  .mail-body-mode{display:flex;gap:8px;margin-bottom:12px;}
  .mail-body-box{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff;line-height:1.55;overflow-wrap:anywhere;}
  .mail-body-html{width:100%;min-height:300px;border:0;background:#fff;}
  .mail-body-text{white-space:pre-wrap;font-family:inherit;font-size:14px;}
  .mail-attachments{margin-top:16px;}
  .mail-attachments h4{margin:0 0 10px;font-size:14px;}
  .mail-attachment{border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;background:#FAFBFC;}
  .mail-attachment-name{min-width:0;font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mail-attachment-meta{color:var(--muted);font-size:11px;margin-top:2px;}
  .mail-reader-loading,.mail-reader-error{padding:34px 20px;text-align:center;color:var(--muted);}
  .mail-reader-error{color:var(--danger);}
  .mail-row.selected{background:#FFF0EB !important;box-shadow:inset 4px 0 0 var(--accent);}
  @media(max-width:980px){
    .mail-layout{grid-template-columns:1fr;}
    .mail-reader{position:fixed;inset:0;z-index:180;max-height:none;border-radius:0;border:0;overflow:auto;}
    .mail-reader-head{padding-top:max(16px,env(safe-area-inset-top));}
    .mail-reader-body{padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  }


  /* ============ POSTA: RISPOSTA EMAIL ============ */
  .mail-reply-box{
    margin:14px 0 16px;
    border:1px solid var(--border);
    border-radius:16px;
    background:#FAFBFC;
    padding:14px;
  }
  .mail-reply-title{
    font-weight:900;
    font-size:14px;
    margin-bottom:10px;
  }
  .mail-reply-textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    border:1px solid #DDE3EA;
    border-radius:14px;
    background:#fff;
    padding:12px 14px;
    font:inherit;
    font-size:14px;
    line-height:1.5;
  }
  .mail-reply-textarea:focus,
  .mail-reply-option input:focus{
    outline:none;
    border-color:#F09B84;
    box-shadow:0 0 0 4px rgba(232,90,50,.10);
  }
  .mail-reply-toolbar{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-top:10px;
  }
  .mail-reply-options{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .mail-reply-option{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .mail-reply-option.full{grid-column:1 / -1;}
  .mail-reply-option label{
    font-size:11.5px;
    color:var(--muted);
    font-weight:800;
  }
  .mail-reply-option input{
    width:100%;
    min-height:42px;
    border:1px solid #DDE3EA;
    border-radius:12px;
    background:#fff;
    padding:8px 10px;
    font:inherit;
    font-size:13px;
  }
  .mail-signature-note{
    margin-top:10px;
    font-size:11.5px;
    color:var(--muted);
  }
  .mail-send-status{
    margin-top:10px;
    font-size:12px;
    font-weight:750;
  }
  @media(max-width:760px){
    .mail-reply-options{grid-template-columns:1fr;}
    .mail-reply-option.full{grid-column:auto;}
  }


  #gmail-reply-file-input{
    width:100%;
    min-height:44px;
    border:1px solid #DDE3EA;
    border-radius:12px;
    font:inherit;
    font-size:12.5px;
  }


  /* ============ POSTA: CREA LEAD ============ */
  .lead-modal-backdrop{
    position:fixed; inset:0; z-index:9999;
    background:rgba(18,24,32,.48);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .lead-modal{
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.22);
    border:1px solid var(--border);
  }
  .lead-modal-head{
    display:flex; justify-content:space-between; gap:14px; align-items:flex-start;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:#fff; z-index:2;
  }
  .lead-modal-title{font-size:20px;font-weight:900;}
  .lead-modal-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .lead-modal-close{
    border:0;background:#F2F4F7;border-radius:10px;
    width:36px;height:36px;font-size:22px;cursor:pointer;
  }
  .lead-modal-body{padding:18px 20px 20px;}
  .lead-form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .lead-field{display:flex;flex-direction:column;gap:5px;}
  .lead-field.full{grid-column:1 / -1;}
  .lead-field label{
    font-size:11.5px;color:var(--muted);font-weight:800;
  }
  .lead-field input,.lead-field select,.lead-field textarea{
    width:100%;
    border:1px solid #DDE3EA;
    border-radius:12px;
    padding:10px 11px;
    font:inherit;
    font-size:13px;
    background:#fff;
  }
  .lead-field textarea{min-height:130px;resize:vertical;line-height:1.45;}
  .lead-field input:focus,.lead-field select:focus,.lead-field textarea:focus{
    outline:none;border-color:#F09B84;box-shadow:0 0 0 4px rgba(232,90,50,.10);
  }
  .lead-modal-actions{
    display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  }
  .lead-client-warning{
    margin-bottom:14px;
    padding:10px 12px;
    border-radius:12px;
    background:#FFF7E8;
    border:1px solid #F3D49A;
    font-size:12.5px;
  }
  @media(max-width:700px){
    .lead-modal-backdrop{padding:0;align-items:stretch;}
    .lead-modal{width:100%;max-height:none;height:100%;border-radius:0;}
    .lead-form-grid{grid-template-columns:1fr;}
    .lead-field.full{grid-column:auto;}
  }


  /* ============ SEZIONE LEAD ============ */
  .lead-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .lead-stat{padding:14px 16px;border:1px solid var(--border);border-radius:16px;background:#fff;}
  .lead-stat strong{display:block;font-size:26px;line-height:1.1;margin-top:4px;}
  .lead-stat span{font-size:11.5px;color:var(--muted);font-weight:800;}
  .lead-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .lead-toolbar input,.lead-toolbar select{
    min-height:42px;border:1px solid #DDE3EA;border-radius:12px;padding:8px 11px;background:#fff;font:inherit;font-size:13px;
  }
  .lead-toolbar input{flex:1;min-width:220px;}
  .lead-status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;background:#F2F4F7;}
  .lead-status-nuovo{background:#FFF0EA;color:#B94724;}
  .lead-status-ok{background:#EAF8F0;color:#24764A;}
  .lead-status-wait{background:#FFF7E8;color:#936319;}
  .lead-status-lost{background:#F3F4F6;color:#69707A;}
  .lead-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .lead-table-wrap{overflow:auto;}
  .lead-table{width:100%;min-width:900px;border-collapse:collapse;}
  .lead-table th,.lead-table td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;font-size:12.5px;}
  .lead-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .lead-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .lead-detail-box{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:11px 12px;}
  .lead-detail-box small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px;}
  .lead-detail-request{white-space:pre-wrap;line-height:1.5;max-height:300px;overflow:auto;}
  .dashboard-lead-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .dashboard-lead-row:last-child{border-bottom:0;}
  @media(max-width:850px){.lead-stats{grid-template-columns:1fr 1fr;}.lead-detail-grid{grid-template-columns:1fr;}}


  .lead-table select.inline{
    min-height:36px;
    padding:5px 8px;
    border-radius:10px;
    border:1px solid #DDE3EA;
    background:#fff;
    font-size:12px;
  }


  /* ============ MENU PER MACRO AREE ============ */
  .nav-group{margin:0 0 12px;}
  .nav-group-title,
  .sidebar-system-title{
    margin:10px 12px 6px;
    font-size:10px;
    line-height:1;
    font-weight:900;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:.9;
  }
  .nav-group + .nav-group{
    padding-top:8px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .sidebar-system-title{
    margin:0 10px 8px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .mobile-nav-group-title{
    padding:10px 12px 5px;
    font-size:10px;
    font-weight:900;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .mobile-nav-group-title:not(:first-child){
    margin-top:6px;
    border-top:1px solid var(--border);
  }


  .desktop-nav-buttons .nav-group-operativa{
    background:#FFF0E8;
    border-radius:14px;
    padding:8px 6px 10px;
    margin:6px 0 12px;
  }
  .desktop-nav-buttons .nav-group-operativa .nav-group-title{
    margin-top:4px;
  }


  /* ============ MOBILE: MENU / DASHBOARD ============ */
  @media(max-width:760px){
    .mobile-nav-trigger{
      min-height:64px !important;
      font-size:18px !important;
      font-weight:900 !important;
      text-transform:uppercase;
      letter-spacing:.035em;
      padding:0 18px !important;
    }

    .mobile-nav-dropdown{
      padding:10px !important;
    }

    .mobile-nav-dropdown button{
      min-height:58px !important;
      padding:13px 14px !important;
      font-size:16px !important;
      font-weight:900 !important;
      text-transform:uppercase;
      letter-spacing:.025em;
    }

    .mobile-nav-group-title{
      font-size:11px !important;
      padding:12px 12px 7px !important;
    }

    .sidebar-tool-btn{
      min-height:54px !important;
      font-size:14px !important;
      font-weight:900 !important;
      text-transform:uppercase;
      letter-spacing:.025em;
    }

    /* Evidenzia la macro area OPERATIVA anche nel menu mobile */
    .mobile-nav-group-title:nth-of-type(2){
      background:#FFF0E8;
      border-radius:12px 12px 0 0;
      margin-top:8px !important;
      padding-top:12px !important;
      border-top:0 !important;
    }

    .mobile-nav-group-title:nth-of-type(2) + button,
    .mobile-nav-group-title:nth-of-type(2) + button + button,
    .mobile-nav-group-title:nth-of-type(2) + button + button + button{
      background:#FFF0E8;
    }

    .mobile-nav-group-title:nth-of-type(2) + button + button + button{
      border-radius:0 0 12px 12px;
      margin-bottom:8px;
    }

    /* Solo mobile: elimina interamente queste due sezioni dalla Dashboard */
    #view-dashboard .dashboard-workload-section,
    #view-dashboard .dashboard-crediti-aperti{
      display:none !important;
    }
  }


  /* ============ POSTA: LETTE NORMALI, NON LETTE IN GRASSETTO ============ */
  .mail-from,
  .mail-subject{
    font-weight:500 !important;
  }
  .mail-row.mail-unread .mail-from,
  .mail-row.mail-unread .mail-subject{
    font-weight:850 !important;
  }


  .mail-action-status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:900;margin-top:6px;margin-left:5px;letter-spacing:.02em;}
  .mail-action-status.wait{background:#FFF4D9;color:#8A5A00;}
  .mail-action-status.lead{background:#EAF3FF;color:#275FA8;}
  .mail-action-status.order{background:#EAF8F0;color:#24764A;}


  .mail-reader-actions .btn:disabled{
    opacity:1;
    cursor:default;
    box-shadow:none;
    background:#F3F5F7;
    color:#46515E;
    border-color:#DDE3EA;
  }


  .mail-reader-actions .btn{
    transition:all .18s ease;
  }
  .mail-reader-actions .btn:disabled{
    background:#F1F3F5 !important;
    color:#34404D !important;
    border-color:#D8DEE5 !important;
    font-weight:900 !important;
  }


  .mail-reader-actions .mail-action-done{
    background:#F1F3F5 !important;
    color:#34404D !important;
    border-color:#D8DEE5 !important;
    font-weight:900 !important;
  }


  #view-note .list-row,
  #view-clienti .list-row{gap:14px;}
  @media(max-width:760px){
    #view-note .list-row{
      align-items:flex-start;
      flex-direction:column;
    }
    #view-note .list-row .btn{
      width:100%;
    }
  }


  /* ============ POSTA: LETTO + SCHEDA GRANDE CENTRATA ============ */
  @media(min-width:981px){
    .mail-reader{
      position:fixed !important;
      left:50% !important;
      top:50% !important;
      transform:translate(-50%,-50%) !important;
      width:min(1120px, calc(100vw - 100px)) !important;
      height:min(840px, calc(100vh - 70px)) !important;
      min-height:620px !important;
      max-height:calc(100vh - 70px) !important;
      z-index:220 !important;
      border-radius:28px !important;
      overflow:auto !important;
      box-shadow:0 28px 90px rgba(20,29,43,.30), 0 0 0 9999px rgba(20,29,43,.34) !important;
    }
    .mail-reader-head{
      padding:24px 28px !important;
    }
    .mail-reader-subject{
      font-size:28px !important;
    }
    .mail-reader-meta{
      font-size:14px !important;
    }
    .mail-reader-body{
      padding:26px 28px 34px !important;
    }
    .mail-reader-actions .btn{
      min-height:52px !important;
      padding:12px 22px !important;
      font-size:16px !important;
    }
    .mail-body-html{
      min-height:470px !important;
    }
    .mail-body-text{
      font-size:16px !important;
    }
    .mail-reply-textarea{
      min-height:210px !important;
      font-size:16px !important;
    }
  }

</style>
</head>

function warehouseColorKey(v){ return canonicalWarehouseColor(v).toLowerCase(); }
function warehouseColorRank(v){
  const c = warehouseColorKey(v);
  if(c==="white") return 0;
  if(c==="black") return 1;
  return 2;
}
function compareWarehouseColors(a,b){
  const ra=warehouseColorRank(a), rb=warehouseColorRank(b);
  if(ra!==rb) return ra-rb;
  return canonicalWarehouseColor(a).localeCompare(canonicalWarehouseColor(b),"en",{sensitivity:"base"});
}
function normalizeStockColor(v){ return String(v||"").trim().toUpperCase(); }
function minimoDefaultMagazzino(w){
  const code=String(w.codice||"").trim().toUpperCase();
  const color=normalizeStockColor(w.colore);
  const size=String(w.taglia||"").trim().toUpperCase();
  const rule=STOCK_ALERT_RULES.find(r=>r.codice===code && r.colori.includes(color) && r.taglie.includes(size));
  return rule ? rule.minimo : 0;
}
function minimoRichiestoMagazzino(w){
  if(w && w.scortaMinima!==null && w.scortaMinima!==undefined && !Number.isNaN(Number(w.scortaMinima))){
    return Math.max(0, Number(w.scortaMinima)||0);
  }
  return minimoDefaultMagazzino(w);
}
function computeScorteMonitorate(){
  return state.warehouse
    .filter(w=>{
      const minimo = Math.max(0, Number(w.scortaMinima)||0);
      return minimo>0 && Number(w.quantita||0) <= minimo;
    })
    .map(w=>({
      ...w,
      quantita:Number(w.quantita)||0,
      scortaMinima:Math.max(0, Number(w.scortaMinima)||0),
      virtuale:false
    }))
    .sort((a,b)=>

      String(a.colore||"").localeCompare(String(b.colore||"")) ||
      String(a.taglia||"").localeCompare(String(b.taglia||""))
    );
}

/* ---- Caricamento iniziale da Supabase (tutte le tabelle in parallelo) ---- */
async function loadAllFromSupabase(){
  const collections = Object.keys(TABLES);
  const results = await Promise.all(collections.map(c => c==="warehouse" ? sb.from(TABLES[c]).select("*").gt("quantita",0) : sb.from(TABLES[c]).select("*")));
  collections.forEach((c, i) => {
    const { data, error } = results[i];
    if(error){ console.error("Errore caricamento", c, error); state[c] = []; return; }
    state[c] = (data||[]).map(r => fromDbRow(c, r));
  });
  // Le fasi vanno ricalcolate se qualche categoria non ha più il template previsto, preservando le spunte già fatte
  state.orders.forEach(o => recalcFasi(o));
  // Le scorte minime vengono lette dal database e possono essere modificate manualmente.
  // Per le vecchie varianti monitorate resta solo un valore iniziale di sicurezza se manca del tutto.
  state.warehouse.forEach(w=>{
    if(w.scortaMinima===null || w.scortaMinima===undefined || Number.isNaN(Number(w.scortaMinima))){
      w.scortaMinima = minimoDefaultMagazzino(w);
    } else {
      w.scortaMinima = Math.max(0, Number(w.scortaMinima)||0);
    }
  });
}

/* ---- Scrittura: aggiorna/crea tutte le righe attuali di una collezione (upsert) ---- */
async function syncCollection(name){
  const rows = state[name].map(o => toDbRow(name, o));
  if(!rows.length) return true;
  const { error } = await sb.from(TABLES[name]).upsert(rows);
  if(error){
    console.error("Errore salvataggio", name, error);
    showToast(`Errore salvataggio ${name}: ${error.message || "riprova"}`);
    return false;
  }
  return true;
}

/* Salvataggio mirato di una sola riga: usato nei flussi nuovo cliente -> nuovo ordine,
   così l'ordine non può essere creato prima che il cliente esista davvero su Supabase. */
async function upsertOne(collection, obj){
  const row = toDbRow(collection, obj);
  const { error } = await sb.from(TABLES[collection]).upsert(row);
  if(error){
    console.error("Errore salvataggio", collection, error);
    showToast(`Errore salvataggio ${collection}: ${error.message || "riprova"}`);
    return false;
  }
  return true;
}
async function upsertOneReturning(collection, obj){
  const row = toDbRow(collection, obj);
  const { data, error } = await sb.from(TABLES[collection]).upsert(row).select("*").single();
  if(error){
    console.error("Errore salvataggio", collection, error);
    showToast(`Errore salvataggio ${collection}: ${error.message || "riprova"}`);
    return null;
  }
  return data ? fromDbRow(collection, data) : obj;
}
/* ---- Cancellazione mirata ---- */
async function dbDelete(name, id){
  const { error } = await sb.from(TABLES[name]).delete().eq("id", id);
  if(error){ console.error("Errore eliminazione", name, error); showToast("Errore nell'eliminazione: riprova"); }
}
async function dbDeleteMany(name, ids){
  if(!ids.length) return;
  const { error } = await sb.from(TABLES[name]).delete().in("id", ids);
  if(error){ console.error("Errore eliminazione multipla", name, error); showToast("Errore nell'eliminazione: riprova"); }
}
/* Compatibilità: chiamate rimaste generiche vengono instradate sulla collezione giusta quando possibile */
function saveState(name){
  if(name) { syncCollection(name); return; }
  console.warn("saveState() chiamato senza indicare la collezione: nessuna sincronizzazione effettuata.");
}

/* ---- Aggiornamenti in tempo reale da altri dispositivi ---- */
function subscribeRealtime(){
  Object.keys(TABLES).forEach(name=>{
    sb.channel(`${name}-changes`)
      .on("postgres_changes", {event:"*", schema:"public", table:TABLES[name]}, payload => {
        if(payload.eventType === "DELETE"){
          state[name] = state[name].filter(x=>x.id !== payload.old.id);
        } else {
          const row = fromDbRow(name, payload.new);
          const idx = state[name].findIndex(x=>x.id===row.id);
          if(name==="warehouse" && Number(row.quantita)<=0){
            if(idx>=0) state[name].splice(idx,1);
          } else {
            if(idx>=0) state[name][idx] = row; else state[name].push(row);
          }
          if(name==="orders") recalcFasi(state[name].find(x=>x.id===row.id));
        }
        renderCurrentView();
      })
      .subscribe();
  });
}

let catalogoProdotti = null;
let catalogoByCode = new Map();
let catalogoLoadPromise = null;

function normalizeCatalogCode(value){
  return String(value||"").split("—")[0].trim().toUpperCase();
}
function loadCatalogoProdotti(){
  if(catalogoProdotti) return Promise.resolve(catalogoProdotti);
  if(catalogoLoadPromise) return catalogoLoadPromise;
  catalogoLoadPromise = new Promise((resolve,reject)=>{
    const script = document.createElement("script");
    script.src = "./catalogo-actionwear.js";
    script.async = true;
    script.onload = ()=>{
      catalogoProdotti = Array.isArray(window.ACTION_WEAR_CATALOG) ? window.ACTION_WEAR_CATALOG : [];
      catalogoByCode = new Map(catalogoProdotti.map(p=>[String(p.code||"").toUpperCase(), p]));
      resolve(catalogoProdotti);
    };
    script.onerror = ()=>{
      catalogoLoadPromise = null;
      showToast("Catalogo non trovato: carica anche catalogo-actionwear.js su GitHub");
      reject(new Error("catalogo-actionwear.js non disponibile"));
    };
    document.head.appendChild(script);
  });
  return catalogoLoadPromise;
}
function catalogProduct(code){
  return catalogoByCode.get(String(code||"").toUpperCase()) || null;
}
function catalogNameForCode(code){
  const p = catalogProduct(code);
  if(p) return p.name || "";
  const w = state.warehouse.find(x=>String(x.codice||"").toUpperCase()===String(code||"").toUpperCase());
  return w ? (w.nome||"") : "";
}
function catalogColorsForCode(code){
  const p = catalogProduct(code);
  return p && Array.isArray(p.colors) ? p.colors : [];
}
function catalogSizesForCode(code){
  const p = catalogProduct(code);
  if(p && Array.isArray(p.sizes) && p.sizes.length) return p.sizes;
  return p ? ["UNICA"] : [];
}
async function prepareCatalogDatalistForOrder(orderId){
  const dl = document.getElementById("catalogProductList");
  if(!dl) return;
  dl.innerHTML = `<option value="Caricamento catalogo…"></option>`;
  try{
    await loadCatalogoProdotti();
    const o = findItem('orders', orderId);
    const allowed = magazzinoAllowedCategorie(o);
    const products = catalogoProdotti.filter(p=>!allowed.size || allowed.has(p.appCategory));
    dl.innerHTML = "";
    products.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = `${p.code} — ${p.name}`;
      dl.appendChild(opt);
    });
    // Aggiunge anche eventuali articoli reali di magazzino non presenti nel catalogo.
    [...new Set(state.warehouse.map(w=>w.codice).filter(Boolean))].forEach(code=>{
      if(catalogProduct(code)) return;
      const w = state.warehouse.find(x=>x.codice===code);
      if(allowed.size && w && !allowed.has(w.categoria)) return;
      const opt = document.createElement("option");
      opt.value = `${code} — ${w&&w.nome?w.nome:"Articolo magazzino"}`;
      dl.appendChild(opt);
    });
  }catch(e){ console.error(e); }
}

/* Ridisegna una vista preservando il focus e la posizione del cursore sul campo attivo (usato dalle ricerche, che altrimenti perdono il focus a ogni lettera) */
function rerenderKeepingFocus(renderFn){
  const active = document.activeElement;
  const id = active && active.id;
  const canSelect = active && typeof active.selectionStart === "number";
  const selStart = canSelect ? active.selectionStart : null;
  const selEnd = canSelect ? active.selectionEnd : null;
  renderFn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

async function setLeadStatus(id,status){
  const l=(state.leads||[]).find(x=>x.id===id);
  if(!l) return;
  const old=l.stato;
  l.stato=status;
  l.aggiornatoIl=new Date().toISOString();
  const {error}=await sb.from("leads").update({stato:status,aggiornato_il:l.aggiornatoIl}).eq("id",id);
  if(error){
    l.stato=old;
    console.error(error);
    showToast("Errore aggiornamento Lead");
    return;
  }
  showToast("Lead aggiornato");
  if(currentView==="leads") renderLeads();
  if(currentView==="dashboard") renderDashboard();
}


async function changeLeadStatusFromSelect(id,status,reopenDetail=false){
  await setLeadStatus(id,status);
  if(reopenDetail) openLeadDetail(id);
}

function leadClientPrefill(l){
  const fullName=String(l?.nome||"").trim();
  const parts=fullName.split(/\s+/).filter(Boolean);
  const nome=parts.length ? parts[0] : "";
  const cognome=parts.length>1 ? parts.slice(1).join(" ") : "";

  if(String(l?.azienda||"").trim()){
    return {
      tipo:"Business",
      ragioneSociale:String(l.azienda||"").trim(),
      refNome:nome,
      refCognome:cognome,
      email:String(l.email||"").trim(),
      telefono:String(l.telefono||"").trim()
    };
  }

  return {
    tipo:"Family",
    nome:nome || fullName,
    cognome,
    email:String(l.email||"").trim(),
    telefono:String(l.telefono||"").trim()
  };
}

    askConfirm(
      msg,
      async ()=>{
        await setLeadStatus(id,"Accettato");
        closeModal();
        showToast("Lead collegato al cliente");
        if(inserisciOrdine) newOrderForClient(existing.id, id);

  document.getElementById("modalBody").innerHTML=`

      <button class="btn btn-primary" onclick="saveLeadAsClient('${id}', ${inserisciOrdine ? "true" : "false"})">

async function expireStaleWaitingLeads(){
  const now=Date.now();
  const sevenDays=7*24*60*60*1000;
  const stale=(state.leads||[]).filter(l=>{
    if(l.stato!=="In attesa di conferma") return false;
    const ts=new Date(l.aggiornatoIl||l.creatoIl||0).getTime();
    return ts && (now-ts)>=sevenDays;
  });

  if(!stale.length) return;

  const nowIso=new Date().toISOString();
  for(const l of stale){
    const {error}=await sb.from("leads")
      .update({stato:"Perso",aggiornato_il:nowIso})
      .eq("id",l.id);

    if(!error){
      l.stato="Perso";
      l.aggiornatoIl=nowIso;
    }else{
      console.error("Errore scadenza automatica Lead",l.id,error);
    }
  }

  if(currentView==="leads") renderLeads();
  if(currentView==="dashboard") renderDashboard();
}

async function addNotaComunicazione(){
  const tipo=document.getElementById("nota-tipo")?.value||"Chiamata";
  const nomePersona=String(document.getElementById("nota-persona")?.value||"").trim();
  const testo=String(document.getElementById("nota-testo")?.value||"").trim();
  const operatore=String(document.getElementById("nota-operatore")?.value||"").trim();

  if(!nomePersona){ showToast("Inserisci il nome della persona"); return; }
  if(!testo){ showToast("Inserisci il testo della nota"); return; }
  if(!operatore){ showToast("Seleziona l'operatore"); return; }

  const note={
    id:uid(), tipo, nomePersona, testo, operatore,
    fatto:false, creatoIl:new Date().toISOString(), fattoIl:""
  };
  const saved=await upsertOneReturning("noteComunicazioni",note);
  if(!saved) return;
  const i=state.noteComunicazioni.findIndex(x=>x.id===saved.id);
  if(i>=0) state.noteComunicazioni[i]=saved; else state.noteComunicazioni.push(saved);
  renderNote();
  showToast("Nota salvata");
}
async function markNotaFatta(id){
  const n=findItem("noteComunicazioni",id);
  if(!n) return;
  n.fatto=true;
  n.fattoIl=new Date().toISOString();
  const saved=await upsertOneReturning("noteComunicazioni",n);
  if(!saved) return;
  const i=state.noteComunicazioni.findIndex(x=>x.id===id);
  if(i>=0) state.noteComunicazioni[i]=saved;
  renderNote();
  showToast("Nota archiviata");
}
async function cleanupOldNoteComunicazioni(){
  const cutoff=Date.now()-(4*24*60*60*1000);
  const old=(state.noteComunicazioni||[]).filter(n=>n.fatto && n.fattoIl && new Date(n.fattoIl).getTime()<=cutoff);
  if(!old.length) return;

  const ids=old.map(n=>n.id);
  const {error}=await sb.from("note_comunicazioni").delete().in("id",ids);
  if(error){
    console.error("Errore pulizia note completate",error);
    return;
  }
  state.noteComunicazioni=state.noteComunicazioni.filter(n=>!ids.includes(n.id));
  if(currentView==="note") renderNote();
}

function orderInsertionSortValue(o){
  const ts=o?.createdAt ? Date.parse(o.createdAt) : NaN;
  if(Number.isFinite(ts)) return {hasDate:1, date:ts, numero:Number(o?.numero)||0};
  return {hasDate:0, date:0, numero:Number(o?.numero)||0};
}
function compareOrdersNewestFirst(a,b){
  const A=orderInsertionSortValue(a), B=orderInsertionSortValue(b);
  if(A.hasDate && B.hasDate && A.date!==B.date) return B.date-A.date;
  if(A.numero!==B.numero) return B.numero-A.numero;
  if(A.date!==B.date) return B.date-A.date;
  return String(b?.id||"").localeCompare(String(a?.id||""));
}
function creditiApertiRaggruppati(){
  const map = new Map();
  state.orders.filter(o=>o.stato==="Consegnato").forEach(o=>{
    const saldo = orderSaldo(o);
    if(saldo<=0.001) return;
    if(!map.has(o.clientId)) map.set(o.clientId, []);
    map.get(o.clientId).push({o, saldo});
  });
  return [...map.entries()]
    .map(([clientId, orders])=>{
      const ordinati = [...orders].sort((a,b)=>compareOrdersNewestFirst(a.o,b.o));
      return {
        clientId,
        orders: ordinati,
        totaleSaldo: ordinati.reduce((s,x)=>s+x.saldo,0),
        ultimoInserimentoOrdine: ordinati[0]?.o || null
      };
    })
    .sort((a,b)=>compareOrdersNewestFirst(a.ultimoInserimentoOrdine,b.ultimoInserimentoOrdine));
}

async function sendAvvisoClienteMail(orderId){
  const o=findItem('orders',orderId);
  const c=o ? state.clients.find(x=>x.id===o.clientId) : null;
  if(!o || !c) return;

  const to=String(document.getElementById("avviso-mail-to")?.value||c.email||"").trim();
  const subject=String(document.getElementById("avviso-mail-subject")?.value||"Lavoro pronto").trim();
  const bodyText=String(document.getElementById("avviso-mail-body")?.value||"").trim();
  const status=document.getElementById("avviso-mail-status");
  const btn=document.getElementById("avviso-mail-send");

  if(!to || !bodyText){
    showToast("Controlla email e messaggio");
    return;
  }

  if(btn) btn.disabled=true;
  if(status) status.textContent="Invio in corso…";

  try{
    const {data:sessionData}=await sb.auth.getSession();
    const session=sessionData?.session;
    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");

    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${session.access_token}`,
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        mode:"new",
        to,
        subject,
        bodyText,
        attachments:[]
      })
    });

    const raw=await response.text();
    let result={};
    try{ result=JSON.parse(raw); }catch(e){ result={}; }

    if(!response.ok){
      throw new Error(result?.error||result?.message||raw||`Errore HTTP ${response.status}`);
    }

    await markClienteAvvisato(orderId,"Mail");
    closeModal();
    showToast("Mail inviata · Cliente AVVISATO");
  }catch(err){
    console.error("Invio avviso cliente via Gmail",err);
    if(status) status.textContent=`Errore: ${err?.message||"invio non riuscito"}`;
    if(btn) btn.disabled=false;
  }
}

let globalSearchMap = {};
function positionGlobalSearchDropdown(){
  const input=document.getElementById('globalClientSearch');
  const dd=document.getElementById('globalSearchDropdown');
  if(!input||!dd) return;
  const r=input.getBoundingClientRect();
  dd.style.left=`${Math.round(r.left)}px`;
  dd.style.top=`${Math.round(r.bottom+6)}px`;
  dd.style.width=`${Math.round(r.width)}px`;
}
function updateGlobalClientSuggestions(value){
  const dd = document.getElementById('globalSearchDropdown');
  const v = value.trim();
  if(v.length < 2){ dd.style.display = "none"; dd.innerHTML = ""; globalSearchMap = {}; return; }
  const q = v.toLowerCase();
  const qCompact = q.replace(/[^a-z0-9àèéìòù]/gi, "");
  const qDigits = q.replace(/\D/g, "");
  const matches = state.clients.filter(c=>{
    const display = clientDisplayName(c).toLowerCase();
    const nome = (c.nome||c.refNome||"").toLowerCase();
    const cognome = (c.cognome||c.refCognome||"").toLowerCase();
    const ragione = (c.ragioneSociale||"").toLowerCase();
    const email = (c.email||"").toLowerCase();
    const piva = (c.partitaIva||"").toLowerCase();
    const telefono = (c.telefono||"");
    const telefonoDigits = telefono.replace(/\D/g, "");
    const nameForward = `${nome} ${cognome}`.trim();
    const nameReverse = `${cognome} ${nome}`.trim();
    const searchable = [display,nome,cognome,ragione,email,piva,nameForward,nameReverse].join(" ");
    return searchable.includes(q) ||
      searchable.replace(/[^a-z0-9àèéìòù]/gi, "").includes(qCompact) ||
      (qDigits.length >= 2 && telefonoDigits.includes(qDigits));
  }).slice(0,10);
  globalSearchMap = {};
  matches.forEach(c => { globalSearchMap[c.id] = c; });
  dd.innerHTML = matches.length
    ? matches.map(c=>`<div class="gsd-item" onmousedown="goToClientById('${c.id}')">
        <div>${clientDisplayName(c)}</div>
        ${(c.telefono||c.email) ? `<div style="font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px;">${[c.telefono,c.email].filter(Boolean).join(' · ')}</div>` : ''}
      </div>`).join("")
    : `<div class="gsd-empty">Nessun cliente trovato</div>`;
  positionGlobalSearchDropdown();
  dd.style.display = "block";
}

/* Crea (o aggiorna, se existingId è passato) un cliente leggendo i campi con un dato prefisso.
   IMPORTANTE: ritorna l'id solo DOPO che Supabase ha confermato il salvataggio. */
async function createClientFromPrefix(prefix, existingId){
  const tipo = document.getElementById(`${prefix}-tipo`).value;
  const telefono = document.getElementById(`${prefix}-telefono`).value.trim();
  const email = document.getElementById(`${prefix}-email`).value.trim();
  if(!telefono && !email){ showToast("Inserisci almeno telefono o email"); return null; }

  const comuni = readCommonClientFields(prefix);
  let payload;

  if(tipo==="Business"){
    const ragioneSociale = document.getElementById(`${prefix}-ragsoc`).value.trim();
    const settore = document.getElementById(`${prefix}-settore`).value;
    if(!ragioneSociale){ showToast("Inserisci il nome dell'azienda"); return null; }
    if(!settore){ showToast("Il settore è obbligatorio per i clienti Business"); return null; }
    payload = {
      tipo, ragioneSociale,
      refNome:document.getElementById(`${prefix}-refnome`).value.trim(),
      refCognome:document.getElementById(`${prefix}-refcognome`).value.trim(),
      settore, richiesta:"", telefono, email, ...comuni
    };
  } else {
    const nome = document.getElementById(`${prefix}-nome`).value.trim();
    if(!nome){ showToast("Inserisci il nome della persona"); return null; }
    const richiesta = document.getElementById(`${prefix}-richiesta`)?.value || "";
    payload = {
      tipo, nome,
      cognome:document.getElementById(`${prefix}-cognome`).value.trim(),
      settore:"", richiesta, telefono, email, ...comuni
    };
  }

  if(existingId){
    const c = findItem('clients', existingId);
    if(!c) return null;
    const backup = {...c};
    Object.assign(c, payload);
    const ok = await upsertOne('clients', c);
    if(!ok){
      Object.keys(c).forEach(k=>delete c[k]);
      Object.assign(c, backup);
      return null;
    }
    return existingId;
  }

  const id = uid();
  const nuovo = {id, ...payload, archiviatoRecenti:false};
  const saved = await upsertOneReturning('clients', nuovo);
  if(!saved) return null;

  const existingIdx=state.clients.findIndex(c=>c.id===id);
  if(existingIdx>=0) state.clients[existingIdx]=saved;
  else state.clients.push(saved);
  return id;
}

    const pagamentiCollegati = state.payments.filter(p=>p.clientId===id);
    ordiniCollegati.forEach(o=>o.clientId=null);
    preventiviCollegati.forEach(q=>q.clientId=null);
    pagamentiCollegati.forEach(p=>p.clientId=null);

  });

/* ============ IMPORT CSV CLIENTI ============ */
function parseCsvLine(line){
  const out = []; let cur = ""; let inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
function parseClientsCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const rows = lines.map(parseCsvLine);
  const headerIdx = rows.findIndex(r => r.some(c=>c.trim().toLowerCase()==="ragione sociale"));
  if(headerIdx === -1){ showToast("Formato CSV non riconosciuto: manca la colonna 'Ragione sociale'"); return []; }
  const header = rows[headerIdx].map(h=>h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const cRagSoc=idx("ragione sociale"), cNome=idx("nome"), cCognome=idx("cognome"), cTipologia=idx("tipologia"),
        cIndirizzo=idx("indirizzo"), cComune=idx("comune"), cCap=idx("cap"), cProvincia=idx("provincia"),
        cPiva=idx("partita iva"), cCf=idx("codice fiscale"), cCell=idx("cellulare"), cTel=idx("telefono"),
        cEmail=idx("email"), cPec=idx("pec");
  const get = (r,i) => (i>=0 && r[i]!==undefined) ? r[i].trim() : "";
  const clients = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r.some(c=>c.trim())) continue;
    const ragsoc = get(r,cRagSoc).replace(/^:\s*/,"");
    const nome = get(r,cNome), cognome = get(r,cCognome);
    if(!ragsoc && !nome && !cognome) continue;
    const tipologia = get(r,cTipologia);
    const tipo = (tipologia==="Privato" || tipologia==="Persona fisica titolare di Partita IVA") ? "Family" : "Business";
    const common = {
      telefono: get(r,cCell) || get(r,cTel), email: get(r,cEmail), settore:"",
      indirizzo: get(r,cIndirizzo), citta: get(r,cComune), cap: get(r,cCap), provincia: get(r,cProvincia),
      partitaIva: get(r,cPiva), codiceFiscale: get(r,cCf), pec: get(r,cPec),
      _importBatch: "csv_" + today(),
      archiviatoRecenti: true
    };
    if(tipo==="Business"){
      clients.push({id:uid(), tipo, ragioneSociale: ragsoc || `${nome} ${cognome}`.trim(), refNome:nome, refCognome:cognome, ...common});
    } else {
      clients.push({id:uid(), tipo, nome: nome || ragsoc, cognome, ...common});
    }
  }
  return clients;
}
function handleClientCsvUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseClientsCsv(e.target.result);
    if(!parsed.length){ showToast("Nessun cliente valido trovato nel file"); return; }
    state.clients.push(...parsed);
    saveState('clients'); toggleForm('importForm'); renderClienti();
    showToast(`${parsed.length} clienti importati`);
  };
  reader.readAsText(file, "UTF-8");
}

function magazzinoColoriDisponibili(codice){
  const map = new Map();
  state.warehouse.filter(w=>String(w.codice||"").toUpperCase()===String(codice||"").toUpperCase()).forEach(w=>{

  });
  return map;

function magazzinoTaglieDisponibili(codice,colore){
  const map = new Map();
  state.warehouse.filter(w=>
    String(w.codice||"").toUpperCase()===String(codice||"").toUpperCase() &&
    warehouseColorKey(w.colore)===warehouseColorKey(colore)
  ).forEach(w=>{
    const key=String(w.taglia||"").trim() || "UNICA";
    map.set(key,(map.get(key)||0)+Math.max(0,Number(w.quantita)||0));
  });

}
function magazzinoColoreDatalistOptions(codice){
  if(!codice) return "";
  const disponibiliRaw = magazzinoColoriDisponibili(codice);
  const disponibili = new Map();
  disponibiliRaw.forEach((qty,color)=>{
    const canonical = canonicalWarehouseColor(color);
    disponibili.set(canonical,(disponibili.get(canonical)||0)+qty);
  });
  const catalogo = catalogColorsForCode(codice).map(c=>canonicalWarehouseColor(c));
  const vals = [...new Set([...disponibili.keys(), ...catalogo])];
  vals.sort((a,b)=>{
    const qa=disponibili.get(a)||0, qb=disponibili.get(b)||0;
    if((qa>0)!==(qb>0)) return qa>0 ? -1 : 1;
    return compareWarehouseColors(a,b);
  });
  return vals.map(v=>{
    const q=disponibili.get(v)||0;
    return `<option value="${v}">${q>0?`Disponibile: ${q} pz`:"Catalogo — da ordinare"}</option>`;
  }).join("");
}
function magazzinoTagliaDatalistOptions(codice,colore){
  if(!codice || !colore) return "";
  const disponibili = magazzinoTaglieDisponibili(codice,colore);
  const catalogo = catalogSizesForCode(codice);
  const vals = [...new Set([...disponibili.keys(), ...catalogo])];
  vals.sort((a,b)=>{
    const qa=disponibili.get(a)||0, qb=disponibili.get(b)||0;
    if((qa>0)!==(qb>0)) return qb>0 ? 1 : -1;
    if(qa!==qb) return qb-qa;
    return a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"});
  });
  return vals.map(v=>{
    const q=disponibili.get(v)||0;
    return `<option value="${v}">${q>0?`Disponibile: ${q} pz`:"Catalogo — da ordinare"}</option>`;
  }).join("");
}
function restoreReservedStock(entry){
  if(entry && entry.articoloId && Number(entry._reservedQty)>0){
    adjustWarehouseQty(entry.articoloId, Number(entry._reservedQty));
  }
}
function tryStornoMagazzino(entry){
  restoreReservedStock(entry);
  entry.stornato = false;
  entry._reservedQty = 0;
  entry.articoloId = "";
  entry.daOrdinareQty = 0;
  entry.ordineConfermato = false;
  entry.inCarrello = false;
  entry.inCarrelloAt = null;

  const richiesta = Math.max(0,Number(entry.quantita)||0);
  if(!entry.codice || !entry.colore || !entry.taglia || !richiesta) return;

  const w = state.warehouse.find(x=>
    String(x.codice||"").toUpperCase()===String(entry.codice||"").toUpperCase() &&
    warehouseColorKey(x.colore)===warehouseColorKey(entry.colore) &&
    (String(x.taglia||"").toUpperCase()===String(entry.taglia||"").toUpperCase() ||
     (!String(x.taglia||"").trim() && String(entry.taglia||"").toUpperCase()==="UNICA"))
  );
  if(!w){
    entry.daOrdinareQty = richiesta;
    return;
  }

  const disponibile = Math.max(0,Number(w.quantita)||0);
  const daStornare = Math.min(disponibile, richiesta);

  if(daStornare>0){
    w.quantita = disponibile - daStornare;
    entry._reservedQty = daStornare;
    entry.articoloId = w.id;
  }

  entry.daOrdinareQty = Math.max(0, richiesta - daStornare);
  entry.stornato = entry.daOrdinareQty===0;
}
function addMagazzinoRiga(orderId){
  const o = findItem('orders', orderId);
  if(!o.magazzino) o.magazzino = [];
  o.magazzino.push({id:uid(), codice:"", nome:"", colore:"", taglia:"", quantita:1, stornato:false, _reservedQty:0, articoloId:"", daOrdinareQty:0, ordineConfermato:false, inCarrello:false, inCarrelloAt:null});
  saveState('orders');
  openJobCard(orderId);
}
function removeMagazzinoRiga(orderId, rigaId){
  const o = findItem('orders', orderId);
  const entry = o.magazzino.find(m=>m.id===rigaId);
  restoreReservedStock(entry);
  if(entry && Number(entry._reservedQty)>0) saveState('warehouse');
  o.magazzino = o.magazzino.filter(m=>m.id!==rigaId);
  saveState('orders');
  openJobCard(orderId);
}
function updateMagazzinoField(orderId, rigaId, field, value){
  const o = findItem('orders', orderId);
  const entry = o.magazzino.find(m=>m.id===rigaId);
  if(field==='codice'){
    entry.codice = normalizeCatalogCode(value);
    const cp = catalogProduct(entry.codice);
    entry.nome = cp ? (cp.name||"") : catalogNameForCode(entry.codice);
    entry.colore=""; entry.taglia="";
  }
  else if(field==='colore'){ entry.colore = String(value||"").trim(); entry.taglia=""; }
  else if(field==='taglia'){ entry.taglia = String(value||"").trim() || "UNICA"; }
  else if(field==='quantita'){ entry.quantita = Number(value)||0; }
  tryStornoMagazzino(entry);
  saveState('orders'); saveState('warehouse');
  openJobCard(orderId);
}
function confermaOrdineMagazzino(orderId, rigaId){
  const o = findItem('orders', orderId);
  const entry = (o.magazzino||[]).find(m=>m.id===rigaId);
  if(!entry || Number(entry.daOrdinareQty)<=0) return;
  entry.ordineConfermato = true;
  saveState('orders');
  openJobCard(orderId);
  showToast(`${entry.daOrdinareQty} pz aggiunti a Materiale da ordinare`);
}
function segnaInseritoNelCarrello(orderId, rigaId){
  const o = findItem('orders', orderId);

  showToast(`${entry.daOrdinareQty} pz segnati come inseriti nel carrello`);
}

}

function adjustWarehouseQty(articoloId, delta){
  if(!articoloId) return;

function updateRigaField(collection, id, rigaId, field, value){

  saveState(collection);

}

async function confirmQuoteClientAndConvert(quoteId){
  const sel = document.getElementById("qc-cliente");
  if(!sel || !sel.value){ showToast("Seleziona o crea un cliente"); return; }

  let clientId = sel.value;
  if(clientId === "__new__"){
    clientId = await createClientFromPrefix("qcnc");
    if(!clientId) return;
  }

  const q = findItem('quotes', quoteId);
  if(!q) return;
  q.clientId = clientId;
  const okQuote = await upsertOne('quotes', q);
  if(!okQuote) return;

  await finalizeQuoteToOrder(quoteId, clientId);
}

async function finalizeQuoteToOrder(quoteId, clientId){
  const q = findItem('quotes', quoteId);
  if(!q || !clientId) return;

  const righe = q.righe.map(r=>({
    id:uid(),
    descrizione:r.descrizione,
    categoria:q.categoria,
    prodotto:r.prodotto||"",
    stato:"Da fare",
    quantita:r.quantita,
    prezzoUnitario:r.prezzoUnitario
  }));

  const order = mkOrder(uid(), clientId, q.descrizione, "", "Da fare", "", righe);
  const okOrder = await upsertOne('orders', order);
  if(!okOrder) return;

  if(!state.orders.some(o=>o.id===order.id)) state.orders.push(order);

  q.clientId = clientId;
  q.convertito = true;
  const okQuote = await upsertOne('quotes', q);
  if(!okQuote) return;

  closeModal();
  renderPreventivi();
  showToast("Ordine creato dal preventivo");
}

async function markLeadConvertedToOrder(leadId, clientId, orderId){
  const l=(state.leads||[]).find(x=>x.id===leadId);
  if(!l) return false;

  const nowIso=new Date().toISOString();
  const {error}=await sb.from("leads").update({
    stato:"Accettato",
    client_id:clientId,
    converted_order_id:orderId,
    converted_at:nowIso,
    aggiornato_il:nowIso
  }).eq("id",leadId);

  if(error){
    console.error("Errore archiviazione Lead dopo ordine",error);
    showToast("Ordine creato, ma Lead non archiviato");
    return false;
  }

  l.stato="Accettato";
  l.clientId=clientId;
  l.convertedOrderId=orderId;
  l.convertedAt=nowIso;
  l.aggiornatoIl=nowIso;
  return true;
}

async function addOrder(){
  const clientId = await resolveClientId("of-cliente", "ofnc");
  if(!clientId) return;

  const id = uid();
  const order = mkOrder(id, clientId, "", "", "Da fare", "", undefined, undefined);

  // Salva prima su Supabase e usa la riga restituita dal database.
  // In questo modo recuperiamo subito anche il numero ordine assegnato dal database.
  const savedOrder = await upsertOneReturning('orders', order);
  if(!savedOrder) return;

  const idx = state.orders.findIndex(o=>o.id===savedOrder.id);
  if(idx>=0) state.orders[idx] = savedOrder; else state.orders.push(savedOrder);

  if(pendingLeadOrderConversion && pendingLeadOrderConversion.clientId===clientId){
    const ctx=pendingLeadOrderConversion;
    pendingLeadOrderConversion=null;
    await markLeadConvertedToOrder(ctx.leadId, clientId, savedOrder.id);
  }

  if(pendingGmailOrderMessageId){
    const msgId=pendingGmailOrderMessageId;
    pendingGmailOrderMessageId=null;
  }

  toggleForm('orderForm');
  renderOrdini();
  showToast(savedOrder.numero ? `Ordine #${savedOrder.numero} creato` : "Ordine creato");
  openJobCard(savedOrder.id);
}
function deleteOrderFromCreditiCliente(orderId, clientId){
  askConfirm("Eliminare questo ordine? Verranno rimossi anche gli incassi collegati.", ()=>{
    const paymentIds = state.payments.filter(p=>p.orderId===orderId).map(p=>p.id);
    const order = findItem('orders', orderId);
    if(order){ (order.magazzino||[]).forEach(m=>{ if(m.stornato && m._reservedQty) adjustWarehouseQty(m.articoloId, m._reservedQty); }); saveState('warehouse'); }
    state.orders = state.orders.filter(o=>o.id!==orderId);
    state.payments = state.payments.filter(p=>p.orderId!==orderId);
    dbDelete('orders', orderId); dbDeleteMany('payments', paymentIds);
    const rimasti = state.orders.filter(o=>o.clientId===clientId && o.stato==="Consegnato").map(o=>({o,saldo:orderSaldo(o)})).filter(x=>x.saldo>0.001);
    if(rimasti.length) openCreditiCliente(clientId); else closeModal();
  });
}
function deleteOrder(id){

function duplicateOrder(orderId){

    id: uid(),
    righe: newRighe,

    note: o.note

async function savePaymentEdit(paymentId, orderId){
  const p = findItem('payments', paymentId);
  if(!p) return;
  const importo = Number(document.getElementById("ep-importo").value)||0;
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }

  p.tipo = document.getElementById("ep-tipo").value;
  p.importo = importo;
  p.data = document.getElementById("ep-data").value || today();
  p.metodo = document.getElementById("ep-metodo").value;

  const ok = await syncCollection('payments');
  if(ok===false) return;

  showToast("Pagamento aggiornato");
  if(orderId) openJobCard(orderId);
  else { closeModal(); renderIncassi(); }
}

function deletePaymentFromEdit(paymentId, orderId){
  askConfirm("Eliminare definitivamente questo pagamento?", async ()=>{
    state.payments = state.payments.filter(p=>p.id!==paymentId);
    await dbDelete('payments', paymentId);
    showToast("Pagamento eliminato");
    if(orderId) openJobCard(orderId);
    else { closeModal(); renderIncassi(); }
  });
}

async function prepareQuickWarehouseDatalist(){

    const opt = document.createElement("option");
    opt.value = `${p.code} — ${p.name}`;
    dl.appendChild(opt);

function quickWarehouseCatalogPick(value){
  const raw = String(value||"").trim();
  const code = normalizeCatalogCode(raw);
  const p = catalogProduct(code);
  const input = document.getElementById("quick-codice");
  if(input && code) input.value = code;

  const nameEl = document.getElementById("quick-product-name");
  if(nameEl) nameEl.textContent = p?.name || "";

  const colorSel = document.getElementById("quick-colore");
  const sizeSel = document.getElementById("quick-taglia");

  if(colorSel && colorSel.tagName==="SELECT"){
    const colors = [...new Set(catalogColorsForCode(code).map(c=>canonicalWarehouseColor(c)))].sort(compareWarehouseColors);
    colorSel.innerHTML = colors.length
      ? `<option value="">Seleziona colore…</option>${colors.map(c=>`<option value="${c}">${c}</option>`).join("")}`
      : `<option value="">Nessun colore disponibile</option>`;
    colorSel.disabled = !colors.length;
  }

  if(sizeSel && sizeSel.tagName==="SELECT"){
    const sizes = catalogSizesForCode(code);
    sizeSel.innerHTML = sizes.length
      ? `<option value="">Seleziona taglia…</option>${sizes.map(s=>`<option value="${s}">${s}</option>`).join("")}`
      : `<option value="">Nessuna taglia disponibile</option>`;
    sizeSel.disabled = !sizes.length;
  }
}

function quickAddToWarehouse(){
  const group = magazzinoGroupFilter;
  const qty = Number(document.getElementById("quick-quantita")?.value)||0;
  const colore = canonicalWarehouseColor(document.getElementById("quick-colore")?.value.trim() || "");
  const taglia = document.getElementById("quick-taglia")?.value.trim() || "UNICA";
  if(qty<=0){ showToast("Inserisci una quantità maggiore di zero"); return; }
  if(group==="Tessile" && !colore){ showToast("Seleziona il colore"); return; }
  if(group==="Tessile" && !taglia){ showToast("Seleziona la taglia"); return; }

  let codice="", nome="", categoria="";
  if(group==="Tessile"){
    const raw = document.getElementById("quick-codice")?.value.trim() || "";
    if(!raw){ showToast("Seleziona o inserisci un prodotto"); return; }
    codice = normalizeCatalogCode(raw);
    const p = catalogProduct(codice);
    nome = p?.name || raw;
    categoria = p?.appCategory || "Tessile";
  }else{
    nome = document.getElementById("quick-product")?.value || "";
    if(!nome){ showToast("Seleziona un prodotto"); return; }
    codice = "";
    categoria = group==="Gadget" ? "Gadget" : "Materiali di stampa";
  }

  const normalizedTaglia = taglia || "UNICA";
  const existing = state.warehouse.find(w =>
    (w.warehouseGroup||"Tessile")===group &&
    String(w.codice||"").trim().toUpperCase()===String(codice||"").trim().toUpperCase() &&
    String(w.nome||"").trim().toLowerCase()===String(nome||"").trim().toLowerCase() &&
    String(w.colore||"").trim().toLowerCase()===String(colore||"").trim().toLowerCase() &&
    String(w.taglia||"UNICA").trim().toUpperCase()===String(normalizedTaglia).trim().toUpperCase()
  );

  if(existing){
    existing.quantita = Number(existing.quantita||0) + qty;
    existing.scortaMinima = Math.max(0, Number(existing.scortaMinima)||0);
  }else{
    const item = {
      id:uid(), codice, nome, categoria, colore, taglia:normalizedTaglia,
      unita:"pz", quantita:qty, scortaMinima:0, warehouseGroup:group
    };
    item.scortaMinima = Math.max(0, Number(item.scortaMinima)||0);
    state.warehouse.push(item);
  }
  saveState('warehouse');
  renderMagazzino();
  showToast(`${qty} pz aggiunti a ${warehouseGroupLabel(group)}`);
}

function warehouseCategoryOptions(selected){
  const opts = [...new Set([...(PRODOTTI_PER_CATEGORIA["Stampa"]||[]), ...(PRODOTTI_PER_CATEGORIA["Ricamo"]||[])])];
  return opts.map(o=>`<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join("");
}
let magazzinoSearch = "";
function filteredMagazzinoRows(q){
  q = (q||"").toLowerCase();
  return state.warehouse
    .filter(w => Number(w.quantita)>0
      && (w.warehouseGroup||"Tessile")===magazzinoGroupFilter
      && (!q || (w.codice||"").toLowerCase().includes(q) || (w.nome||"").toLowerCase().includes(q) || ((w.colore||"").toLowerCase().includes(q) || canonicalWarehouseColor(w.colore).toLowerCase().includes(q)) || (w.taglia||"").toLowerCase().includes(q)))
    .sort((a,b)=>{
      const codeCmp = String(a.codice||a.nome||"").localeCompare(String(b.codice||b.nome||""),"it",{numeric:true,sensitivity:"base"});
      if(codeCmp!==0) return codeCmp;
      const colorCmp = compareWarehouseColors(a.colore,b.colore);
      if(colorCmp!==0) return colorCmp;
      return String(a.taglia||"").localeCompare(String(b.taglia||""),"it",{numeric:true,sensitivity:"base"});
    });
}

function sameVariant(a,b){
  const codeA = String(a.codice||"").trim().toUpperCase();
  const codeB = String(b.codice||"").trim().toUpperCase();
  const colorA = warehouseColorKey(a.colore);
  const colorB = warehouseColorKey(b.colore);
  const sizeA = String(a.taglia||"UNICA").trim().toUpperCase() || "UNICA";
  const sizeB = String(b.taglia||"UNICA").trim().toUpperCase() || "UNICA";
  return codeA===codeB && colorA===colorB && sizeA===sizeB;
}
function destinazioniCarrelloPerMagazzino(w){
  let disponibile = Math.max(0, Number(w.quantita)||0);
  if(disponibile<=0) return [];
  const richieste = [];
  state.orders
    .filter(o=>o.stato!=="Consegnato")
    .forEach(order=>{
      (order.magazzino||[]).forEach(entry=>{
        if(entry.inCarrello && Number(entry.daOrdinareQty)>0 && sameVariant(w,entry)){
          richieste.push({order,entry});
        }
      });
    });
  richieste.sort((a,b)=>{
    const da = a.entry.inCarrelloAt || a.order.createdAt || "";
    const db = b.entry.inCarrelloAt || b.order.createdAt || "";
    return da.localeCompare(db);
  });
  const out = [];
  for(const r of richieste){
    if(disponibile<=0) break;
    const q = Math.min(disponibile, Number(r.entry.daOrdinareQty)||0);
    if(q>0){
      out.push({order:r.order, entry:r.entry, quantita:q});
      disponibile -= q;
    }
  }
  return out;
}

/* ============ IMPORT DDT ACTION WEAR DA PDF ============ */
let pdfParsedRows = [];
async function extractPdfLines(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const allLines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const groups = {};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]/3)*3;
      (groups[y] = groups[y]||[]).push({str:it.str, x:it.transform[4]});
    });
    Object.keys(groups).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line = groups[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
      if(line) allLines.push(line);
    });
  }
  return allLines;
}
function guessArticoloCategoria(nome){
  const n = nome.toLowerCase();
  if(n.includes("t-shirt") || n.includes("t kids") || n.includes("tshirt")) return "T-shirt";
  if(n.includes("polo")) return "Polo";
  if(n.includes("jacket") || n.includes("felpa") || n.includes("hoodie") || n.includes("sweat") || n.includes("zip")) return "Felpa";
  if(n.includes("bag") || n.includes("shopper")) return "Shopper";
  if(n.includes("cap") || n.includes("hat") || n.includes("five")) return "Cappello";
  return "Altro tessuto";
}
function parseActionWearLines(lines){
  const lineRe = /^([A-Z0-9]{3,10})\s+([A-Z]{2,4})\s+\d{5,7}\s+(.+?)\s+N\.\s+(\d+)\s*$/;
  const sizeRe = /(\S+)\/(\d+)/g;
  const results = [];
  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(lineRe);
    if(!m) continue;
    const [, codice, colore, nomeRaw, qtaTotale] = m;
    const nome = nomeRaw.trim();
    const nextLine = lines[i+1] || "";
    const sizes = [...nextLine.matchAll(sizeRe)];
    if(sizes.length){
      sizes.forEach(s=>{
        results.push({codice, colore:canonicalWarehouseColor(colore), coloreDDT:colore, nome, taglia:s[1], quantita:parseInt(s[2],10), categoria:guessArticoloCategoria(nome), include:true});
      });
    } else {
      results.push({codice, colore:canonicalWarehouseColor(colore), coloreDDT:colore, nome, taglia:"UNICA", quantita:parseInt(qtaTotale,10), categoria:guessArticoloCategoria(nome), include:true});
    }
  }
  return results;
}
async function handlePdfImport(evt){
  const file = evt.target.files[0]; if(!file) return;
  const statusEl = document.getElementById("pdfImportStatus");
  statusEl.textContent = "Lettura del PDF in corso…";
  try{
    const lines = await extractPdfLines(file);
    pdfParsedRows = parseActionWearLines(lines);
    if(!pdfParsedRows.length){
      statusEl.textContent = "Non ho riconosciuto articoli in questo PDF. Controlla che sia un DDT Action Wear nello stesso formato, oppure mandamelo in chat.";
      document.getElementById("pdfImportPreview").innerHTML = "";
      return;
    }
    statusEl.textContent = `Trovate ${pdfParsedRows.length} righe. Controlla e correggi prima di confermare.`;
    renderPdfPreview();
  }catch(err){
    console.error(err);
    statusEl.textContent = "Errore nella lettura del PDF. Prova a mandarmelo in chat invece.";
  }
}

        </tbody>
