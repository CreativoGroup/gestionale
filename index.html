async function markLeadConvertedToOrder(leadId, clientId, orderId){
  const l=(state.leads||[]).find(x=>x.id===leadId);
  if(!l) return false;

  const nowIso=new Date().toISOString();
  const {error}=await sb.from("leads").update({
    stato:"Accettato",
    client_id:clientId,
    converted_order_id:orderId,
    converted_at:nowIso,
    aggiornato_il:nowIso
  }).eq("id",leadId);

  if(error){
    console.error("Errore chiusura richiesta dopo creazione ordine",error);
    showToast("Ordine creato, ma la richiesta non è stata chiusa");
    return false;
  }

  l.stato="Accettato";
  l.clientId=clientId;
  l.convertedOrderId=orderId;
  l.convertedAt=nowIso;
  l.aggiornatoIl=nowIso;
  return true;
}

async function addOrder(){
  const clientId = await resolveClientId("of-cliente", "ofnc");
  if(!clientId) return;

  const id = uid();
  const order = mkOrder(id, clientId, "", "", "Da fare", "", undefined, undefined);

  // Salva prima su Supabase e usa la riga restituita dal database.
  // In questo modo recuperiamo subito anche il numero ordine assegnato dal database.
  const savedOrder = await upsertOneReturning('orders', order);
  if(!savedOrder) return;

  const idx = state.orders.findIndex(o=>o.id===savedOrder.id);
  if(idx>=0) state.orders[idx] = savedOrder; else state.orders.push(savedOrder);

  if(pendingLeadOrderConversion && pendingLeadOrderConversion.clientId===clientId){
    const ctx=pendingLeadOrderConversion;
    pendingLeadOrderConversion=null;
    await markLeadConvertedToOrder(ctx.leadId, clientId, savedOrder.id);
  }

  let gmailDropboxResult=null;
  if(pendingGmailOrderMessageId || pendingGmailOrderContext){
    const ctx=pendingGmailOrderContext || {
      messageId:pendingGmailOrderMessageId,
      attachments:null,
      source:"gmail_order"
    };
    pendingGmailOrderMessageId=null;
    pendingGmailOrderContext=null;

    try{
      gmailDropboxResult=await copyGmailOrderAttachmentsToDropbox(savedOrder,ctx);
    }catch(err){
      console.error("Import automatico allegati mail in Dropbox",err);
      gmailDropboxResult={uploaded:0,total:0,error:String(err?.message||err)};
    }
  }

  orderFormOpen = false;
  const orderFormEl=document.getElementById('orderForm');
  if(orderFormEl) orderFormEl.classList.remove('open');
  renderOrdini();

  if(gmailDropboxResult?.uploaded>0){
    const failed=(gmailDropboxResult.total||0)-gmailDropboxResult.uploaded;
    showToast(
      failed>0
        ? `Ordine creato · ${gmailDropboxResult.uploaded}/${gmailDropboxResult.total} allegati copiati in Dropbox > FILE RICEVUTI`
        : `Ordine creato · ${gmailDropboxResult.uploaded} allegat${gmailDropboxResult.uploaded===1?'o':'i'} copiati in Dropbox > FILE RICEVUTI`
    );
  }else if(gmailDropboxResult?.reason==="dropbox_not_connected"){
    showToast("Ordine creato · Dropbox non collegato: allegati mail non copiati");
  }else if(gmailDropboxResult?.reason==="no_attachments"){
    showToast("Ordine creato · nessun allegato trovato nella mail");
  }else if(gmailDropboxResult?.error || gmailDropboxResult?.errors?.length){
    showToast("Ordine creato · allegati mail non copiati: controlla Dropbox");
  }else{
    showToast(savedOrder.numero ? `Ordine #${savedOrder.numero} creato` : "Ordine creato");
  }

  if(gmailDropboxResult?.uploaded>0){
    jobDropboxUiState[savedOrder.id]={folder:"FILE RICEVUTI"};
  }
  openJobCard(savedOrder.id);
  if(gmailDropboxResult?.uploaded>0){
    setTimeout(()=>jobDropboxSelectFolder(savedOrder.id,"FILE RICEVUTI"),450);
  }
}
function deleteOrderFromCreditiCliente(orderId, clientId){
  askConfirm("Eliminare questo ordine? Verranno rimossi anche gli incassi collegati e la merce riservata verrà restituita al magazzino.", async ()=>{
    const paymentIds = state.payments.filter(p=>p.orderId===orderId).map(p=>p.id);
    const order = findItem('orders', orderId);

    if(order){
      for(const m of (order.magazzino||[])){
        if(Number(m._reservedQty)>0 && m.articoloId){
          const restored = await restoreReservedStockDb(m);
          if(!restored){
            showToast("Ordine NON eliminato: impossibile restituire tutta la merce al magazzino");
            return;
          }
        }
      }

      const savedBeforeDelete = await upsertOne("orders", order);
      if(!savedBeforeDelete){
        showToast("Ordine NON eliminato: errore durante il ripristino del magazzino");
        return;
      }
    }

    state.orders = state.orders.filter(o=>o.id!==orderId);
    state.payments = state.payments.filter(p=>p.orderId!==orderId);

    await dbDelete('orders', orderId);
    await dbDeleteMany('payments', paymentIds);

    await reloadWarehouseFromDb();

    const rimasti = state.orders
      .filter(o=>o.clientId===clientId && o.stato==="Consegnato" && !o.daFatturare && !o.fatturato)
      .map(o=>({o,saldo:orderSaldo(o)}))
      .filter(x=>x.saldo>0.001);

    if(rimasti.length) openCreditiCliente(clientId); else closeModal();
    showToast("Ordine eliminato · merce restituita al magazzino");
  });
}
function deleteOrder(id){
  askConfirm("Eliminare questo ordine? Verranno rimossi anche gli incassi collegati e la merce riservata verrà restituita al magazzino.", async ()=>{
    const paymentIds = state.payments.filter(p=>p.orderId===id).map(p=>p.id);
    const order = findItem('orders', id);

    // PRIMA restituiamo realmente al database tutta la merce già stornata
    // dalla scheda. Non controlliamo "stornato": basta che esista una quantità
    // riservata, perché può esserci anche un arrivo parziale o uno stato vecchio.
    if(order){
      for(const m of (order.magazzino||[])){
        if(Number(m._reservedQty)>0 && m.articoloId){
          const restored = await restoreReservedStockDb(m);
          if(!restored){
            showToast("Ordine NON eliminato: impossibile restituire tutta la merce al magazzino");
            return;
          }
        }
      }

      // Salviamo l'ordine svuotato dalle riserve prima di eliminarlo, così anche
      // in caso di rete lenta non può restare una prenotazione fantasma.
      const savedBeforeDelete = await upsertOne("orders", order);
      if(!savedBeforeDelete){
        showToast("Ordine NON eliminato: errore durante il ripristino del magazzino");
        return;
      }
    }

    // Solo dopo il ripristino della merce eliminiamo ordine e pagamenti.
    state.orders = state.orders.filter(o=>o.id!==id);
    state.payments = state.payments.filter(p=>p.orderId!==id);

    await dbDelete('orders', id);
    await dbDeleteMany('payments', paymentIds);

    await reloadWarehouseFromDb();
    renderCurrentView();
    showToast("Ordine eliminato · merce restituita al magazzino");
  });
}

/* ============ FLUSSO DI LAVORO RINNOVATO ============ */
let flussoFilters = {
  search:"",
  worker:"",
  delivery:"",
  important:false,
  external:false
};

function flowDateKey(date){
  if(!date) return "";
  return String(date).slice(0,10);
}
function flowTodayKey(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function flowDaysFromToday(date){
  const key=flowDateKey(date);
  if(!key) return 99999;
  const [y,m,d]=key.split("-").map(Number);
  const target=new Date(y,m-1,d);
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((target-today)/86400000);
}
function flowWorkerInitials(name){
  const parts=String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "—";
  return parts.slice(0,2).map(x=>x[0]?.toUpperCase()||"").join("");
}
function flowExternalSupplier(o){
  const ext=(o.righe||[]).filter(r=>r.categoria==="Lavorazioni Esterne");
  const supplier=ext.map(r=>String(r.fornitore||"").trim()).find(Boolean);
  return supplier||"da indicare";
}

function flowHasService(o){
  return !!(o && (o.righe||[]).some(r=>r && r.categoria==="Servizio"));
}

function flowShortDescription(o){
  const lines=(o.righe||[]).filter(r=>r && (r.prodotto||r.categoria));
  if(!lines.length) return "Nessuna lavorazione";
  const first=lines[0];
  let label=String(first.prodotto||first.categoria||"").trim();
  if(lines.length>1) label+=` · +${lines.length-1} lavorazion${lines.length-1===1?"e":"i"}`;
  return label;
}
function flowBozzaWaiting(o){
  const m=getBozzaMeta(o);
  return m?.stato==="IN ATTESA DI RISPOSTA";
}
function flowStageOf(o){
  const hasExternal=(o.righe||[]).some(r=>r.categoria==="Lavorazioni Esterne");
  if(o.stato==="Da fare") return "Da fare";
  if(o.stato==="In preparazione grafica") return "In preparazione grafica";
  if((o.stato==="In produzione" || o.stato==="Produzione esterna") && hasExternal) return "Produzione esterna";
  if(o.stato==="In produzione" || o.stato==="Produzione esterna") return "In produzione";
  return "";
}
function setFlowFilter(field,value){
  flussoFilters[field]=value;
  renderFlusso();
}
function toggleFlowFilter(field){
  flussoFilters[field]=!flussoFilters[field];
  renderFlusso();
}

function renderFlusso(){
  const f=flussoFilters;
  const today=flowTodayKey();

  let list=state.orders
    .filter(o=>!["Completato","Consegnato"].includes(o.stato))
    .filter(o=>!!flowStageOf(o));

  if(f.search){
    const q=String(f.search).trim().toLowerCase();
    list=list.filter(o=>{
      const c=findItem("clients",o.clientId);
      const hay=[
        clientDisplayName(c),
        c?.email,
        c?.telefono,
        o.numero,
        o.descrizione,
        ...(o.righe||[]).flatMap(r=>[r.categoria,r.prodotto,r.descrizione,r.fornitore])
      ].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  if(f.worker) list=list.filter(o=>orderWorkersList(o).includes(f.worker));
  if(f.important) list=list.filter(o=>!!o.importante);
  if(f.external) list=list.filter(o=>flowStageOf(o)==="Produzione esterna" || (o.righe||[]).some(r=>r.categoria==="Lavorazioni Esterne"));

  if(f.delivery==="today") list=list.filter(o=>flowDateKey(o.dataConsegna)===today);
  if(f.delivery==="soon") list=list.filter(o=>{
    const days=flowDaysFromToday(o.dataConsegna);
    return days>=0 && days<=2;
  });
  if(f.delivery==="overdue") list=list.filter(o=>flowDaysFromToday(o.dataConsegna)<0);

  list.sort((a,b)=>{
    if(!!a.importante!==!!b.importante) return a.importante ? -1 : 1;
    return String(a.dataConsegna||"9999-99-99").localeCompare(String(b.dataConsegna||"9999-99-99"));
  });

  const activeAll=state.orders
    .filter(o=>!["Completato","Consegnato"].includes(o.stato))
    .filter(o=>!!flowStageOf(o));

  const daIniziareOggi=activeAll.filter(o=>{
    const recommended=typeof effectiveWorkStartDate==="function" ? effectiveWorkStartDate(o) : (typeof recommendedWorkStartDate==="function" ? recommendedWorkStartDate(o.dataConsegna,3) : "");
    return flowDateKey(recommended)===today && o.stato==="Da fare";
  }).length;

  const inScadenza=activeAll.filter(o=>{
    const days=flowDaysFromToday(o.dataConsegna);
    return days>=0 && days<=2;
  }).length;

  const inAttesa=activeAll.filter(flowBozzaWaiting).length;
  const esterne=activeAll.filter(o=>flowStageOf(o)==="Produzione esterna").length;

  const stages=[
    {name:"Da fare", key:"todo", label:"DA FARE"},
    {name:"In preparazione grafica", key:"grafica", label:"PREPARAZIONE GRAFICA"},
    {name:"In produzione", key:"production", label:"IN PRODUZIONE"},
    {name:"Produzione esterna", key:"external", label:"PRODUZIONE ESTERNA"}
  ];

  const renderCard=o=>{
    const c=findItem("clients",o.clientId);
    const stage=flowStageOf(o);
    const workers=orderWorkersList(o);
    const days=flowDaysFromToday(o.dataConsegna);
    const isToday=days===0;
    const overdue=days<0;
    const soon=days>=0 && days<=2;
    const external=stage==="Produzione esterna";
    const wait=flowBozzaWaiting(o);

    const workerText=workers.length ? workers.join(", ") : "Non assegnato";
    const initials=workers.length ? flowWorkerInitials(workers[0]) : "—";

    return `<div class="flow-job ${o.importante?'important':''} ${overdue?'overdue':''} ${flowHasService(o)?'service-job':''}" onclick="openJobCard('${o.id}')">
      <div class="flow-job-top">
        <div>
          <div class="flow-job-client">${escapeHtml(c?clientDisplayName(c):"Cliente")}</div>
          <div class="flow-job-desc">${escapeHtml(flowShortDescription(o))}</div>
        </div>
        <div class="flow-job-num">${o.numero?`#${escapeHtml(String(o.numero))}`:""}</div>
      </div>

      <div class="flow-job-meta">
        <span class="flow-worker">
          <span class="flow-worker-dot">${escapeHtml(initials)}</span>
          ${escapeHtml(workerText)}
        </span>
        <span class="flow-date ${isToday?'today':''} ${overdue?'overdue':''}">
          ${o.dataConsegna?`▣ ${fmtDate(o.dataConsegna)}`:"Senza data"}
        </span>
      </div>

      <div class="flow-badges">
        ${o.importante?`<span class="flow-badge important">★ IMPORTANTE</span>`:""}
        ${external?`<span class="flow-badge external">ESTERNA · ${escapeHtml(flowExternalSupplier(o))}</span>`:""}
        ${wait?`<span class="flow-badge wait">BOZZA IN ATTESA CLIENTE</span>`:""}
        ${overdue?`<span class="flow-badge overdue">IN RITARDO</span>`:(soon?`<span class="flow-badge soon">${isToday?"CONSEGNA OGGI":"IN SCADENZA"}</span>`:"")}
      </div>
    </div>`;
  };

  document.getElementById("view-flusso").innerHTML=`
    <div class="flow-toolbar">
      <input class="flow-control" type="search" placeholder="Cerca cliente o lavorazione…"
        value="${escapeHtml(f.search)}"
        oninput="flussoFilters.search=this.value; clearTimeout(window.__flowSearchTimer); window.__flowSearchTimer=setTimeout(renderFlusso,180);">

      <select class="flow-control" onchange="setFlowFilter('worker',this.value)">
        <option value="">Tutti gli operatori</option>
        ${WORKERS.map(w=>`<option value="${w}" ${f.worker===w?'selected':''}>${w}</option>`).join("")}
      </select>

      <select class="flow-control" onchange="setFlowFilter('delivery',this.value)">
        <option value="">Tutte le consegne</option>
        <option value="today" ${f.delivery==="today"?'selected':''}>Consegna oggi</option>
        <option value="soon" ${f.delivery==="soon"?'selected':''}>Entro 2 giorni</option>
        <option value="overdue" ${f.delivery==="overdue"?'selected':''}>In ritardo</option>
      </select>

      <button class="flow-toggle ${f.important?'active':''}" onclick="toggleFlowFilter('important')">★ Solo importanti</button>
      <button class="flow-toggle ${f.external?'active':''}" onclick="toggleFlowFilter('external')">▣ Lavorazioni esterne</button>
    </div>

    <div class="flow-summary">
      <div class="flow-stat start">
        <div class="flow-stat-icon">≡</div>
        <div><div class="flow-stat-label">Da iniziare oggi</div><div class="flow-stat-value">${daIniziareOggi}</div></div>
      </div>
      <div class="flow-stat deadline">
        <div class="flow-stat-icon">!</div>
        <div><div class="flow-stat-label">In scadenza</div><div class="flow-stat-value">${inScadenza}</div></div>
      </div>
      <div class="flow-stat wait">
        <div class="flow-stat-icon">◌</div>
        <div><div class="flow-stat-label">In attesa cliente</div><div class="flow-stat-value">${inAttesa}</div></div>
      </div>
      <div class="flow-stat external">
        <div class="flow-stat-icon">↗</div>
        <div><div class="flow-stat-label">Produzione esterna</div><div class="flow-stat-value">${esterne}</div></div>
      </div>
    </div>

    <div class="flow-board">
      ${stages.map(stage=>{
        const items=list.filter(o=>flowStageOf(o)===stage.name);
        return `<section class="flow-col" data-stage="${stage.key}">
          <div class="flow-col-head">
            <div class="flow-col-title">${stage.label}</div>
            <div class="flow-col-count">${items.length}</div>
          </div>
          ${items.length ? items.map(renderCard).join("") : `<div class="flow-empty">Nessun lavoro</div>`}
        </section>`;
      }).join("")}
    </div>
  `;
}

let jobCardEditSnapshot = null;

async function warehouseQtyByIdDb(id){
  if(!id) return null;
  const {data,error}=await sb.from(TABLES.warehouse).select("*").eq("id",id).maybeSingle();
  if(error){
    console.error("Errore lettura magazzino per rollback",error);
    return null;
  }
  return data ? fromDbRow("warehouse",data) : null;
}

async function adjustWarehouseByIdDb(id,delta){
  if(!id || !Number(delta)) return true;
  const w = await warehouseQtyByIdDb(id);
  if(!w) return false;

  const nuovaQta = Math.max(0,Number(w.quantita||0)+Number(delta||0));
  const saved = await updateWarehouseDirect(w,{quantita:nuovaQta});
  if(!saved) return false;

  const idx=state.warehouse.findIndex(x=>x.id===saved.id);
  if(nuovaQta<=0){
    if(idx>=0) state.warehouse.splice(idx,1);
  }else{
    if(idx>=0) state.warehouse[idx]=saved;
    else state.warehouse.push(saved);
  }
  return true;
}

function aggregateReservedByArticle(order){
  const map = new Map();
  (order?.magazzino||[]).forEach(m=>{
    const id=String(m.articoloId||"").trim();
    const q=Math.max(0,Number(m._reservedQty)||0);
    if(id && q>0) map.set(id,(map.get(id)||0)+q);
  });
  return map;
}

async function cancelJobCard(orderId){
  if(!jobCardEditSnapshot || jobCardEditSnapshot.orderId!==orderId){
    closeModal();
    return;
  }

  const current=findItem("orders",orderId);
  const original=JSON.parse(JSON.stringify(jobCardEditSnapshot.order));

  if(!current){
    jobCardEditSnapshot=null;
    closeModal();
    return;
  }

  const nowMap=aggregateReservedByArticle(current);
  const oldMap=aggregateReservedByArticle(original);
  const ids=new Set([...nowMap.keys(),...oldMap.keys()]);

  for(const articoloId of ids){
    const nowQty=nowMap.get(articoloId)||0;
    const oldQty=oldMap.get(articoloId)||0;
    const delta=nowQty-oldQty;

    if(delta!==0){
      const ok=await adjustWarehouseByIdDb(articoloId,delta);
      if(!ok){
        showToast("Annullamento non completato: impossibile ripristinare il magazzino");
        return;
      }
    }
  }

  const idx=state.orders.findIndex(o=>o.id===orderId);
  if(idx>=0) state.orders[idx]=original;

  const saved=await upsertOne("orders",original);
  if(!saved){
    showToast("Annullamento non completato: errore nel ripristino della scheda");
    return;
  }

  await reloadWarehouseFromDb();
  jobCardEditSnapshot=null;
  closeModal();
  renderCurrentView();
  showToast("Modifiche annullate · magazzino ripristinato");
}

function saveJobCard(orderId){
  if(jobCardEditSnapshot && jobCardEditSnapshot.orderId===orderId){
    jobCardEditSnapshot=null;

  closeModal();

}

function effectiveWorkStartDate(order){

function setWorkStartDate(orderId,date){

  const keep=(o.fasi||[]).filter(f=>!(f && f.key==="__inizio_lavoro__"));
  const value=String(date||"").trim();

function getExternalLogisticsEntries(order){
  const stored=(order?.fasi||[]).filter(f=>f && f.key==="__ritiro_esterno__");
  if(stored.length) return stored;
  const legacy=(order?.righe||[]).find(r=>r.categoria==="Lavorazioni Esterne" && String(r.ritiroEsterno||"").trim());
  return [{key:"__ritiro_esterno__",id:"default",status:String(legacy?.ritiroEsterno||"")}];
}
function updateExternalLogisticsStatus(orderId,entryId,status){
  const o=findItem("orders",orderId); if(!o) return;
  let entries=(o.fasi||[]).filter(f=>f && f.key==="__ritiro_esterno__");
  if(!entries.length){
    entries=[{key:"__ritiro_esterno__",id:uid(),status:""}];
  }
  let target=entries.find(e=>e.id===entryId);
  if(!target && entryId==="default") target=entries[0];
  if(target) target.status=status;
  const others=(o.fasi||[]).filter(f=>!(f && f.key==="__ritiro_esterno__"));
  o.fasi=[...others,...entries];
  // Manteniamo i vecchi campi riga sincronizzati solo per compatibilità con dati storici.
  (o.righe||[]).forEach(r=>{ if(r.categoria==="Lavorazioni Esterne") r.ritiroEsterno=status; });
  saveState("orders");
  openJobCard(orderId);
  showToast(status==="DA RITIRARE" ? "Aggiunto agli ordini da ritirare" : `Stato ritiro: ${status}`);
}
function addExternalLogisticsEntry(orderId){
  const o=findItem("orders",orderId); if(!o) return;
  let entries=(o.fasi||[]).filter(f=>f && f.key==="__ritiro_esterno__");
  if(!entries.length){
    const legacy=(o.righe||[]).find(r=>r.categoria==="Lavorazioni Esterne" && String(r.ritiroEsterno||"").trim());
    entries=[{key:"__ritiro_esterno__",id:uid(),status:String(legacy?.ritiroEsterno||"")}];
  }
  entries.push({key:"__ritiro_esterno__",id:uid(),status:""});
  const others=(o.fasi||[]).filter(f=>!(f && f.key==="__ritiro_esterno__"));
  o.fasi=[...others,...entries];
  saveState("orders");
  openJobCard(orderId);
}
function removeExternalLogisticsEntry(orderId,entryId){
  const o=findItem("orders",orderId); if(!o) return;
  const entries=(o.fasi||[]).filter(f=>f && f.key==="__ritiro_esterno__");
  if(entries.length<=1){ showToast("Deve rimanere almeno una gestione consegna/ritiro"); return; }
  o.fasi=(o.fasi||[]).filter(f=>!(f && f.key==="__ritiro_esterno__" && f.id===entryId));
  saveState("orders");
  openJobCard(orderId);
}

function recommendedWorkStartDate(deliveryDate, workingDays=3){
  if(!deliveryDate) return "";
  const d=new Date(`${deliveryDate}T12:00:00`);
  if(Number.isNaN(d.getTime())) return "";
  let left=Math.max(1,Number(workingDays)||3);
  while(left>0){
    d.setDate(d.getDate()-1);
    const day=d.getDay();
    if(day!==0 && day!==6) left--;
  }
  return d.toISOString().slice(0,10);
}
function fmtRecommendedStart(deliveryDate){
  const x=recommendedWorkStartDate(deliveryDate,3);
  return x ? fmtDate(x) : "—";
}

    if(btn){btn.disabled=true;btn.textContent="INVIO...";}
    await sendWhatsappRequest({
      to:phone,
      message,
      contactName:clientDisplayName(c),
      file
    });

    if(kind==="bozza"){
      setBozzaInAttesa(orderId);
    }else if(kind==="completato"){
      await markClienteAvvisato(orderId,"WhatsApp");

    openJobCard(orderId);
  }catch(error){
    console.error(error);
    showToast(error?.message||"Errore durante l'invio WhatsApp");
    if(btn){btn.disabled=false;btn.textContent="INVIA WHATSAPP";}
  }
}

function isExpiredGmailTokenError(message){
  const s=String(message||"").toLowerCase();
  return s.includes("token has been expired")
      || s.includes("token has expired")
      || s.includes("token has been revoked")
      || s.includes("expired or revoked")
      || s.includes("invalid_grant");
}

async function sendOrderProductionMail(orderId){
  const o=findItem("orders",orderId);
  if(!o) return;
  const to=String(document.getElementById("stage-mail-to")?.value||"").trim();
  const subject=String(document.getElementById("stage-mail-subject")?.value||"Ordine in produzione").trim();
  const bodyText=String(document.getElementById("stage-mail-body")?.value||"").trim();
  const btn=document.getElementById("stage-mail-send");
  const status=document.getElementById("stage-mail-status");

  if(!to || !bodyText){
    showToast("Controlla email e messaggio");
    return;
  }

  try{
    if(btn){btn.disabled=true;btn.textContent="INVIO...";}
    if(status) status.textContent="Invio in corso…";

    const {data:sessionData}=await sb.auth.getSession();
    const session=sessionData?.session;
    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");

    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${session.access_token}`,
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({mode:"new",to,subject,bodyText,attachments:[]})
    });

    const raw=await response.text();
    let result={}; try{result=JSON.parse(raw)}catch(e){}
    if(!response.ok) throw new Error(result?.error||result?.message||raw||`Errore HTTP ${response.status}`);

    const tracked=await markProductionMailSent(orderId,to);
    if(!tracked){
      showToast("Mail inviata, ma non sono riuscito a registrare lo stato nella scheda");
    }else{
      showToast("Mail ordine in produzione inviata");
    }
    openJobCard(orderId);
  }catch(err){
    console.error(err);
    const msg=err?.message||"invio non riuscito";

    if(isExpiredGmailTokenError(msg)){
      if(status){
        status.innerHTML=`
          <div style="padding:10px 12px;border:1px solid #f0c8bf;background:#fff6f3;border-radius:10px;color:#9b3b2f;line-height:1.45;">
            <strong>Collegamento Gmail scaduto.</strong><br>
            Il messaggio è pronto: puoi aprirlo subito in Gmail e inviarlo da lì.
          </div>
          <button class="btn btn-outline btn-sm" style="margin-top:9px;" onclick="openProductionMailInGmail('${orderId}')">APRI IN GMAIL</button>`;
      }
      showToast("Collegamento Gmail scaduto · apri il messaggio in Gmail");
    }else{
      if(status) status.textContent=`Errore: ${msg}`;
    }

    if(btn){btn.disabled=false;btn.textContent="INVIA MAIL";}
  }
}



function getProductionMailMeta(order){
  return (order?.fasi||[]).find(f=>f && f.key==="__mail_produzione__") || null;
}

function formatProductionMailSentAt(value){
  if(!value) return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("it-IT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

async function markProductionMailSent(orderId,to){
  const o=findItem("orders",orderId);
  if(!o) return false;

  const others=(o.fasi||[]).filter(f=>!(f && f.key==="__mail_produzione__"));
  const marker={
    key:"__mail_produzione__",
    sent:true,
    sentAt:new Date().toISOString(),
    to:String(to||"").trim()
  };

  const previous=o.fasi;
  o.fasi=[...others,marker];

  const saved=await upsertOneReturning("orders",o);
  if(!saved){
    o.fasi=previous;
    return false;
  }

  const i=state.orders.findIndex(x=>x.id===orderId);
  if(i>=0) state.orders[i]=saved;
  return true;
}

function normalizedBozzaChannel(order){
  const raw=String(getBozzaMeta(order)?.scelta||"").trim().toUpperCase();
  if(raw==="MAIL" || raw==="BOZZA DA INVIARE PER MAIL") return "MAIL";
  if(raw==="WHATSAPP") return "WHATSAPP";
  if(raw==="NON RICHIESTA" || raw==="ALTRO" || raw==="BOZZA DA INVIARE A MATTIA" || raw==="NON SERVE BOZZA") return "NON RICHIESTA";
  return "";
}

function setBozzaChannel(orderId, channel){
  const allowed=["MAIL","WHATSAPP","NON RICHIESTA"];
  setBozzaScelta(orderId,allowed.includes(channel)?channel:"");
}

function segnaBozzaAltroInviata(orderId){
  const o=findItem("orders",orderId);

}

function jobProgressHtml(o){
  const delivered=o.stato==="Consegnato";
  const completed=delivered || o.stato==="Completato";
  const notified=delivered || !!o.clienteAvvisato;
  const working=!["Da fare"].includes(o.stato);
  const steps=[
    {label:"In lavorazione",done:working,date:o.createdAt?fmtDate(String(o.createdAt).slice(0,10)):""},
    {label:"Completato",done:completed,date:o.stato==="Completato"&&o.dataConsegna?fmtDate(o.dataConsegna):""},
    {label:"Avvisato",done:notified,date:o.avvisatoIl?fmtDate(String(o.avvisatoIl).slice(0,10)):""},
    {label:"Consegnato",done:delivered,date:delivered&&o.dataConsegna?fmtDate(o.dataConsegna):""}
  ];
  return `<div class="job-v2-progress">${steps.map((s,i)=>{
    const active=!s.done && (i===0 || steps[i-1].done);
    return `<div class="job-v2-step ${s.done?'done':''} ${active?'active':''}">
      <div class="job-v2-step-dot">${s.done?'✓':(i+1)}</div>
      <div class="job-v2-step-label">${s.label}</div>
      ${s.date?`<div class="job-v2-step-date">${s.date}</div>`:""}
    </div>`;
  }).join("")}</div>`;
}

function duplicateOrder(orderId){
  const o = findItem('orders', orderId);
  const newRighe = o.righe.map(r=>({...r, id:uid()}));
  const clone = {
    ...JSON.parse(JSON.stringify(o)),
    id: uid(),
    righe: newRighe,
    stato: "Da fare",
    spedito: false,
    clienteAvvisato: false,
    note: o.note
  };
  clone.righe.forEach(r=>{ r.stato = "Da fare"; });
  clone.fasi = [];
  recalcFasi(clone);
  state.orders.push(clone);
  saveState('orders');
  showToast("Scheda duplicata");
  openJobCard(clone.id);
}

function addPaymentPreviewOrder(orderId){
  const o=findItem("orders",orderId);
  if(!o) return null;

  const copy=JSON.parse(JSON.stringify(o));
  const scontoEl=document.getElementById("ap-sconto");
  const ivaEl=document.getElementById("ap-iva");
  const fattEl=document.getElementById("ap-da-fatturare");

  if(scontoEl) copy.sconto=Math.max(0,Number(scontoEl.value)||0);
  if(ivaEl) copy.ivaApplicata=!!ivaEl.checked;
  if(fattEl) copy.daFatturare=!!fattEl.checked;

function refreshAddPaymentTotals(orderId){
  const preview=addPaymentPreviewOrder(orderId);
  if(!preview) return;

  const totale=orderTotale(preview);
  const incassato=orderIncassato(preview);
  const saldo=Math.max(0,totale-incassato);

  const totalEl=document.getElementById("ap-total-preview");
  const saldoEl=document.getElementById("ap-saldo-preview");
  const helpEl=document.getElementById("ap-help");
  const importoEl=document.getElementById("ap-importo");

  if(totalEl) totalEl.textContent=fmtMoney(totale);
  if(saldoEl) saldoEl.textContent=fmtMoney(saldo);
  if(helpEl) helpEl.textContent=`Importo suggerito in base al saldo ancora da incassare: ${fmtMoney(saldo)}.`;

  // Quando si modifica IVA o sconto aggiorniamo anche l'importo suggerito.
  if(importoEl) importoEl.value=saldo>0 ? saldo.toFixed(2) : "";
}

async function submitAddPayment(orderId){
  const o = findItem('orders', orderId);
  if(!o) return;

  const importo = Number(document.getElementById("ap-importo")?.value)||0;
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }

  const oldOrder=JSON.parse(JSON.stringify(o));

  o.sconto=Math.max(0,Number(document.getElementById("ap-sconto")?.value)||0);
  o.daFatturare=!!document.getElementById("ap-da-fatturare")?.checked;
  o.ivaApplicata=!!document.getElementById("ap-iva")?.checked;

  const savedOrder=await upsertOneReturning("orders",o);
  if(!savedOrder){
    const oi=state.orders.findIndex(x=>x.id===orderId);
    if(oi>=0) state.orders[oi]=oldOrder;
    showToast("Errore salvataggio fatturazione");
    return;
  }

  const oi=state.orders.findIndex(x=>x.id===orderId);
  if(oi>=0) state.orders[oi]=savedOrder;

  const payment={
    id:uid(),
    orderId,
    clientId:o.clientId,
    tipo:document.getElementById("ap-tipo")?.value||"",
    importo,
    data:document.getElementById("ap-data")?.value||today(),
    metodo:document.getElementById("ap-metodo")?.value||""
  };

  const savedPayment=await upsertOneReturning("payments",payment);
  if(!savedPayment){
    showToast("Fatturazione salvata, ma pagamento non registrato");
    return;
  }

  state.payments.push(savedPayment);
  showToast("Pagamento registrato");
  openJobCard(orderId);
}

function renderFasiGrouped(o){
  const groups = {};
  o.fasi.forEach((f,i)=>{ (groups[f.categoria] = groups[f.categoria] || []).push({f,i}); });
  return Object.keys(groups).map(cat => `
    <p class="fasi-group-title">${cat}</p>
    <div class="steps" style="margin-bottom:10px;">
      ${groups[cat].map(({f,i})=>`<div class="step-row ${f.completata?'done':''}"><input type="checkbox" ${f.completata?'checked':''} onchange="toggleStep('${o.id}',${i})"><label>${f.nome}</label></div>`).join("")}

  `).join("");
}
function toggleStep(orderId, idx){ const o = findItem('orders',orderId); o.fasi[idx].completata = !o.fasi[idx].completata; saveState('orders'); }
async function updateOrderField(orderId, field, value){
  const o=findItem('orders',orderId);
  if(!o) return;

  const oldValue=o[field];
  o[field]=value;

  // Lo stato della scheda deve essere salvato subito e non deve essere
  // annullato quando si chiude la scheda con la X.
  if(field==='stato'){
    const saved=await upsertOneReturning('orders',o);
    if(!saved){
      o[field]=oldValue;
      showToast("Stato non aggiornato: riprova");
      openJobCard(orderId);
      return;
    }

    const i=state.orders.findIndex(x=>x.id===orderId);
    if(i>=0) state.orders[i]=saved;

    // Aggiorna anche lo snapshot della scheda: la X non deve ripristinare
    // il vecchio stato già salvato nel database.
    if(jobCardEditSnapshot && jobCardEditSnapshot.orderId===orderId){
      jobCardEditSnapshot.order=JSON.parse(JSON.stringify(saved));
    }

    openJobCard(orderId);
    renderCurrentView();
    showToast(`Stato aggiornato: ${value}`);
    return;
  }

  saveState('orders');
}

        nome:p.nome||"",
        categoria:p.categoria||"Tessile",
        colore:canonicalWarehouseColor(p.colore||""),
        taglia:p.taglia||"UNICA",
        unita:"pz",
        quantita:Number(p.quantita)||0,
        scortaMinima:Number(p.scortaMinima)||0,
        warehouseGroup:p.warehouseGroup||"Tessile"
      });
    }

    if(saved) salvati++;
    else rimasti.push(p);
  }

  localStorage.setItem("warehousePendingRecovery",JSON.stringify(rimasti));
  await reloadWarehouseFromDb();
  renderMagazzino();
  showToast(`${salvati} inserimenti recuperati${rimasti.length?`, ${rimasti.length} ancora da salvare`:""}`);
}

function existingWarehouseSizesForCode(code,colore=""){

    .filter(w=>String(w.codice||"").trim().toUpperCase()===key && (!ck || warehouseColorKey(w.colore)===ck))

function quickWarehouseColors(code){

function quickWarehouseSizes(code,colore=""){

    warehouseColorKey(w.colore)===warehouseColorKey(colore) &&

}

async function updateWarehouseDirect(existing, patch){
  const candidate={...existing,...patch};
  const row=toDbRow("warehouse",candidate);

  activeDbWrites++;
  try{
    const {data,error}=await sb
      .from(TABLES.warehouse)
      .update({
        codice:row.codice,
        nome:row.nome,
        categoria:row.categoria,
        colore:row.colore,
        taglia:row.taglia,
        quantita:row.quantita,
        scorta_minima:row.scorta_minima,
        unita:row.unita
      })
      .eq("id",existing.id)
      .select("*")
      .single();

    if(error){
      console.error("ERRORE UPDATE MAGAZZINO",error);
      showToast(`MAGAZZINO NON SALVATO: ${error.message||"errore Supabase"}`);
      return null;
    }

    const saved=fromDbRow("warehouse",data);
    if(!syncSnapshots.warehouse) syncSnapshots.warehouse=new Map();
    syncSnapshots.warehouse.set(saved.id,rowFingerprint("warehouse",saved));
    return saved;
  }finally{
    activeDbWrites=Math.max(0,activeDbWrites-1);
  }
}

async function insertWarehouseDirect(base){
  // Non assumiamo il tipo della colonna ID.
  // 1) ID testuale storico del gestionale
  // 2) UUID
  // 3) nessun ID, lasciando il default del database
  const attempts=[
    {...base,id:uid()},
    {...base,id:uuid()},
    {...base}
  ];

  let lastError=null;

  for(let i=0;i<attempts.length;i++){
    const obj=attempts[i];
    const row=toDbRow("warehouse",{...obj,id:obj.id||null});
    if(!obj.id) delete row.id;

    activeDbWrites++;
    try{
      const {data,error}=await sb
        .from(TABLES.warehouse)
        .insert(row)
        .select("*")
        .single();

      if(!error && data){
        const saved=fromDbRow("warehouse",data);
        if(!syncSnapshots.warehouse) syncSnapshots.warehouse=new Map();
        syncSnapshots.warehouse.set(saved.id,rowFingerprint("warehouse",saved));
        return saved;
      }
      lastError=error;
      console.warn("Tentativo inserimento magazzino fallito",i+1,error);
    }finally{
      activeDbWrites=Math.max(0,activeDbWrites-1);
    }
  }

  console.error("ERRORE INSERT MAGAZZINO",lastError);
  showToast(`MAGAZZINO NON SALVATO: ${lastError?.message||"errore Supabase"}`);
  return null;
}

async function reloadWarehouseFromDb(){
  activeDbWrites++;
  try{
    const {data,error}=await sb.from(TABLES.warehouse).select("*");
    if(error){
      console.error("Errore rilettura magazzino",error);
      showToast(`Salvato, ma rilettura fallita: ${error.message||"riprova"}`);
      return false;
    }
    state.warehouse=(data||[])
      .map(r=>fromDbRow("warehouse",r))
      .filter(w=>Number(w.quantita)>0);
    if(!syncSnapshots.warehouse) syncSnapshots.warehouse=new Map();
    state.warehouse.forEach(w=>syncSnapshots.warehouse.set(w.id,rowFingerprint("warehouse",w)));
    return true;
  }finally{
    activeDbWrites=Math.max(0,activeDbWrites-1);
  }
}

async function quickAddToWarehouse(){
  const button = document.querySelector('button[onclick="quickAddToWarehouse()"]');
  if(button){ button.disabled=true; button.textContent="SALVATAGGIO…"; }

  try{
    const group=magazzinoGroupFilter;
    const qty=Number(document.getElementById("quick-quantita")?.value)||0;
    const colore=canonicalWarehouseColor(document.getElementById("quick-colore")?.value?.trim()||"");
    const taglia=document.getElementById("quick-taglia")?.value?.trim()||"";

    if(qty<=0){ showToast("Inserisci una quantità maggiore di zero"); return; }
    if(group==="Tessile" && !colore){ showToast("Seleziona il colore"); return; }
    if(group==="Tessile" && !taglia){ showToast("Seleziona la taglia"); return; }

    let codice="",nome="",categoria="";
    if(group==="Tessile"){
      const raw=document.getElementById("quick-codice")?.value?.trim()||"";
      if(!raw){ showToast("Seleziona un prodotto"); return; }
      codice=normalizeCatalogCode(raw);
      const p=catalogProduct(codice);
      nome=p?.name||catalogNameForCode(codice)||raw;
      categoria=p?.appCategory||"Tessile";
    }else{
      nome=document.getElementById("quick-product")?.value||"";
      if(!nome){ showToast("Seleziona un prodotto"); return; }
      categoria=group==="Gadget"?"Gadget":"Materiali di stampa";
    }

    const normalizedTaglia=taglia||"UNICA";

    // Copia locale di sicurezza prima della scrittura
    const recovery={
      recoveryId:uuid(),
      codice,nome,categoria,colore,taglia:normalizedTaglia,
      unita:"pz",quantita:qty,scortaMinima:0,warehouseGroup:group,
      savedAt:new Date().toISOString()
    };
    try{
      const arr=JSON.parse(localStorage.getItem("warehousePendingRecovery")||"[]");
      arr.push(recovery);
      localStorage.setItem("warehousePendingRecovery",JSON.stringify(arr.slice(-200)));
    }catch(e){}

    // IMPORTANTISSIMO: per trovare la riga esistente NON confrontiamo il nome,
    // perché può cambiare tra catalogo vecchio/nuovo.
    const existing=state.warehouse.find(w=>
      warehouseRowKeyMatch(w,group,codice,colore,normalizedTaglia)
    );

    let saved=null;

    if(existing){
      saved=await updateWarehouseDirect(existing,{
        nome:nome||existing.nome,
        categoria:categoria||existing.categoria,
        quantita:Number(existing.quantita||0)+qty
      });
    }else{
      saved=await insertWarehouseDirect({
        codice,nome,categoria,colore,taglia:normalizedTaglia,
        quantita:qty,scortaMinima:0,unita:"pz",warehouseGroup:group
      });
    }

    if(!saved){
      showToast("NON salvato. L'inserimento resta disponibile in RECUPERA INSERIMENTI.");
      return;
    }

    // Rileggiamo SEMPRE il magazzino da Supabase.
    // Quello che appare dopo è ciò che esiste realmente nel database.
    await reloadWarehouseFromDb();

    const autoAssegnati = await autoAssegnaMerceArrivata();

    try{
      const arr=JSON.parse(localStorage.getItem("warehousePendingRecovery")||"[]");
      const filtered=arr.filter(x=>x.recoveryId!==recovery.recoveryId);
      localStorage.setItem("warehousePendingRecovery",JSON.stringify(filtered));
    }catch(e){}

    renderMagazzino();
    showToast(
      autoAssegnati>0
        ? `${qty} pz ricevuti · ${autoAssegnati} pz assegnati automaticamente alle commesse`
        : `${qty} pz SALVATI nel magazzino`
    );

  }catch(err){
    console.error("Errore inatteso quickAddToWarehouse",err);
    showToast(`ERRORE MAGAZZINO: ${err?.message||"riprova"}`);
  }finally{
    if(button){ button.disabled=false; button.textContent="AGGIUNGI NEL MAGAZZINO"; }
  }
}

function filteredMagazzinoRows(q){
  q = (q||"").toLowerCase();
  return state.warehouse
    .filter(w => Number(w.quantita)>0
      && (w.warehouseGroup||"Tessile")===magazzinoGroupFilter
      && (!magazzinoColorFilter || warehouseColorKey(w.colore)===warehouseColorKey(magazzinoColorFilter))
      && (!magazzinoTagliaFilter || String(w.taglia||"").trim().toUpperCase()===String(magazzinoTagliaFilter).trim().toUpperCase())
      && (!q || (w.codice||"").toLowerCase().includes(q) || (w.nome||"").toLowerCase().includes(q) || ((w.colore||"").toLowerCase().includes(q) || canonicalWarehouseColor(w.colore).toLowerCase().includes(q)) || (w.taglia||"").toLowerCase().includes(q)))
    .sort((a,b)=>{
      const codeCmp = String(a.codice||a.nome||"").localeCompare(String(b.codice||b.nome||""),"it",{numeric:true,sensitivity:"base"});
      if(codeCmp!==0) return codeCmp;
      const colorCmp = compareWarehouseColors(a.colore,b.colore);
      if(colorCmp!==0) return colorCmp;
      return compareWarehouseSizes(a.taglia,b.taglia);
    });
}

function sameVariant(a,b){
  const codeA = String(a.codice||"").trim().toUpperCase();
  const codeB = String(b.codice||"").trim().toUpperCase();
  const colorA = warehouseColorKey(a.colore);
  const colorB = warehouseColorKey(b.colore);
  const sizeA = String(a.taglia||"UNICA").trim().toUpperCase() || "UNICA";
  const sizeB = String(b.taglia||"UNICA").trim().toUpperCase() || "UNICA";
  return codeA===codeB && colorA===colorB && sizeA===sizeB;
}

async function autoAssegnaMerceArrivata(){
  let totaleAssegnato = 0;

  // Lavora solo su merce realmente presente.
  const righeMagazzino = [...state.warehouse]
    .filter(w=>Number(w.quantita)>0)
    .sort((a,b)=>{
      const c = String(a.codice||"").localeCompare(String(b.codice||""),"it",{numeric:true,sensitivity:"base"});
      if(c!==0) return c;
      const co = compareWarehouseColors(a.colore,b.colore);
      if(co!==0) return co;
      return compareWarehouseSizes(a.taglia,b.taglia);
    });

  for(const w of righeMagazzino){
    let disponibile = Math.max(0,Number(w.quantita)||0);
    if(disponibile<=0) continue;

    // Prima vengono servite le commesse messe nel carrello da più tempo.
    const richieste = [];
    state.orders
      .filter(o=>o.stato!=="Consegnato")
      .forEach(order=>{
        (order.magazzino||[]).forEach(entry=>{
          if(
            entry.inCarrello &&
            Number(entry.daOrdinareQty)>0 &&
            sameVariant(w,entry)
          ){
            richieste.push({order,entry});
          }
        });
      });

    richieste.sort((a,b)=>{
      const da = a.entry.inCarrelloAt || a.order.createdAt || "";
      const db = b.entry.inCarrelloAt || b.order.createdAt || "";
      return da.localeCompare(db);
    });

    for(const r of richieste){
      if(disponibile<=0) break;

      const mancano = Math.max(0,Number(r.entry.daOrdinareQty)||0);
      if(mancano<=0) continue;

      const q = Math.min(disponibile,mancano);
      if(q<=0) continue;

      // Snapshot per rollback in caso di errore.
      const oldEntry = {
        quantita:Math.max(0,Number(r.entry.quantita)||0),
        quantitaRichiesta:Math.max(0,Number(r.entry.quantitaRichiesta)||0),
        _reservedQty:Math.max(0,Number(r.entry._reservedQty)||0),
        articoloId:r.entry.articoloId||"",
        daOrdinareQty:Math.max(0,Number(r.entry.daOrdinareQty)||0),
        stornato:!!r.entry.stornato,
        ordineConfermato:!!r.entry.ordineConfermato,
        inCarrello:!!r.entry.inCarrello,
        inCarrelloAt:r.entry.inCarrelloAt||null
      };

      // Quantità totale realmente richiesta dalla scheda.
      // È importante non fidarsi solo di "quantita": in vecchie righe può essere
      // rimasta disallineata rispetto a "già riservato + ancora da ordinare".
      const quantitaRichiesta = Math.max(
        oldEntry.quantitaRichiesta,
        oldEntry.quantita,
        oldEntry._reservedQty + oldEntry.daOrdinareQty
      );

      // 1) scala la merce dal magazzino
      const savedWarehouse = await updateWarehouseDirect(w,{
        quantita:Math.max(0,disponibile-q)
      });
      if(!savedWarehouse) continue;

      disponibile = Math.max(0,Number(savedWarehouse.quantita)||0);
      const wi = state.warehouse.findIndex(x=>x.id===savedWarehouse.id);
      if(wi>=0) state.warehouse[wi]=savedWarehouse;

      // 2) collega la quantità alla scheda lavoro.
      // Manteniamo SEMPRE la quantità totale richiesta originale:
      // es. 3 L richieste => dopo l'arrivo deve restare "Quantità 3",
      // non la sola quantità dell'ultimo movimento.
      const nuovoRiservato = Math.min(
        quantitaRichiesta,
        oldEntry._reservedQty + q
      );

      r.entry.quantitaRichiesta = quantitaRichiesta;
      r.entry.quantita = quantitaRichiesta;
      r.entry._reservedQty = nuovoRiservato;
      r.entry.articoloId = savedWarehouse.id;
      r.entry.daOrdinareQty = Math.max(0,quantitaRichiesta-nuovoRiservato);
      r.entry.stornato = r.entry.daOrdinareQty===0;

      if(r.entry.daOrdinareQty===0){
        // Arrivato tutto: non è più "nel carrello", è disponibile sulla commessa.
        r.entry.ordineConfermato = false;
        r.entry.inCarrello = false;
        r.entry.inCarrelloAt = null;
      }else{
        // Arrivo parziale: resta nel carrello solo la quantità ancora mancante.
        r.entry.ordineConfermato = true;
        r.entry.inCarrello = true;
      }

      // 3) salva la scheda lavoro
      const orderSaved = await upsertOne("orders",r.order);

      if(!orderSaved){
        // Rollback: rimette i pezzi a magazzino e ripristina la riga.
        const rollbackWarehouse = await updateWarehouseDirect(savedWarehouse,{
          quantita:Number(savedWarehouse.quantita||0)+q
        });
        if(rollbackWarehouse){
          const rwi = state.warehouse.findIndex(x=>x.id===rollbackWarehouse.id);
          if(rwi>=0) state.warehouse[rwi]=rollbackWarehouse;
          disponibile = Math.max(0,Number(rollbackWarehouse.quantita)||0);
        }

        r.entry.quantita = oldEntry.quantita;
        r.entry.quantitaRichiesta = oldEntry.quantitaRichiesta;
        r.entry._reservedQty = oldEntry._reservedQty;
        r.entry.articoloId = oldEntry.articoloId;
        r.entry.daOrdinareQty = oldEntry.daOrdinareQty;
        r.entry.stornato = oldEntry.stornato;
        r.entry.ordineConfermato = oldEntry.ordineConfermato;
        r.entry.inCarrello = oldEntry.inCarrello;
        r.entry.inCarrelloAt = oldEntry.inCarrelloAt;
        continue;
      }

      totaleAssegnato += q;
    }
  }

  if(totaleAssegnato>0){
    await reloadWarehouseFromDb();
  }

  return totaleAssegnato;
}

function destinazioniCarrelloPerMagazzino(w){
  let disponibile = Math.max(0, Number(w.quantita)||0);
  if(disponibile<=0) return [];
  const richieste = [];
  state.orders
    .filter(o=>o.stato!=="Consegnato")
    .forEach(order=>{
      (order.magazzino||[]).forEach(entry=>{
        if(entry.inCarrello && Number(entry.daOrdinareQty)>0 && sameVariant(w,entry)){
          richieste.push({order,entry});
        }
      });
    });
  richieste.sort((a,b)=>{
    const da = a.entry.inCarrelloAt || a.order.createdAt || "";
    const db = b.entry.inCarrelloAt || b.order.createdAt || "";
    return da.localeCompare(db);
  });
  const out = [];
  for(const r of richieste){
    if(disponibile<=0) break;
    const q = Math.min(disponibile, Number(r.entry.daOrdinareQty)||0);
    if(q>0){
      out.push({order:r.order, entry:r.entry, quantita:q});
      disponibile -= q;
    }
  }
  return out;
}

/* ============ IMPORT DDT ACTION WEAR DA PDF ============ */
let pdfParsedRows = [];
async function extractPdfLines(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const allLines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const groups = {};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]/3)*3;
      (groups[y] = groups[y]||[]).push({str:it.str, x:it.transform[4]});
    });
    Object.keys(groups).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line = groups[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
      if(line) allLines.push(line);
    });
  }
  return allLines;
}
function guessArticoloCategoria(nome){
  const n = nome.toLowerCase();
  if(n.includes("t-shirt") || n.includes("t kids") || n.includes("tshirt")) return "T-shirt";
  if(n.includes("polo")) return "Polo";
  if(n.includes("jacket") || n.includes("felpa") || n.includes("hoodie") || n.includes("sweat") || n.includes("zip")) return "Felpa";
  if(n.includes("bag") || n.includes("shopper")) return "Shopper";
  if(n.includes("cap") || n.includes("hat") || n.includes("five")) return "Cappello";
  return "Altro tessuto";
}
let pdfImportDetectedFormat = "";

function parseActionWearLines(lines){
  const results = [];

  // ------------------------------------------------------
  // FORMATO 1: vecchi DDT Action Wear
  // Esempio:
  // BS010 BK 123456 Descrizione N. 10
  // S/2 M/3 L/5
  // ------------------------------------------------------
  const oldLineRe = /^([A-Z0-9]{3,14})\s+([A-Z0-9]{1,6})\s+\d{5,7}\s+(.+?)\s+N\.\s+(\d+)\s*$/i;
  const oldSizeRe = /(\S+)\/(\d+)/g;

  for(let i=0;i<lines.length;i++){
    const line = String(lines[i]||"").replace(/\s+/g," ").trim();
    const m = line.match(oldLineRe);
    if(!m) continue;

    const [, codiceRaw, coloreRaw, nomeRaw, qtaTotale] = m;
    const codice = String(codiceRaw||"").trim().toUpperCase();
    const coloreDDT = String(coloreRaw||"").trim().toUpperCase();
    const nome = String(nomeRaw||"").trim();

    const nextLine = String(lines[i+1]||"").replace(/\s+/g," ").trim();
    const sizes = [...nextLine.matchAll(oldSizeRe)];

    if(sizes.length){
      sizes.forEach(s=>{
        results.push({
          codice,
          colore:canonicalWarehouseColor(coloreDDT),
          coloreDDT,
          nome,
          taglia:String(s[1]||"").trim(),
          quantita:parseInt(s[2],10),
          categoria:guessArticoloCategoria(nome),
          include:true
        });
      });
    } else {
      results.push({
        codice,
        colore:canonicalWarehouseColor(coloreDDT),
        coloreDDT,
        nome,
        taglia:"UNICA",
        quantita:parseInt(qtaTotale,10),
        categoria:guessArticoloCategoria(nome),
        include:true
      });
    }
  }

  if(results.length){
    pdfImportDetectedFormat = "DDT Action Wear";
    return results;
  }

  // ------------------------------------------------------
  // FORMATO 2: Conferma d'ordine Action Wear
  //
  // Esempio:
  // BS201 - NY - S Evolution Polo 8 4,40 € 35,20 € ...
  //
  // Il prezzo unitario viene usato come "ancora" per separare
  // con sicurezza descrizione e quantità.
  // ------------------------------------------------------
  const orderLineRe =
    /^([A-Z0-9]{2,16})\s*-\s*([A-Z0-9]{1,8})\s*-\s*(\S+)\s+(.+?)\s+(\d+)\s+\d{1,4}(?:\.\d{3})*,\d{2}\s*€/i;

  for(let i=0;i<lines.length;i++){
    const line = String(lines[i]||"").replace(/\s+/g," ").trim();
    const m = line.match(orderLineRe);
    if(!m) continue;

    const codice = String(m[1]||"").trim().toUpperCase();
    const coloreDDT = String(m[2]||"").trim().toUpperCase();
    const taglia = String(m[3]||"").trim().toUpperCase();
    const nome = String(m[4]||"").trim();
    const quantita = parseInt(m[5],10);

    if(!codice || !coloreDDT || !taglia || !Number.isFinite(quantita) || quantita<=0) continue;

    results.push({
      codice,
      colore:canonicalWarehouseColor(coloreDDT),
      coloreDDT,
      nome,
      taglia,
      quantita,
      categoria:guessArticoloCategoria(nome),
      include:true
    });
  }

  if(results.length){
    pdfImportDetectedFormat = "Conferma d'ordine Action Wear";
  }

  return results;
}

function enrichPdfRowsFromCatalog(){
  pdfParsedRows.forEach(r=>{
    const cp = catalogProduct(r.codice);
    if(!cp) return;

    if(cp.name) r.nome = cp.name;
    if(cp.appCategory) r.categoria = cp.appCategory;

    // Se il colore del documento è già presente nel catalogo con lo stesso
    // significato, usiamo il nome canonico del catalogo.
    if(Array.isArray(cp.colors) && cp.colors.length){
      const target = warehouseColorKey(r.colore);
      const found = cp.colors.find(c=>warehouseColorKey(c)===target);
      if(found) r.colore = canonicalWarehouseColor(found);
    }
  });
}

async function handlePdfImport(evt){
  const file = evt.target.files[0];
  if(!file) return;

  const statusEl = document.getElementById("pdfImportStatus");
  const previewEl = document.getElementById("pdfImportPreview");

  pdfParsedRows = [];
  pdfImportDetectedFormat = "";
  if(previewEl) previewEl.innerHTML = "";
  statusEl.textContent = "Lettura del PDF in corso…";

  try{
    const lines = await extractPdfLines(file);
    pdfParsedRows = parseActionWearLines(lines);

    if(!pdfParsedRows.length){
      statusEl.textContent =
        "Non ho riconosciuto articoli in questo PDF. Sono supportati i DDT Action Wear e le Conferme d'ordine Action Wear.";
      if(previewEl) previewEl.innerHTML = "";
      return;
    }

    // Carica il catalogo per mostrare già in anteprima nomi/categorie corretti.
    try{
      await loadCatalogoProdotti();
      enrichPdfRowsFromCatalog();
    }catch(e){
      console.warn("Catalogo non disponibile durante l'anteprima PDF:", e);
    }

    const totalePezzi = pdfParsedRows.reduce((s,r)=>s+(Number(r.quantita)||0),0);

    statusEl.textContent =
      `PDF riconosciuto: ${pdfImportDetectedFormat}. ` +
      `${pdfParsedRows.length} varianti, ${totalePezzi} pezzi totali. ` +
      `Controlla l'anteprima prima di confermare.`;

    renderPdfPreview();
  }catch(err){
    console.error(err);
    statusEl.textContent =
      "Errore nella lettura del PDF. Nessun articolo è stato aggiunto al magazzino.";
    if(previewEl) previewEl.innerHTML = "";
  }
}

async function confirmPdfImport(){
  const toInclude = pdfParsedRows.filter(r=>r.include && Number(r.quantita)>0);
  let salvati=0;

  for(const source of toInclude){
    const r={...source};
    const cp = catalogProduct(r.codice);
    if(cp){
      r.nome = cp.name || r.nome;
      r.categoria = cp.appCategory || r.categoria;
    }
    r.taglia = r.taglia || "UNICA";

    const existing = state.warehouse.find(w =>
      String(w.codice||"").toUpperCase()===String(r.codice||"").toUpperCase() &&
      warehouseColorKey(w.colore)===warehouseColorKey(r.colore) &&
      String(w.taglia||"UNICA").toUpperCase()===String(r.taglia||"UNICA").toUpperCase()
    );

    if(existing){
      const candidate={
        ...existing,
        quantita:Number(existing.quantita||0)+Number(r.quantita||0),
        colore:canonicalWarehouseColor(existing.colore || r.colore),
        nome:existing.nome || r.nome,
        categoria:existing.categoria || r.categoria,
        warehouseGroup:existing.warehouseGroup || "Tessile",
        scortaMinima:Math.max(0,Number(existing.scortaMinima)||0)
      };
      if(await upsertOne("warehouse",candidate)){
        Object.assign(existing,candidate);
        salvati++;
      }
    }else{
      const nuovo={
        id:uuid(), codice:r.codice, nome:r.nome, categoria:r.categoria,
        colore:canonicalWarehouseColor(r.colore), taglia:r.taglia, unita:"pz",
        quantita:Number(r.quantita)||0, scortaMinima:0, warehouseGroup:"Tessile"
      };
      nuovo.scortaMinima = minimoDefaultMagazzino(nuovo);
      const saved=await upsertOneReturning("warehouse",nuovo);
      if(saved){ state.warehouse.push(saved); salvati++; }
    }
  }

  let autoAssegnati = 0;
  if(salvati>0){
    await reloadWarehouseFromDb();
    autoAssegnati = await autoAssegnaMerceArrivata();
  }

  if(salvati===toInclude.length){
    pdfParsedRows = [];
    toggleForm('pdfImportForm');
    const inp=document.getElementById('pdfFileInput'); if(inp) inp.value="";
  }

  renderMagazzino();
  showToast(
    autoAssegnati>0
      ? `${salvati} varianti importate · ${autoAssegnati} pz assegnati automaticamente alle commesse`
      : `${salvati} di ${toInclude.length} articoli salvati nel magazzino`
  );
}

/* ============ INCASSI / REPORT PAGAMENTI ============ */
let incassiFilters = {metodo:"", categoria:"", mese: currentMonth(), view:"giorno"};
function isoWeekKey(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
  return `${d.getFullYear()}-W${String(weekNo).padStart(2,"0")}`;
}
function addDaysTo(dateStr,n){ const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function mondayOf(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay()||7;
  d.setDate(d.getDate()-day+1);
  return d.toISOString().slice(0,10);
}
const MESI_IT = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GIORNI_IT = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
function dayLabelIt(dateStr){ const d = new Date(dateStr+"T00:00:00"); return `${GIORNI_IT[d.getDay()]} ${fmtDate(dateStr)}`; }
function statsInRange(startDate, endDate){
  const incassi = state.payments.filter(p=>p.data>=startDate && p.data<=endDate).reduce((s,p)=>s+Number(p.importo),0);
  const entrate = (state.entrate||[]).filter(e=>e.data>=startDate && e.data<=endDate).reduce((s,e)=>s+Number(e.importo),0);
  const spese = state.expenses.filter(e=>e.data>=startDate && e.data<=endDate).reduce((s,e)=>s+Number(e.importo),0);
  const costiFissi = (state.fixedCosts||[]).filter(e=>e.data>=startDate && e.data<=endDate).reduce((s,e)=>s+Number(e.importo),0);
  return {incassi, entrate, spese, costiFissi, diff:incassi+entrate-spese-costiFissi};
}
function buildDailyRows(numDays){
  const rows = [];
  for(let i=0;i<numDays;i++){
    const d = addDays(-i);
    rows.push({key:d, start:d, end:d, label:dayLabelIt(d), ...statsInRange(d,d)});
  }
  return rows;
}
function buildWeeklyRows(numWeeks){
  const rows = []; const seen = new Set();
  let cursor = mondayOf(today());
  for(let i=0;i<numWeeks;i++){
    if(!seen.has(cursor)){
      seen.add(cursor);
      const end = addDaysTo(cursor,6);
      rows.push({key:cursor, start:cursor, end, label:`Settimana ${fmtDate(cursor)} → ${fmtDate(end)}`, ...statsInRange(cursor,end)});
    }
    cursor = addDaysTo(cursor,-7);
  }
  return rows;
}
function buildMonthlyRows(year){
  return MESI_IT.map((nome,idx)=>{
    const mm = String(idx+1).padStart(2,"0");
    const monthKey = `${year}-${mm}`;
    const ordersInMonth = state.orders.filter(o=>o.createdAt && o.createdAt.slice(0,7)===monthKey);
    const paymentsInMonth = state.payments.filter(p=>p.data && p.data.slice(0,7)===monthKey);

    // Separazione richiesta:
    // - "Pagamenti" = incassi collegati a schede NON fatturate
    // - "Pagamenti fatturati" = incassi collegati a schede fatturate
    const paymentsFatturati = paymentsInMonth.filter(p=>{
      const ordine=findItem("orders",p.orderId);
      return !!(ordine && ordine.fatturato);
    });
    const paymentsNonFatturati = paymentsInMonth.filter(p=>{
      const ordine=findItem("orders",p.orderId);
      return !(ordine && ordine.fatturato);
    });

    const contanti = paymentsNonFatturati.filter(p=>p.metodo==="Contanti").reduce((s,p)=>s+Number(p.importo),0);
    const carta = paymentsNonFatturati.filter(p=>normalizePaymentMethod(p.metodo)==="Carta di Pagamento").reduce((s,p)=>s+Number(p.importo),0);
    const bonifico = paymentsNonFatturati.filter(p=>p.metodo==="Bonifico").reduce((s,p)=>s+Number(p.importo),0);
    const soldiIncassati = contanti+carta+bonifico;

    const pagamentiFatturati = paymentsFatturati.reduce((s,p)=>s+Number(p.importo||0),0);
    const totaleIncassiReali = soldiIncassati + pagamentiFatturati;

    const entrate = (state.entrate||[]).filter(e=>e.data && e.data.slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.importo),0);
    const spese = state.expenses.filter(e=>e.data && e.data.slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.importo),0);
    const costiFissi = (state.fixedCosts||[]).filter(e=>e.data && e.data.slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.importo),0);

    // "Totale Ordini" = valore lordo delle schede create nel mese, NON soldi incassati.
    const totaleOrdini = ordersInMonth.reduce((s,o)=>s+orderTotale(o),0);

    return {
      mese:nome, monthKey, nOrdini:ordersInMonth.length, totaleOrdini,
      nPagamenti:paymentsNonFatturati.length,
      contanti, carta, bonifico, soldiIncassati,
      nPagamentiFatturati:paymentsFatturati.length,
      pagamentiFatturati,
      totaleIncassiReali,
      entrate, spese, costiFissi,
      // La differenza resta una fotografia reale della cassa:
      // comprende sia incassi non fatturati sia incassi di schede fatturate.
      differenza:totaleIncassiReali+entrate-spese-costiFissi
    };
  });
}

function addPayment(){
  const orderId = document.getElementById("pf-ordine").value;
  if(!orderId){ showToast("Crea prima almeno un ordine"); return; }
  const order = findItem('orders', orderId);
  const importo = Number(document.getElementById("pf-importo").value)||0;
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }
  state.payments.push({id:uid(), orderId, clientId:order.clientId,
    tipo:document.getElementById("pf-tipo").value, importo,
    data:document.getElementById("pf-data").value || today(), metodo:document.getElementById("pf-metodo").value});

}

/* ============ COSTI FISSI (SOLO AMMINISTRATORE) ============ */
function fixedCostsTotaleMese(month){
  return (state.fixedCosts||[]).filter(e=>e.data && e.data.slice(0,7)===month).reduce((s,e)=>s+Number(e.importo),0);
}
function safeStorageFileName(name){
  return String(name||"documento.pdf")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9._-]+/g,"-")
    .replace(/-+/g,"-");
}
async function fixedCostSignedUrl(path){
  if(!path) return null;
  const { data, error } = await sb.storage.from("fixed-costs").createSignedUrl(path, 120);
  if(error){ console.error(error); showToast("Impossibile aprire il documento"); return null; }
  return data?.signedUrl || null;
}
async function openFixedCostFile(id){
  const item = findItem('fixedCosts', id);
  if(!item || !item.filePath) return;
  const url = await fixedCostSignedUrl(item.filePath);
  if(url) window.open(url, "_blank", "noopener");
}

async function addFixedCost(){
  if(!currentUser || currentUser.role!=="admin"){ showToast("Operazione riservata all'amministratore"); return; }
  const descrizione = document.getElementById("fc-descrizione").value.trim();
  const importo = Number(document.getElementById("fc-importo").value)||0;
  const data = document.getElementById("fc-data").value || today();
  const metodo = document.getElementById("fc-metodo").value;
  const file = document.getElementById("fc-file").files[0] || null;
  if(!descrizione){ showToast("Inserisci una descrizione"); return; }
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }
  if(file && file.type!=="application/pdf" && !file.name.toLowerCase().endsWith(".pdf")){ showToast("Puoi caricare solo file PDF"); return; }

  const id = uid();
  const item = {id, descrizione, importo, metodo, data, filePath:"", fileName:""};
  const ok = await upsertOne('fixedCosts', item);
  if(!ok) return;

  if(file){
    const storagePath = `${currentUser.id}/${id}/${Date.now()}-${safeStorageFileName(file.name)}`;
    const { error:uploadError } = await sb.storage.from("fixed-costs").upload(storagePath, file, {contentType:"application/pdf", upsert:false});
    if(uploadError){
      console.error(uploadError);
      showToast(`Costo salvato, ma PDF non caricato: ${uploadError.message||"errore"}`);
    }else{
      item.filePath = storagePath;
      item.fileName = file.name;
      const okFile = await upsertOne('fixedCosts', item);
      if(!okFile) return;
    }
  }

  if(!state.fixedCosts.some(x=>x.id===id)) state.fixedCosts.push(item);
  toggleForm('fixedCostForm');
  renderCostiFissi();
  showToast("Costo fisso registrato");
}
async function deleteFixedCost(id){
  if(!currentUser || currentUser.role!=="admin") return;
  const item = findItem('fixedCosts', id);
  askConfirm("Eliminare questo costo fisso e l'eventuale documento allegato?", async ()=>{
    if(item?.filePath){
      const { error } = await sb.storage.from("fixed-costs").remove([item.filePath]);
      if(error) console.error("Errore eliminazione file", error);
    }
    state.fixedCosts = (state.fixedCosts||[]).filter(e=>e.id!==id);
    await dbDelete('fixedCosts', id);
    renderCostiFissi();
    showToast("Costo fisso eliminato");
  });
}

function readLocalMailActionFlags(messageId){
  try{
    const all=JSON.parse(localStorage.getItem("gmailActionFlags")||"{}");
    return all[messageId]||null;
  }catch(e){
    return null;
  }
}

function writeLocalMailActionFlags(messageId, flags){
  try{
    const all=JSON.parse(localStorage.getItem("gmailActionFlags")||"{}");
    all[messageId]={
      replied:!!flags.replied,
      leadGenerated:!!flags.leadGenerated,
      orderGenerated:!!flags.orderGenerated
    };
    localStorage.setItem("gmailActionFlags",JSON.stringify(all));
  }catch(e){
    console.warn("Salvataggio locale stato mail non disponibile",e);
  }
}

function getGmailActionFlags(messageId){
  const dbRow=(state.gmailActionStatus||[]).find(x=>x.gmailMessageId===messageId);
  const local=readLocalMailActionFlags(messageId);

  return {
    gmailMessageId:messageId,
    replied:!!(dbRow?.replied || local?.replied),
    leadGenerated:!!(dbRow?.leadGenerated || local?.leadGenerated),
    orderGenerated:!!(dbRow?.orderGenerated || local?.orderGenerated)
  };
}

function gmailActionStatusBadge(messageId){
  const flags=getGmailActionFlags(messageId);
  const badges=[];
  if(flags.replied) badges.push(`<span class="mail-action-status wait">IN ATTESA</span>`);
  if(flags.leadGenerated) badges.push(`<span class="mail-action-status lead">LEAD GENERATO</span>`);
  if(flags.orderGenerated) badges.push(`<span class="mail-action-status order">ORDINE EFFETTUATO</span>`);
  return badges.join("");
}

async function setGmailActionFlag(messageId, field){
  if(!messageId) return;

  // 1. Aggiorna SUBITO l'interfaccia, senza aspettare Supabase.
  const current=getGmailActionFlags(messageId);
  const updated={
    ...current,
    replied:!!current.replied,
    leadGenerated:!!current.leadGenerated,
    orderGenerated:!!current.orderGenerated
  };

  if(field==="replied") updated.replied=true;
  if(field==="leadGenerated") updated.leadGenerated=true;
  if(field==="orderGenerated") updated.orderGenerated=true;

  let i=(state.gmailActionStatus||[]).findIndex(x=>x.gmailMessageId===messageId);
  const immediateRow={
    id:i>=0 ? state.gmailActionStatus[i].id : null,
    gmailMessageId:messageId,
    replied:updated.replied,
    leadGenerated:updated.leadGenerated,
    orderGenerated:updated.orderGenerated,
    updatedAt:new Date().toISOString()
  };

  if(i>=0) state.gmailActionStatus[i]=immediateRow;
  else{
    state.gmailActionStatus=state.gmailActionStatus||[];
    state.gmailActionStatus.push(immediateRow);
  }

  writeLocalMailActionFlags(messageId,updated);

  if(currentView==="posta") renderPosta();

  // 2. Poi prova a renderlo persistente su Supabase.
  const payload={
    gmail_message_id:messageId,
    replied:updated.replied,
    lead_generated:updated.leadGenerated,
    order_generated:updated.orderGenerated,
    updated_at:new Date().toISOString()
  };

  try{
    const {data,error}=await sb.from("gmail_action_status")
      .upsert(payload,{onConflict:"gmail_message_id"})
      .select("*")
      .single();

    if(error){
      console.error("Errore persistenza stato mail",error);
      return;
    }

    const mapped=fromDbRow("gmailActionStatus",data);
    i=(state.gmailActionStatus||[]).findIndex(x=>x.gmailMessageId===messageId);
    if(i>=0) state.gmailActionStatus[i]=mapped;
    else state.gmailActionStatus.push(mapped);

  }catch(error){
    console.error("Errore persistenza stato mail",error);
  }
}

function mailHasLabel(message, label){
  return Array.isArray(message?.labels) && message.labels.includes(label);
}

function mailDisplayName(raw){
  const value = String(raw||"").trim();
  if(!value) return "Mittente sconosciuto";
  const match = value.match(/^"?([^"<]+)"?\s*<[^>]+>$/);
  return (match ? match[1] : value).trim();
}

function formatMailDate(raw){
  const d = new Date(raw);
  if(Number.isNaN(d.getTime())) return raw || "";
  const now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

function visibleGmailMessages(){
  let list = [...gmailMessages].sort((a,b)=>{
    const da = new Date(a.date||0).getTime()||0;
    const db = new Date(b.date||0).getTime()||0;
    return db-da;
  });

  if(gmailFilter==="sent") list = list.filter(m=>mailHasLabel(m,"SENT"));
  else if(gmailFilter==="unread") list = list.filter(m=>mailHasLabel(m,"UNREAD") && !isGmailLocallyRead(m.id) && mailHasLabel(m,"INBOX"));
  else if(gmailFilter!=="all") list = list.filter(m=>mailHasLabel(m,"INBOX"));

  const q=String(gmailSearch||"").trim().toLowerCase();
  if(q){
    list = list.filter(m=>[m.from,m.to,m.subject,m.snippet,m.date].join(" ").toLowerCase().includes(q));
  }
  return list;
}

function mailFileSize(bytes){
  const n=Number(bytes)||0;
  if(!n) return "";
  if(n<1024) return `${n} B`;
  if(n<1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/(1024*1024)).toFixed(1)} MB`;
}
function sanitizeEmailHtml(raw){

    .replace(/javascript:/gi,"");

async function gmailOrderAction(messageId){

  if(!m?.id){ showToast("Apri prima una mail"); return; }
  const bodyText=`Gentile cliente,

abbiamo preso in carico il tuo ordine.
Avviseremo appena il lavoro sarà pronto per essere ritirato.

Cordiali saluti

Creativò Group Srls
06 45665328 · 375 9095981
creativogroup.it
Via Giuseppe Taverna 43
00135 Roma`;
  const btn=document.getElementById("gmail-btn-order");

    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");
    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{

      body:JSON.stringify({

      })
    });
    const raw=await response.text();
    let result={};
    try{ result=JSON.parse(raw); }catch(e){}
    if(!response.ok) throw new Error(result?.error||result?.message||raw||`Errore HTTP ${response.status}`);
    await setGmailActionFlag(messageId,"replied");

  }

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const result=String(reader.result||"");
      const base64=result.includes(",") ? result.split(",").pop() : result;
      resolve(base64||"");
    };
    reader.onerror=()=>reject(reader.error||new Error("Errore lettura file"));
    reader.readAsDataURL(file);
  });
}

async function handleGmailReplyFiles(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length) return;

  if(gmailReplyAttachments.length + files.length > 10){
    showToast("Puoi allegare al massimo 10 file");
    const input=document.getElementById("gmail-reply-file-input");
    if(input) input.value="";
    return;
  }

  try{
    for(const file of files){
      const dataBase64=await fileToBase64(file);
      gmailReplyAttachments.push({
        filename:file.name,
        mimeType:file.type||"application/octet-stream",
        size:file.size||0,
        dataBase64
      });
    }
    renderPosta();
  }catch(err){
    console.error("Allegato Gmail error",err);
    showToast("Errore durante la lettura di un allegato");
  }
}

async function sendGmailReply(){
  if(gmailReplySending) return;
  const m=gmailSelectedMessage;
  if(!m?.id){
    showToast("Mail originale non disponibile");
    return;
  }

  const bodyText=String(gmailReplyText||"").trim();
  if(!bodyText){
    showToast("Scrivi il testo della risposta");
    return;
  }

  gmailReplySending=true;
  gmailReplyStatus="Invio in corso…";
  renderPosta();

  try{
    const {data:sessionData}=await sb.auth.getSession();
    const session=sessionData?.session;
    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");

    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${session.access_token}`,
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messageId:m.id,

        bcc:String(gmailReplyBcc||"").trim(),
        subject:String(gmailReplySubject||normalizeReplySubjectClient(m.subject||"")).trim(),
        attachments:gmailReplyAttachments
      })
    });

    const raw=await response.text();
    let result={};
    try{ result=JSON.parse(raw); }
    catch(e){ throw new Error(raw||`Errore HTTP ${response.status}`); }

    if(!response.ok){
      throw new Error(result?.error||result?.message||`Errore HTTP ${response.status}`);
    }

    gmailReplyStatus="✓ Risposta inviata correttamente";
    showToast("Email inviata");

    gmailReplyText="";
    gmailReplyCc="";
    gmailReplyBcc="";
    gmailReplySubject="";
    gmailReplyOptionsOpen=false;
    gmailReplyAttachments=[];

    setTimeout(async ()=>{

  }catch(err){
    console.error("Gmail send error",err);
    gmailReplyStatus=`Errore: ${err?.message||"invio non riuscito"}`;
  }finally{
    gmailReplySending=false;
    renderPosta();
  }
}


function gmailExtractAddress(value){
  const raw=String(value||"").trim();
  const m=raw.match(/<([^>]+)>/);
  if(m) return m[1].trim().toLowerCase();
  const simple=raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  return simple ? simple[0].toLowerCase() : "";
}

function gmailExtractName(value){
  const raw=String(value||"").trim();
  let name=raw.replace(/<[^>]+>/g,"").replace(/^["']|["']$/g,"").trim();
  if(!name){
    const email=gmailExtractAddress(raw);
    name=email ? email.split("@")[0].replace(/[._-]+/g," ") : "";
  }
  return name;
}

function gmailExtractPhone(text){
  const raw=String(text||"").replace(/\s+/g," ");
  const matches=raw.match(/(?:\+39[\s.-]?)?(?:\(?0\d{1,4}\)?[\s.-]?)?\d(?:[\s.-]?\d){7,10}/g)||[];
  for(const item of matches){
    const digits=item.replace(/\D/g,"");
    if(digits.length>=9 && digits.length<=13) return item.trim();
  }
  return "";
}

function gmailBase64UrlToBlob(base64url, mimeType){
  const base64=String(base64url||"").replace(/-/g,"+").replace(/_/g,"/");
  const padded=base64 + "=".repeat((4-(base64.length%4))%4);
  const binary=atob(padded);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mimeType||"application/octet-stream"});
}

async function fetchGmailAttachmentBlob(index){
  const m=gmailSelectedMessage;

  const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-attachment`,{
    method:"POST",
    headers:{
      "Authorization":`Bearer ${session.access_token}`,
      "apikey":SUPABASE_KEY,

    },
    body:JSON.stringify({

      attachmentId,
      filename:a.filename||"allegato",
      mimeType:a.mimeType||"application/octet-stream"

  });

async function copyGmailOrderAttachmentsToDropbox(order,ctx){
  if(!order || !ctx?.messageId) return {uploaded:0,total:0,skipped:true,reason:"missing_message"};

  // Deve valere SOLO per i flussi ordine provenienti da Gmail.
  if(!["gmail_order","gmail_lead_order"].includes(String(ctx.source||""))){
    return {uploaded:0,total:0,skipped:true,reason:"wrong_source"};
  }

  if(!dropboxIsConnected()){
    return {uploaded:0,total:0,skipped:true,reason:"dropbox_not_connected"};
  }

  let attachments=[];
  let messageFetchError=null;

  // Recupera SEMPRE la mail completa nel momento in cui l'ordine viene realmente creato.
  try{
    const freshMessage=await fetchGmailMessageById(ctx.messageId);
    if(Array.isArray(freshMessage?.attachments)){
      attachments=freshMessage.attachments;
    }
  }catch(err){
    messageFetchError=err;
    console.error("Recupero mail originale per allegati ordine",err);
  }

  // Fallback: usa i metadati che erano già presenti nella mail aperta.
  if(!attachments.length && Array.isArray(ctx.attachments)){
    attachments=ctx.attachments;
  }

  attachments=attachments
    .map(a=>({
      attachmentId:String(a?.attachmentId||a?.id||"").trim(),
      filename:String(a?.filename||"allegato").trim()||"allegato",
      mimeType:String(a?.mimeType||"application/octet-stream"),
      size:Number(a?.size)||0
    }))
    .filter(a=>a.attachmentId);

  if(!attachments.length){
    return {
      uploaded:0,
      total:0,
      skipped:true,
      reason:"no_attachments",
      messageFetchError:messageFetchError ? String(messageFetchError?.message||messageFetchError) : ""
    };
  }

  await jobDropboxEnsureStructure(order.id);
  const targetBase=`${jobDropboxBasePath(order)}/FILE RICEVUTI`;

  let uploaded=0;
  const errors=[];

  for(const a of attachments){
    try{
      const file=await fetchGmailAttachmentBlobByMeta(ctx.messageId,a);
      const safeName=String(file.filename||a.filename||"allegato")
        .replace(/[\/\\\u0000-\u001F]/g,"_")
        .trim() || "allegato";

      const finalName=jobDropboxFileName(order,safeName,ctx.descriptionHint||"");
      await uploadBlobToDropbox(`${targetBase}/${finalName}`,file.blob);
      uploaded++;
    }catch(err){
      console.error("Copia allegato Gmail -> Dropbox",a.filename,err);
      errors.push({
        filename:a.filename||"allegato",
        error:String(err?.message||err)
      });
    }
  }

  return {
    uploaded,
    total:attachments.length,
    errors,
    targetFolder:"FILE RICEVUTI"
  };
}

async function openGmailAttachment(index){

  try{

    else{

      link.href=url; link.target="_blank"; link.rel="noopener";
      document.body.appendChild(link); link.click(); link.remove();
    }

  }catch(err){
    console.error("Gmail attachment open error",err);
    if(previewWindow){ try{ previewWindow.close(); }catch(e){} }
    showToast(err?.message||"Errore durante l'apertura dell'allegato");

}

      method:"POST",
      headers:{

        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:"{}"
    });

    const raw = await response.text();
    let result = {};
    try{ result = JSON.parse(raw); }catch(e){ throw new Error(raw || `Errore HTTP ${response.status}`); }

    if(!response.ok){
      throw new Error(result?.error || result?.message || `Errore HTTP ${response.status}`);
