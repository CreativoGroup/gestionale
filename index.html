/* ============ INCASSI / REPORT PAGAMENTI ============ */
let incassiFilters = {metodo:"", categoria:"", mese: currentMonth(), view:"giorno"};
function isoWeekKey(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
  return `${d.getFullYear()}-W${String(weekNo).padStart(2,"0")}`;
}
function addDaysTo(dateStr,n){ const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function mondayOf(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay()||7;
  d.setDate(d.getDate()-day+1);
  return d.toISOString().slice(0,10);
}
const MESI_IT = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GIORNI_IT = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
function dayLabelIt(dateStr){ const d = new Date(dateStr+"T00:00:00"); return `${GIORNI_IT[d.getDay()]} ${fmtDate(dateStr)}`; }
function statsInRange(startDate, endDate){
  const incassi = state.payments.filter(p=>p.data>=startDate && p.data<=endDate).reduce((s,p)=>s+Number(p.importo),0);
  const entrate = (state.entrate||[]).filter(e=>e.data>=startDate && e.data<=endDate).reduce((s,e)=>s+Number(e.importo),0);
  const spese = state.expenses.filter(e=>e.data>=startDate && e.data<=endDate).reduce((s,e)=>s+Number(e.importo),0);
  return {incassi, entrate, spese, diff:incassi+entrate-spese};
}
function buildDailyRows(numDays){
  const rows = [];
  for(let i=0;i<numDays;i++){
    const d = addDays(-i);
    rows.push({key:d, start:d, end:d, label:dayLabelIt(d), ...statsInRange(d,d)});
  }
  return rows;
}
function buildWeeklyRows(numWeeks){
  const rows = []; const seen = new Set();
  let cursor = mondayOf(today());
  for(let i=0;i<numWeeks;i++){
    if(!seen.has(cursor)){
      seen.add(cursor);
      const end = addDaysTo(cursor,6);
      rows.push({key:cursor, start:cursor, end, label:`Settimana ${fmtDate(cursor)} → ${fmtDate(end)}`, ...statsInRange(cursor,end)});
    }
    cursor = addDaysTo(cursor,-7);
  }
  return rows;
}
function buildMonthlyRows(year){
  return MESI_IT.map((nome,idx)=>{
    const mm = String(idx+1).padStart(2,"0");
    const monthKey = `${year}-${mm}`;
    const ordersInMonth = state.orders.filter(o=>o.createdAt && o.createdAt.slice(0,7)===monthKey);
    const paymentsInMonth = state.payments.filter(p=>p.data && p.data.slice(0,7)===monthKey);
    const contanti = paymentsInMonth.filter(p=>p.metodo==="Contanti").reduce((s,p)=>s+Number(p.importo),0);
    const carta = paymentsInMonth.filter(p=>p.metodo==="Carta").reduce((s,p)=>s+Number(p.importo),0);
    const bonifico = paymentsInMonth.filter(p=>p.metodo==="Bonifico").reduce((s,p)=>s+Number(p.importo),0);
    const soldiIncassati = contanti+carta+bonifico;
    const entrate = (state.entrate||[]).filter(e=>e.data && e.data.slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.importo),0);
    const spese = state.expenses.filter(e=>e.data && e.data.slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.importo),0);
    const costiFissi = (state.fixedCosts||[]).filter(e=>e.data && e.data.slice(0,7)===monthKey).reduce((s,e)=>s+Number(e.importo),0);
    // "Totale Ordini" = valore lordo delle schede create nel mese, NON soldi incassati.
    const totaleOrdini = ordersInMonth.reduce((s,o)=>s+orderTotale(o),0);
    return {
      mese:nome, monthKey, nOrdini:ordersInMonth.length, totaleOrdini,
      nPagamenti:paymentsInMonth.length, contanti, carta, bonifico, soldiIncassati,
      entrate, spese, costiFissi,
      differenza:soldiIncassati+entrate-spese-costiFissi
    };
  });
}

function paymentCategorieLabel(p){ const o = findItem('orders', p.orderId); return o ? orderCategorieLabel(o) : "—"; }
function paymentMatchesCategoria(p, cat){ if(!cat) return true; const o = findItem('orders', p.orderId); return o ? orderCategorie(o).includes(cat) : false; }
function renderIncassi(){
  const f = incassiFilters;

function addPayment(){

/* ============ COSTI FISSI (SOLO AMMINISTRATORE) ============ */
function fixedCostsTotaleMese(month){
  return (state.fixedCosts||[]).filter(e=>e.data && e.data.slice(0,7)===month).reduce((s,e)=>s+Number(e.importo),0);
}
function safeStorageFileName(name){
  return String(name||"documento.pdf")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9._-]+/g,"-")
    .replace(/-+/g,"-");
}
async function fixedCostSignedUrl(path){
  if(!path) return null;
  const { data, error } = await sb.storage.from("fixed-costs").createSignedUrl(path, 120);
  if(error){ console.error(error); showToast("Impossibile aprire il documento"); return null; }
  return data?.signedUrl || null;
}
async function openFixedCostFile(id){
  const item = findItem('fixedCosts', id);
  if(!item || !item.filePath) return;
  const url = await fixedCostSignedUrl(item.filePath);
  if(url) window.open(url, "_blank", "noopener");
}

async function addFixedCost(){
  if(!currentUser || currentUser.role!=="admin"){ showToast("Operazione riservata all'amministratore"); return; }
  const descrizione = document.getElementById("fc-descrizione").value.trim();
  const importo = Number(document.getElementById("fc-importo").value)||0;
  const data = document.getElementById("fc-data").value || today();
  const metodo = document.getElementById("fc-metodo").value;
  const file = document.getElementById("fc-file").files[0] || null;
  if(!descrizione){ showToast("Inserisci una descrizione"); return; }
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }
  if(file && file.type!=="application/pdf" && !file.name.toLowerCase().endsWith(".pdf")){ showToast("Puoi caricare solo file PDF"); return; }

  const id = uid();
  const item = {id, descrizione, importo, metodo, data, filePath:"", fileName:""};
  const ok = await upsertOne('fixedCosts', item);
  if(!ok) return;

  if(file){
    const storagePath = `${currentUser.id}/${id}/${Date.now()}-${safeStorageFileName(file.name)}`;
    const { error:uploadError } = await sb.storage.from("fixed-costs").upload(storagePath, file, {contentType:"application/pdf", upsert:false});
    if(uploadError){
      console.error(uploadError);
      showToast(`Costo salvato, ma PDF non caricato: ${uploadError.message||"errore"}`);
    }else{
      item.filePath = storagePath;
      item.fileName = file.name;
      const okFile = await upsertOne('fixedCosts', item);
      if(!okFile) return;
    }
  }

  if(!state.fixedCosts.some(x=>x.id===id)) state.fixedCosts.push(item);
  toggleForm('fixedCostForm');
  renderCostiFissi();
  showToast("Costo fisso registrato");
}
async function deleteFixedCost(id){
  if(!currentUser || currentUser.role!=="admin") return;
  const item = findItem('fixedCosts', id);
  askConfirm("Eliminare questo costo fisso e l'eventuale documento allegato?", async ()=>{
    if(item?.filePath){
      const { error } = await sb.storage.from("fixed-costs").remove([item.filePath]);
      if(error) console.error("Errore eliminazione file", error);
    }

function escapeHtml(value){

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")

let pendingGmailOrderMessageId = null;

function readLocalMailActionFlags(messageId){
  try{
    const all=JSON.parse(localStorage.getItem("gmailActionFlags")||"{}");
    return all[messageId]||null;
  }catch(e){
    return null;
  }
}

function writeLocalMailActionFlags(messageId, flags){
  try{
    const all=JSON.parse(localStorage.getItem("gmailActionFlags")||"{}");
    all[messageId]={
      replied:!!flags.replied,
      leadGenerated:!!flags.leadGenerated,
      orderGenerated:!!flags.orderGenerated
    };
    localStorage.setItem("gmailActionFlags",JSON.stringify(all));
  }catch(e){
    console.warn("Salvataggio locale stato mail non disponibile",e);
  }
}

function getGmailActionFlags(messageId){
  const dbRow=(state.gmailActionStatus||[]).find(x=>x.gmailMessageId===messageId);
  const local=readLocalMailActionFlags(messageId);

  return {
    gmailMessageId:messageId,
    replied:!!(dbRow?.replied || local?.replied),
    leadGenerated:!!(dbRow?.leadGenerated || local?.leadGenerated),
    orderGenerated:!!(dbRow?.orderGenerated || local?.orderGenerated)
  };
}

function gmailActionStatusBadge(messageId){
  const flags=getGmailActionFlags(messageId);
  const badges=[];
  if(flags.replied) badges.push(`<span class="mail-action-status wait">IN ATTESA</span>`);
  if(flags.leadGenerated) badges.push(`<span class="mail-action-status lead">LEAD GENERATO</span>`);
  if(flags.orderGenerated) badges.push(`<span class="mail-action-status order">ORDINE EFFETTUATO</span>`);
  return badges.join("");
}

async function setGmailActionFlag(messageId, field){
  if(!messageId) return;

  // 1. Aggiorna SUBITO l'interfaccia, senza aspettare Supabase.
  const current=getGmailActionFlags(messageId);
  const updated={
    ...current,
    replied:!!current.replied,
    leadGenerated:!!current.leadGenerated,
    orderGenerated:!!current.orderGenerated
  };

  if(field==="replied") updated.replied=true;
  if(field==="leadGenerated") updated.leadGenerated=true;
  if(field==="orderGenerated") updated.orderGenerated=true;

  let i=(state.gmailActionStatus||[]).findIndex(x=>x.gmailMessageId===messageId);
  const immediateRow={
    id:i>=0 ? state.gmailActionStatus[i].id : null,
    gmailMessageId:messageId,
    replied:updated.replied,
    leadGenerated:updated.leadGenerated,
    orderGenerated:updated.orderGenerated,
    updatedAt:new Date().toISOString()
  };

  if(i>=0) state.gmailActionStatus[i]=immediateRow;
  else{
    state.gmailActionStatus=state.gmailActionStatus||[];
    state.gmailActionStatus.push(immediateRow);
  }

  writeLocalMailActionFlags(messageId,updated);

  if(currentView==="posta") renderPosta();

  // 2. Poi prova a renderlo persistente su Supabase.
  const payload={
    gmail_message_id:messageId,
    replied:updated.replied,
    lead_generated:updated.leadGenerated,
    order_generated:updated.orderGenerated,
    updated_at:new Date().toISOString()
  };

  try{
    const {data,error}=await sb.from("gmail_action_status")
      .upsert(payload,{onConflict:"gmail_message_id"})
      .select("*")
      .single();

    if(error){
      console.error("Errore persistenza stato mail",error);
      return;
    }

    const mapped=fromDbRow("gmailActionStatus",data);
    i=(state.gmailActionStatus||[]).findIndex(x=>x.gmailMessageId===messageId);
    if(i>=0) state.gmailActionStatus[i]=mapped;
    else state.gmailActionStatus.push(mapped);

  }catch(error){
    console.error("Errore persistenza stato mail",error);
  }
}

function mailHasLabel(message, label){
  return Array.isArray(message?.labels) && message.labels.includes(label);
}

function mailDisplayName(raw){
  const value = String(raw||"").trim();
  if(!value) return "Mittente sconosciuto";
  const match = value.match(/^"?([^"<]+)"?\s*<[^>]+>$/);
  return (match ? match[1] : value).trim();
}

function formatMailDate(raw){
  const d = new Date(raw);
  if(Number.isNaN(d.getTime())) return raw || "";
  const now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

function visibleGmailMessages(){
  let list = [...gmailMessages].sort((a,b)=>{
    const da = new Date(a.date||0).getTime()||0;
    const db = new Date(b.date||0).getTime()||0;
    return db-da;
  });

  if(gmailFilter==="sent") list = list.filter(m=>mailHasLabel(m,"SENT"));
  else if(gmailFilter==="unread") list = list.filter(m=>mailHasLabel(m,"UNREAD") && !isGmailLocallyRead(m.id) && mailHasLabel(m,"INBOX"));
  else if(gmailFilter!=="all") list = list.filter(m=>mailHasLabel(m,"INBOX"));

  const q=String(gmailSearch||"").trim().toLowerCase();
  if(q){
    list = list.filter(m=>[m.from,m.to,m.subject,m.snippet,m.date].join(" ").toLowerCase().includes(q));
  }
  return list;
}

function mailFileSize(bytes){
  const n=Number(bytes)||0;
  if(!n) return "";
  if(n<1024) return `${n} B`;
  if(n<1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/(1024*1024)).toFixed(1)} MB`;
}
function sanitizeEmailHtml(raw){
  return String(raw||"")
    .replace(/<script[\s\S]*?<\/script>/gi,"")
    .replace(/\son\w+\s*=\s*(".*?"|'.*?'|[^\s>]+)/gi,"")
    .replace(/javascript:/gi,"");
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const result=String(reader.result||"");
      const base64=result.includes(",") ? result.split(",").pop() : result;
      resolve(base64||"");
    };
    reader.onerror=()=>reject(reader.error||new Error("Errore lettura file"));
    reader.readAsDataURL(file);
  });
}

async function handleGmailReplyFiles(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length) return;

  if(gmailReplyAttachments.length + files.length > 10){
    showToast("Puoi allegare al massimo 10 file");
    const input=document.getElementById("gmail-reply-file-input");
    if(input) input.value="";
    return;
  }

  try{
    for(const file of files){
      const dataBase64=await fileToBase64(file);
      gmailReplyAttachments.push({
        filename:file.name,
        mimeType:file.type||"application/octet-stream",
        size:file.size||0,
        dataBase64
      });
    }
    renderPosta();
  }catch(err){
    console.error("Allegato Gmail error",err);
    showToast("Errore durante la lettura di un allegato");
  }
}

function removeGmailReplyAttachment(index){

async function sendGmailReply(){
  if(gmailReplySending) return;
  const m=gmailSelectedMessage;
  if(!m?.id){
    showToast("Mail originale non disponibile");
    return;
  }

  const bodyText=String(gmailReplyText||"").trim();
  if(!bodyText){
    showToast("Scrivi il testo della risposta");
    return;
  }

  gmailReplySending=true;
  gmailReplyStatus="Invio in corso…";
  renderPosta();

  try{
    const {data:sessionData}=await sb.auth.getSession();
    const session=sessionData?.session;
    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");

    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${session.access_token}`,
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messageId:m.id,
        bodyText,
        cc:String(gmailReplyCc||"").trim(),
        bcc:String(gmailReplyBcc||"").trim(),
        subject:String(gmailReplySubject||normalizeReplySubjectClient(m.subject||"")).trim(),
        attachments:gmailReplyAttachments
      })
    });

    const raw=await response.text();
    let result={};
    try{ result=JSON.parse(raw); }
    catch(e){ throw new Error(raw||`Errore HTTP ${response.status}`); }

    if(!response.ok){
      throw new Error(result?.error||result?.message||`Errore HTTP ${response.status}`);
    }

    gmailReplyStatus="✓ Risposta inviata correttamente";
    showToast("Email inviata");

    gmailReplyText="";
    gmailReplyCc="";
    gmailReplyBcc="";
    gmailReplySubject="";
    gmailReplyOptionsOpen=false;
    gmailReplyAttachments=[];

    setTimeout(async ()=>{
      gmailReplyOpen=false;
      gmailReplyStatus="";
      await loadGmailMessages(true);
    },1200);

  }catch(err){
    console.error("Gmail send error",err);
    gmailReplyStatus=`Errore: ${err?.message||"invio non riuscito"}`;
  }finally{
    gmailReplySending=false;
    renderPosta();
  }
}


function gmailExtractAddress(value){
  const raw=String(value||"").trim();
  const m=raw.match(/<([^>]+)>/);
  if(m) return m[1].trim().toLowerCase();
  const simple=raw.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  return simple ? simple[0].toLowerCase() : "";
}

function gmailExtractName(value){
  const raw=String(value||"").trim();
  let name=raw.replace(/<[^>]+>/g,"").replace(/^["']|["']$/g,"").trim();
  if(!name){
    const email=gmailExtractAddress(raw);
    name=email ? email.split("@")[0].replace(/[._-]+/g," ") : "";
  }
  return name;
}

function gmailExtractPhone(text){
  const raw=String(text||"").replace(/\s+/g," ");
  const matches=raw.match(/(?:\+39[\s.-]?)?(?:\(?0\d{1,4}\)?[\s.-]?)?\d(?:[\s.-]?\d){7,10}/g)||[];
  for(const item of matches){
    const digits=item.replace(/\D/g,"");
    if(digits.length>=9 && digits.length<=13) return item.trim();
  }
  return "";
}

function gmailLeadRequestText(m){
  const text=String(m?.bodyText||"").trim();

}

async function saveLeadFromGmail(){
  const m=gmailSelectedMessage;
  if(!m) return;

  const btn=document.getElementById("lead-save-btn");
  if(btn){ btn.disabled=true; btn.textContent="Salvataggio…"; }

  const payload={
    nome:String(document.getElementById("lead-nome")?.value||"").trim()||null,
    azienda:String(document.getElementById("lead-azienda")?.value||"").trim()||null,
    email:String(document.getElementById("lead-email")?.value||"").trim().toLowerCase(),
    telefono:String(document.getElementById("lead-telefono")?.value||"").trim()||null,
    oggetto_richiesta:String(document.getElementById("lead-oggetto")?.value||"").trim()||null,
    richiesta:String(document.getElementById("lead-richiesta")?.value||"").trim()||null,
    stato:String(document.getElementById("lead-stato")?.value||"Nuovo"),
    fonte:"gmail",
    gmail_message_id:m.id||gmailSelectedId||null,
    gmail_thread_id:m.threadId||null,
    aggiornato_il:new Date().toISOString()
  };

  if(!payload.email){
    showToast("Inserisci l'email del Lead");
    if(btn){ btn.disabled=false; btn.textContent="Salva Lead"; }
    return;
  }

  try{
    const existingClient=findClientByEmail(payload.email);
    if(existingClient){
      const proceed=confirm(`Questa email appartiene già al cliente "${clientDisplayName(existingClient)}". Vuoi creare comunque un Lead duplicato?`);
      if(!proceed){
        if(btn){ btn.disabled=false; btn.textContent="Salva Lead"; }
        return;
      }
    }

    const {data,error}=await sb.from("leads").insert(payload).select("*").single();
    if(error){
      if(String(error.code||"")==="23505"){
        throw new Error("Questa mail è già stata trasformata in Lead.");
      }
      throw error;
    }

    if(data){
      state.leads = state.leads || [];
      state.leads.unshift(fromDbRow("leads",data));
    }
    closeLeadModal();
    showToast("Lead creato correttamente");
    if(currentView==="dashboard") renderDashboard();
  }catch(err){
    console.error("Creazione Lead error",err);
    showToast(err?.message||"Errore durante la creazione del Lead");
    if(btn){ btn.disabled=false; btn.textContent="Salva Lead"; }
  }
}

function gmailBase64UrlToBlob(base64url, mimeType){
  const base64=String(base64url||"").replace(/-/g,"+").replace(/_/g,"/");
  const padded=base64 + "=".repeat((4-(base64.length%4))%4);
  const binary=atob(padded);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mimeType||"application/octet-stream"});
}

async function fetchGmailAttachmentBlob(index){
  const m=gmailSelectedMessage;
  const attachments=Array.isArray(m?.attachments)?m.attachments:[];
  const a=attachments[index];
  if(!m?.id || !a) throw new Error("Allegato non disponibile");
  const attachmentId=String(a.attachmentId||a.id||"").trim();
  if(!attachmentId) throw new Error("Identificativo allegato mancante");

  const {data:sessionData}=await sb.auth.getSession();
  const session=sessionData?.session;
  if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");

  const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-attachment`,{
    method:"POST",
    headers:{
      "Authorization":`Bearer ${session.access_token}`,
      "apikey":SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      messageId:m.id,
      attachmentId,
      filename:a.filename||"allegato",
      mimeType:a.mimeType||"application/octet-stream"
    })
  });
  const raw=await response.text();
  let result={};
  try{ result=JSON.parse(raw); }
  catch(e){ throw new Error(raw||`Errore HTTP ${response.status}`); }
  if(!response.ok) throw new Error(result?.error||result?.message||`Errore HTTP ${response.status}`);
  if(!result?.data) throw new Error("Contenuto allegato mancante");
  return {
    blob:gmailBase64UrlToBlob(result.data,result.mimeType||a.mimeType),
    filename:result.filename||a.filename||"allegato"
  };
}

async function openGmailAttachment(index){
  const previewWindow=window.open("","_blank");
  if(previewWindow){
    try{ previewWindow.document.write('<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apertura allegato…</title><body style="font-family:system-ui;padding:28px">Apertura allegato…</body>'); }catch(e){}
  }
  try{
    const file=await fetchGmailAttachmentBlob(index);
    const url=URL.createObjectURL(file.blob);
    if(previewWindow) previewWindow.location.href=url;
    else{
      const link=document.createElement("a");
      link.href=url; link.target="_blank"; link.rel="noopener";
      document.body.appendChild(link); link.click(); link.remove();
    }
    setTimeout(()=>URL.revokeObjectURL(url),5*60*1000);
  }catch(err){
    console.error("Gmail attachment open error",err);
    if(previewWindow){ try{ previewWindow.close(); }catch(e){} }
    showToast(err?.message||"Errore durante l'apertura dell'allegato");
  }
}

async function downloadGmailAttachment(index){
  try{
    const file=await fetchGmailAttachmentBlob(index);
    const url=URL.createObjectURL(file.blob);
    const link=document.createElement("a");
    link.href=url;
    link.download=file.filename||"allegato";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60*1000);
  }catch(err){
    console.error("Gmail attachment download error",err);
    showToast(err?.message||"Errore durante il download dell'allegato");
  }
}
