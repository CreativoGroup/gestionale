async function completedSheetLoadDropboxFiles(orderId){
  const o=findItem("orders",orderId);
  const container=document.getElementById("completedSheetDropboxFiles");
  const status=document.getElementById("completedSheetDropboxStatus");
  if(!o || !container) return;

  if(!dropboxIsConnected()){
    if(status){
      status.className="completed-sheet-db-status error";
      status.textContent="Dropbox non collegato";
    }
    container.innerHTML=`<div class="completed-sheet-db-loading">Collega Dropbox dalla sezione Dropbox del gestionale.</div>`;
    return;
  }

  try{
    if(!jobDropboxUsesChronologicalArchive(o)){
      if(status){
        status.className="completed-sheet-db-status";
        status.textContent="Archivio storico";
      }
      container.innerHTML=`<div class="completed-sheet-db-loading">Ordine precedente al 01/10/2026: nessuna nuova cartella viene creata automaticamente. I file storici restano nel vecchio archivio Dropbox.</div>`;
      return;
    }

    // Per i nuovi ordini crea solo la struttura cronologica concordata.
    await jobDropboxEnsureStructure(orderId);

    const base=jobDropboxBasePath(o);
    const groups=[];

    for(const folder of JOB_DROPBOX_SUBFOLDERS){
      try{
        const data=await dropboxApi("files/list_folder",{
          path:`${base}/${folder}`,
          recursive:false,
          include_deleted:false
        });
        const files=(data.entries||[])
          .filter(x=>x[".tag"]==="file")
          .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"it"));
        groups.push({folder,files});
      }catch(err){
        console.error("Dropbox scheda laterale folder",folder,err);
        groups.push({folder,files:[]});
      }
    }

    if(status){
      status.className="completed-sheet-db-status ok";
      status.textContent="Dropbox collegato";
    }

    const total=groups.reduce((sum,g)=>sum+g.files.length,0);
    if(!total){
      container.innerHTML=`
        <div class="completed-sheet-db-loading">
          Nessun file ancora presente per questa lavorazione.<br>
          Puoi caricarli dalla scheda ordine completa.
        </div>`;
      return;
    }

    container.innerHTML=groups.map(group=>`
      <div class="completed-sheet-db-group">
        <div class="completed-sheet-db-group-title">
          <span>📁 ${escapeHtml(group.folder)}</span>
          <span class="completed-sheet-db-count">${group.files.length}</span>
        </div>
        ${group.files.length ? group.files.map(file=>{
          const path=file.path_lower||file.path_display||"";
          const fileRef=file.id||path;
          const encodedPath=encodeURIComponent(fileRef);
          const encodedName=encodeURIComponent(file.name||"file");
          return `
            <div class="completed-sheet-db-file">
              <div style="min-width:0;">
                <div class="completed-sheet-db-file-name">📄 ${escapeHtml(file.name||"")}</div>
                <div class="completed-sheet-db-file-meta">
                  ${dropboxFormatBytes(file.size)}
                  ${file.client_modified?` · ${new Date(file.client_modified).toLocaleString("it-IT")}`:""}
                </div>
              </div>
              <div class="completed-sheet-db-actions">
                <button class="btn btn-outline btn-sm" type="button"
                  onclick="completedSheetPreviewDropboxFile('${encodedPath}','${encodedName}')">Visualizza</button>
                <button class="btn btn-outline btn-sm" type="button"
                  onclick="jobDropboxDownloadEncoded('${encodedPath}','${encodedName}')">Scarica</button>
              </div>
            </div>`;
        }).join("") : `<div class="completed-sheet-db-empty">Nessun file.</div>`}
      </div>
    `).join("");
  }catch(err){
    console.error("Caricamento Dropbox scheda laterale",err);
    if(status){
      status.className="completed-sheet-db-status error";
      status.textContent="Errore Dropbox";
    }
    container.innerHTML=`<div class="completed-sheet-db-loading" style="color:var(--danger);">Impossibile caricare i file Dropbox.</div>`;
  }
}

let currentDropboxPreviewUrl=null;

function dropboxPreviewExtension(name){
  const clean=String(name||"").toLowerCase().split("?")[0].split("#")[0];
  const i=clean.lastIndexOf(".");
  return i>=0 ? clean.slice(i+1) : "";
}

function dropboxPreviewKind(name,mimeType){
  const ext=dropboxPreviewExtension(name);
  const mime=String(mimeType||"").toLowerCase();
  if(mime.startsWith("image/") || ["jpg","jpeg","png","gif","webp","bmp","svg"].includes(ext)) return "image";
  if(mime==="application/pdf" || ext==="pdf") return "pdf";
  if(mime.startsWith("text/") || ["txt","csv","json","xml","md","log","html","css","js"].includes(ext)) return "text";
  if(["ai","eps","doc","docm","docx","odp","odt","pps","ppsm","ppsx","ppt","pptm","pptx","rtf"].includes(ext)) return "dropbox-pdf-preview";
  return "unsupported";
}

function closeDropboxPreview(){
  const backdrop=document.getElementById("dropboxPreviewBackdrop");
  if(backdrop) backdrop.classList.remove("open");
  const body=document.getElementById("dropboxPreviewBody");
  if(body) body.innerHTML=`<div class="dropbox-preview-unsupported">Caricamento anteprima…</div>`;
  if(currentDropboxPreviewUrl){
    URL.revokeObjectURL(currentDropboxPreviewUrl);
    currentDropboxPreviewUrl=null;
  }
}

async function completedSheetPreviewDropboxFile(pathEncoded,nameEncoded){
  const path=decodeURIComponent(pathEncoded);
  const name=decodeURIComponent(nameEncoded);
  const token=dropboxToken();
  if(!token){ showToast("Dropbox non collegato"); return; }

  const backdrop=document.getElementById("dropboxPreviewBackdrop");
  const body=document.getElementById("dropboxPreviewBody");
  const title=document.getElementById("dropboxPreviewTitle");
  const sub=document.getElementById("dropboxPreviewSub");
  const downloadBtn=document.getElementById("dropboxPreviewDownloadBtn");
  if(!backdrop || !body) return;

  if(currentDropboxPreviewUrl){
    URL.revokeObjectURL(currentDropboxPreviewUrl);
    currentDropboxPreviewUrl=null;
  }

  if(title) title.textContent=name||"Anteprima file";
  if(sub) sub.textContent="Dropbox · Anteprima nel gestionale";
  body.innerHTML=`<div class="dropbox-preview-unsupported">Caricamento anteprima…</div>`;
  backdrop.classList.add("open");

  if(downloadBtn) downloadBtn.onclick=()=>dropboxDownloadFile(path,name);

  try{
    const initialKind=dropboxPreviewKind(name,"");
    let blob;
    let kind=initialKind;

    // AI/EPS e diversi formati Office possono essere trasformati da Dropbox in PDF
    // per l'anteprima, mentre il pulsante Scarica continua a scaricare l'originale.
    if(initialKind==="dropbox-pdf-preview"){
      blob=await dropboxFetchContent(path,"files/get_preview");
      kind="pdf";
    }else{
      blob=await dropboxFetchContent(path,"files/download");
      kind=dropboxPreviewKind(name,blob.type);
    }

    if(kind==="text"){
      const txt=await blob.text();
      body.innerHTML="";
      const pre=document.createElement("pre");
      pre.className="dropbox-preview-text";
      pre.textContent=txt;
      body.appendChild(pre);
      return;
    }

    currentDropboxPreviewUrl=URL.createObjectURL(blob);

    if(kind==="image"){
      body.innerHTML="";
      const img=document.createElement("img");
      img.className="dropbox-preview-image";
      img.alt=name||"Anteprima";
      img.onload=()=>{ if(sub) sub.textContent="Dropbox · Anteprima pronta"; };
      img.onerror=()=>{ body.innerHTML=`<div class="dropbox-preview-unsupported"><strong>Impossibile visualizzare l'immagine</strong>Il file è stato letto da Dropbox ma Safari non riesce a mostrarlo.<br>Puoi comunque scaricarlo.</div>`; };
      img.src=currentDropboxPreviewUrl;
      body.appendChild(img);
      return;
    }

    if(kind==="pdf"){
      body.innerHTML="";
      const frame=document.createElement("iframe");
      frame.className="dropbox-preview-frame";
      frame.title=name||"Anteprima PDF";
      frame.src=currentDropboxPreviewUrl;
      body.appendChild(frame);
      if(sub) sub.textContent="Dropbox · Anteprima PDF";
      return;
    }

    body.innerHTML=`<div class="dropbox-preview-unsupported"><strong>Anteprima non disponibile</strong>Questo formato non può essere visualizzato direttamente nel browser.<br>Il pulsante <b>Scarica</b> scarica comunque il file originale.</div>`;
  }catch(err){
    console.error("Anteprima Dropbox",err);
    const detail=escapeHtml(err?.message||"Errore Dropbox");
    body.innerHTML=`<div class="dropbox-preview-unsupported"><strong>Impossibile aprire l'anteprima</strong>${detail}<br><br>Prova il pulsante <b>Scarica</b>. Se Dropbox chiede di essere ricollegato, fallo una sola volta dalla sezione Dropbox.</div>`;
  }
}

async function saveCompletedOrderNotes(orderId,manual=false){
  const o=findItem("orders",orderId);
  const notesEl=document.getElementById("completedSheetNotes");
  const saveBtn=document.getElementById("completedSheetSaveBtn");
  if(!o || !notesEl) return false;

  if(completedNoteAutosaveTimer){
    clearTimeout(completedNoteAutosaveTimer);
    completedNoteAutosaveTimer=null;
  }

  const newValue=notesEl.value;
  const lastSaved=notesEl.dataset.lastSavedValue ?? o.descrizione ?? "";

  if(newValue===lastSaved && !manual){
    setCompletedNoteStatus("saved","Tutto salvato");
    return true;
  }

  if(completedNoteSaveInFlight){
    completedNoteSaveQueued=true;
    return false;
  }

  completedNoteSaveInFlight=true;
  if(saveBtn){
    saveBtn.disabled=true;
    saveBtn.textContent="Salvo…";
  }
  setCompletedNoteStatus("saving","Salvataggio…");

  const previousValue=o.descrizione||"";
  const candidate={...o,descrizione:newValue};

  try{
    const saved=await upsertOneReturning("orders",candidate);
    if(!saved) throw new Error("Salvataggio non riuscito");

    const i=state.orders.findIndex(x=>x.id===orderId);
    if(i>=0) state.orders[i]=saved;

    // Mantiene coerente anche la scheda completa se era stata aperta prima.
    if(jobCardEditSnapshot && jobCardEditSnapshot.orderId===orderId){
      jobCardEditSnapshot.order=JSON.parse(JSON.stringify(saved));
    }

    notesEl.dataset.lastSavedValue=newValue;
    const ora=new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    setCompletedNoteStatus("saved",`Salvato alle ${ora}`);

    if(manual){
      notesEl.readOnly=true;
      const editBtn=document.getElementById("completedSheetEditBtn");
      const saveBtn2=document.getElementById("completedSheetSaveBtn");
      const cancelBtn=document.getElementById("completedSheetCancelEditBtn");
      if(editBtn) editBtn.style.display="";
      if(saveBtn2) saveBtn2.style.display="none";
      if(cancelBtn) cancelBtn.style.display="none";
      showToast("Note salvate");
    }
    return true;
  }catch(err){
    console.error("Salvataggio note lavorazione",err);
    // Non cancelliamo ciò che l'utente ha scritto: resta nell'editor per un nuovo tentativo.
    o.descrizione=previousValue;
    setCompletedNoteStatus("error","Non salvato · riprova");
    if(manual) showToast("Errore: note non salvate");
    return false;
  }finally{
    completedNoteSaveInFlight=false;
    if(saveBtn){
      saveBtn.disabled=false;
      saveBtn.textContent="Salva modifiche";
    }

    if(completedNoteSaveQueued){
      completedNoteSaveQueued=false;
      const current=document.getElementById("completedSheetNotes");
      if(current && current.value!==(current.dataset.lastSavedValue||"")){
        scheduleCompletedNoteAutosave(orderId);
      }
    }
  }
}

document.addEventListener("keydown",(event)=>{
  if(event.key==="Escape" && document.getElementById("dropboxPreviewBackdrop")?.classList.contains("open")){
    closeDropboxPreview();
    return;
  }
  if(event.key==="Escape" && document.getElementById("completedSheetDrawer")?.classList.contains("open")){
    closeCompletedOrderSheet();
  }
});

</script>

        <div id="dropboxPreviewSub" class="dropbox-preview-sub"></div>
      </div>
      <div class="dropbox-preview-actions">
        <button id="dropboxPreviewDownloadBtn" class="btn btn-outline btn-sm" type="button">Scarica</button>
        <button class="dropbox-preview-close" type="button" aria-label="Chiudi" onclick="closeDropboxPreview()">×</button>
      </div>
    </div>
    <div id="dropboxPreviewBody" class="dropbox-preview-body">
      <div class="dropbox-preview-unsupported">Caricamento anteprima…</div>
    </div>
  </div>
</div>
