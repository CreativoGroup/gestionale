async function maybeCompleteWhatsappMetaSignup(){
  if(whatsappMetaSignupState.completed || whatsappMetaSignupState.completing) return;

  // Per Embedded Signup / Coexistence servono DUE informazioni distinte:
  // 1) il code OAuth restituito dal callback FB.login;
  // 2) il WABA ID restituito dal messaggio WA_EMBEDDED_SIGNUP.
  // Non chiamiamo Supabase finché non sono arrivati entrambi, altrimenti il
  // backend riceve wabaId:null e non può completare il collegamento.
  if(!whatsappMetaSignupState.code && !whatsappMetaSignupState.accessToken){
    waMetaDebug("ATTESA", "Attendo il codice OAuth Meta...");
    return;
  }

  if(!whatsappMetaSignupState.wabaId){
    waMetaDebug("WABA", "WABA ID non ricevuto dal browser. Procedo con il recupero server-side tramite Meta Graph API...");
  }

  await completeWhatsappMetaSignup();
}

async function completeWhatsappMetaSignup(){
  if(whatsappMetaSignupState.completed || whatsappMetaSignupState.completing) return;

  whatsappMetaSignupState.completing=true;

  try{
    showToast("WhatsApp autorizzato. Completo il collegamento...");

    console.log("whatsapp complete state",{
      hasCode:!!whatsappMetaSignupState.code,
      hasAccessToken:!!whatsappMetaSignupState.accessToken,
      wabaId:whatsappMetaSignupState.wabaId||null,
      phoneNumberId:whatsappMetaSignupState.phoneNumberId||null,
      event:whatsappMetaSignupState.event||null,
      redirectUri:whatsappMetaExactRedirectUri || null
    });

    if(!whatsappMetaExactRedirectUri){
      throw new Error("Non sono riuscito a catturare il redirect_uri reale usato da Meta. Riprova il collegamento.");
    }

    waMetaDebug("Invio a Supabase",{
      code:whatsappMetaSignupState.code ? "[presente]" : null,
      accessToken:whatsappMetaSignupState.accessToken ? "[presente]" : null,
      wabaId:whatsappMetaSignupState.wabaId||null,
      phoneNumberId:whatsappMetaSignupState.phoneNumberId||null,
      event:whatsappMetaSignupState.event||null,
      redirectUri:window.location.origin + window.location.pathname
    });

    const { data: result, error } = await sb.functions.invoke(
      "whatsapp-coexistence-complete",
      {
        body: {
          code: whatsappMetaSignupState.code || null,
          accessToken: whatsappMetaSignupState.accessToken || null,
          wabaId: whatsappMetaSignupState.wabaId || null,
          phoneNumberId: whatsappMetaSignupState.phoneNumberId || null,
          event: whatsappMetaSignupState.event || null,
          redirectUri: whatsappMetaExactRedirectUri || null
        }
      }
    );

    console.log("whatsapp-coexistence-complete result",{
      error,
      result
    });
    waMetaDebug("Risposta Supabase",{
      error:error ? {
        message:error?.message||String(error),
        name:error?.name||null
      } : null,
      result:safeMetaObject(result)
    });

    if(error){
      let message=error?.message||"Errore chiamata Supabase";
      try{
        const ctx=error?.context;
        if(ctx && typeof ctx.json==="function"){
          const parsed=await ctx.json();
          message=parsed?.error||parsed?.message||message;
        }
      }catch(e){}
      throw new Error(message);
    }

    if(!result?.ok){
      throw new Error(
        result?.error ||
        result?.message ||
        "Collegamento WhatsApp non completato"
      );
    }

    whatsappMetaSignupState.completed=true;

    showToast(
      result?.displayPhoneNumber
        ? `WhatsApp collegato: ${result.displayPhoneNumber}`
        : "WhatsApp collegato correttamente"
    );

    try{
      await loadWhatsappInbox();
    }catch(e){
      console.warn("Aggiornamento inbox WhatsApp dopo collegamento",e);
    }

  }catch(err){
    console.error("completeWhatsappMetaSignup",err);
    waMetaDebug("ERRORE",{
      message:err instanceof Error ? err.message : String(err),
      stack:err instanceof Error ? err.stack : null
    });
    showToast(
      err instanceof Error
        ? err.message
        : "Errore collegamento WhatsApp"
    );
  }finally{
    whatsappMetaSignupState.completing=false;
  }
}

window.addEventListener("message",(event)=>{
  if(
    event.origin!=="https://www.facebook.com" &&
    event.origin!=="https://web.facebook.com"
  ){
    return;
  }

  let payload=event.data;

  if(typeof payload==="string"){
    try{
      payload=JSON.parse(payload);
    }catch(e){
      return;
    }
  }

  if(!payload || payload.type!=="WA_EMBEDDED_SIGNUP") return;

  console.log("WA Embedded Signup:",payload);
  waMetaDebug("WA_EMBEDDED_SIGNUP",safeMetaObject(payload));

  whatsappMetaSignupState.event=String(payload.event||"");

  if(payload?.data?.waba_id){
    whatsappMetaSignupState.wabaId=String(payload.data.waba_id);
  }

  if(payload?.data?.phone_number_id){
    whatsappMetaSignupState.phoneNumberId=String(payload.data.phone_number_id);
  }

  if(
    payload.event==="FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING" ||
    payload.event==="FINISH"
  ){
    whatsappMetaSignupState.finished = true;
    showToast("Onboarding WhatsApp completato su Meta");
    maybeCompleteWhatsappMetaSignup();
  }else if(payload.event==="CANCEL"){
    showToast("Collegamento WhatsApp annullato");
  }else if(payload.event==="ERROR"){
    const msg=payload?.data?.error_message || "Meta ha segnalato un errore nel collegamento";
    showToast(msg);
  }
});

window.addEventListener("message",(event)=>{
  const origin=String(event.origin||"");
  if(!origin.includes("facebook.com") && !origin.includes("meta.com")) return;
  waMetaDebug("window.message",{origin,data:safeMetaObject(event.data)});
});

function openWhatsappCoexistence(){
  toggleWaMetaDebug(true);
  clearWaMetaDebug();
  whatsappMetaExactRedirectUri="";
  waMetaDebug("START",{
    href:window.location.href,
    origin:window.location.origin,
    pathname:window.location.pathname,
    configId:META_WHATSAPP_CONFIG_ID,
    appId:META_APP_ID
  });

  if(!metaFacebookSdkReady || typeof FB==="undefined"){
    showToast("Meta sta caricando. Riprova tra qualche secondo.");
    return;
  }

  resetWhatsappMetaSignupState();

  try{
    const originalWindowOpen=window.open;
    window.open=function(url,...args){
      captureMetaRedirectFromPopupUrl(url);
      return originalWindowOpen.call(window,url,...args);
    };

    FB.login(function(response){
      window.open=originalWindowOpen;
      waMetaDebug("FB.login callback",safeMetaObject(response));
      console.log("Risposta Meta Coexistence:",response);

      if(response?.authResponse?.code){
        whatsappMetaSignupState.code=String(response.authResponse.code);
        console.log("Meta authorization code ricevuto");
        showToast("Autorizzazione Meta ricevuta. Verifico il numero WhatsApp...");
        maybeCompleteWhatsappMetaSignup();
        return;
      }

      if(response?.authResponse?.accessToken){
        whatsappMetaSignupState.accessToken=String(response.authResponse.accessToken);
        console.log("Meta access token ricevuto");
        showToast("Autorizzazione Meta ricevuta. Verifico il numero WhatsApp...");
        maybeCompleteWhatsappMetaSignup();
        return;
      }

      if(response?.status==="unknown"){
        showToast("Collegamento Meta non completato");
      }
    },{
      config_id: META_WHATSAPP_CONFIG_ID,
      auth_type: "rerequest",
      response_type: "code",
      override_default_response_type: true,

      extras: {
        setup: {},
        featureType: "whatsapp_business_app_onboarding",
        sessionInfoVersion: "3"
      }
    });
  }catch(error){
    console.error("Errore apertura Meta Coexistence:",error);
    showToast("Impossibile aprire il collegamento Meta");
  }
}

function whatsappConversationGroups(){
  const map=new Map();
  [...(state.whatsappMessages||[])]
    .sort((a,b)=>String(a.messageTimestamp||a.createdAt||"").localeCompare(String(b.messageTimestamp||b.createdAt||"")))
    .forEach(m=>{
      const key=String(m.waId||m.fromNumber||"").trim();
      if(!key) return;
      if(!map.has(key)) map.set(key,{waId:key,name:m.contactName||key,phone:m.fromNumber||key,messages:[]});
      const g=map.get(key);
      if(m.contactName) g.name=m.contactName;
      if(m.fromNumber) g.phone=m.fromNumber;
      g.messages.push(m);
    });
  return [...map.values()].sort((a,b)=>{
    const ad=a.messages[a.messages.length-1]?.messageTimestamp||a.messages[a.messages.length-1]?.createdAt||"";
    const bd=b.messages[b.messages.length-1]?.messageTimestamp||b.messages[b.messages.length-1]?.createdAt||"";
    return String(bd).localeCompare(String(ad));
  });
}

async function refreshWhatsappInbox(silent=false){
  const {data,error}=await sb.from("whatsapp_messages").select("*").order("message_timestamp",{ascending:true});
  if(error){
    console.error(error);
    if(!silent) showToast("Errore aggiornamento WhatsApp");
    return;
  }
  state.whatsappMessages=(data||[]).map(r=>fromDbRow("whatsappMessages",r));
  snapshotCollection("whatsappMessages");
  if(currentView==="whatsapp") renderWhatsapp();
  if(!silent) showToast("WhatsApp aggiornato");
}

function createLeadFromWhatsapp(waId, leadOrder=false){
  const conv=whatsappConversationGroups().find(x=>x.waId===waId);
  if(!conv) return;
  const body=conv.messages.map(m=>`${m.direction==="outbound"?"Creativò":"Cliente"}: ${m.body||""}`).join("\n");
  openManualLeadForm({
    nome:conv.name||"",
    telefono:"+"+normalizeWaPhone(conv.phone||conv.waId),
    oggettoRichiesta:"Richiesta WhatsApp",
    richiesta:body,
    stato:leadOrder?"Accettato":"Nuovo",
    fonte:leadOrder?"whatsapp_ordine":"whatsapp"
  });
}
function createOrderFromWhatsapp(waId){
  const conv=whatsappConversationGroups().find(x=>x.waId===waId);
  if(!conv) return;
  const client=findClientByWhatsappPhone(conv.phone||conv.waId);
  if(!client){
    showToast("Cliente non trovato: usa NUOVO CLIENTE + ORDINE");
    return;
  }
  newOrderForClient(client.id);
}


async function sendWhatsappRequest({to,message,contactName,file}){
  const {data:sessionData}=await sb.auth.getSession();
  const session=sessionData?.session;

  if(!session){
    throw new Error("Sessione scaduta: accedi di nuovo");
  }

  const headers={
    "Authorization":`Bearer ${session.access_token}`,
    "apikey":SUPABASE_KEY
  };

  let body;

  if(file){
    const form=new FormData();
    form.append("to",normalizeWaPhone(to));
    form.append("message",String(message||""));
    form.append("contactName",String(contactName||""));
    form.append("file",file,file.name);
    body=form;
  }else{
    headers["Content-Type"]="application/json";
    body=JSON.stringify({
      to:normalizeWaPhone(to),
      message:String(message||""),
      contactName:String(contactName||"")
    });
  }

  const response=await fetch(`${SUPABASE_URL}/functions/v1/whatsapp-send`,{
    method:"POST",
    headers,
    body
  });

  let result={};
  try{
    result=await response.json();
  }catch(e){
    result={ok:false,error:"Risposta non valida dal servizio WhatsApp"};
  }

  if(!response.ok || !result.ok){
    throw new Error(result?.error || "Errore durante l'invio WhatsApp");
  }

  return result;
}

async function sendNewWhatsappMessage(){
  const btn=document.getElementById("waNewSendBtn");
  const phone=String(document.getElementById("waNewPhone")?.value||"").trim();
  const message=String(document.getElementById("waNewText")?.value||"").trim();
  const file=document.getElementById("waNewFile")?.files?.[0]||null;
  const clientId=String(document.getElementById("waNewClient")?.value||"");
  const client=(state.clients||[]).find(c=>c.id===clientId);
  const contactName=client?clientDisplayName(client):"";

  if(!normalizeWaPhone(phone)){
    showToast("Inserisci il numero WhatsApp");
    return;
  }
  if(!message && !file){
    showToast("Scrivi un messaggio oppure allega un file");
    return;
  }

  try{
    if(btn){btn.disabled=true;btn.textContent="INVIO...";}
    await sendWhatsappRequest({to:phone,message,contactName,file});
    closeModal();
    selectedWhatsappWaId=normalizeWaPhone(phone);
    await refreshWhatsappInbox(true);
    renderWhatsapp();
    showToast("Messaggio WhatsApp inviato");
  }catch(error){
    console.error(error);
    showToast(error.message||"Errore durante l'invio WhatsApp");
  }finally{
    const b=document.getElementById("waNewSendBtn");
    if(b){b.disabled=false;b.textContent="INVIA WHATSAPP";}
  }
}

async function sendWhatsappReply(waId){
  const conv=whatsappConversationGroups().find(x=>x.waId===waId);
  if(!conv) return;

  const textarea=document.getElementById("whatsappReplyText");
  const fileInput=document.getElementById("whatsappReplyFile");
  const btn=document.getElementById("whatsappReplyBtn");
  const message=String(textarea?.value||"").trim();
  const file=fileInput?.files?.[0]||null;

  if(!message && !file){
    showToast("Scrivi un messaggio oppure allega un file");
    return;
  }

  try{
    if(btn){
      btn.disabled=true;
      btn.textContent="INVIO...";
    }
    if(textarea) textarea.disabled=true;
    if(fileInput) fileInput.disabled=true;

    await sendWhatsappRequest({
      to:conv.phone||conv.waId,
      message,
      contactName:conv.name||"",
      file
    });

    if(textarea) textarea.value="";
    if(fileInput) fileInput.value="";

    selectedWhatsappWaId=waId;
    await refreshWhatsappInbox(true);
    renderWhatsapp();

    showToast("Messaggio WhatsApp inviato");

  }catch(error){
    console.error(error);
    showToast(error.message||"Errore durante l'invio WhatsApp");
  }finally{
    const btn2=document.getElementById("whatsappReplyBtn");
    const textarea2=document.getElementById("whatsappReplyText");
    const file2=document.getElementById("whatsappReplyFile");
    if(btn2){
      btn2.disabled=false;
      btn2.textContent="INVIA WHATSAPP";
    }
    if(textarea2) textarea2.disabled=false;
    if(file2) file2.disabled=false;
  }
}

function whatsappReplyKeydown(event,waId){
  if((event.ctrlKey || event.metaKey) && event.key==="Enter"){
    event.preventDefault();
    sendWhatsappReply(waId);
  }
}

  try{

async function addNotaComunicazione(){
  const tipo="Comunicazione";
  const nomePersona=String(noteDraft.nomePersona||document.getElementById("nota-persona")?.value||"").trim();
  const testo=String(noteDraft.testo||document.getElementById("nota-testo")?.value||"").trim();
  const operatore=String(noteDraft.operatore||document.getElementById("nota-operatore")?.value||"").trim();

  if(!nomePersona){ showToast("Inserisci il nome della persona"); return; }
  if(!testo){ showToast("Inserisci il testo della nota"); return; }
  if(!operatore){ showToast("Seleziona l'operatore"); return; }

  const note={
    id:uid(), tipo, nomePersona, testo, operatore,
    fatto:false, creatoIl:new Date().toISOString(), fattoIl:""
  };
  const saved=await upsertOneReturning("noteComunicazioni",note);
  if(!saved) return;
  const i=state.noteComunicazioni.findIndex(x=>x.id===saved.id);
  if(i>=0) state.noteComunicazioni[i]=saved; else state.noteComunicazioni.push(saved);
  noteDraft={nomePersona:"",testo:"",operatore:""};
  renderNote();
  showToast("Nota salvata");
}


function modificaNotaComunicazione(id){
  const n=findItem("noteComunicazioni",id);
  const el=document.getElementById(`nota-desc-${id}`);
  if(!n || !el) return;

  el.dataset.originalValue=el.value;
  el.readOnly=false;
  el.focus();
  try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){}

  const editBtn=document.getElementById(`nota-modifica-${id}`);
  const saveBtn=document.getElementById(`nota-salva-${id}`);
  const cancelBtn=document.getElementById(`nota-annulla-${id}`);
  if(editBtn) editBtn.style.display="none";
  if(saveBtn) saveBtn.style.display="";
  if(cancelBtn) cancelBtn.style.display="";
}

function annullaModificaNota(id){
  const el=document.getElementById(`nota-desc-${id}`);
  if(!el) return;
  if(el.dataset.originalValue!==undefined) el.value=el.dataset.originalValue;
  el.readOnly=true;

  const editBtn=document.getElementById(`nota-modifica-${id}`);
  const saveBtn=document.getElementById(`nota-salva-${id}`);
  const cancelBtn=document.getElementById(`nota-annulla-${id}`);
  if(editBtn) editBtn.style.display="";
  if(saveBtn) saveBtn.style.display="none";
  if(cancelBtn) cancelBtn.style.display="none";
}

async function salvaDescrizioneNota(id){
  const n=findItem("noteComunicazioni",id);
  if(!n) return;

  const el=document.getElementById(`nota-desc-${id}`);
  const testo=String(el?.value||"").trim();

  if(!testo){
    showToast("La descrizione non può essere vuota");
    return;
  }

  const precedente=n.testo;
  n.testo=testo;

  const saved=await upsertOneReturning("noteComunicazioni",n);
  if(!saved){
    n.testo=precedente;
    return;
  }

  const i=state.noteComunicazioni.findIndex(x=>x.id===id);
  if(i>=0) state.noteComunicazioni[i]=saved;

  renderNote();
  showToast("Descrizione aggiornata");
}

async function markNotaFatta(id){
  const n=findItem("noteComunicazioni",id);
  if(!n) return;
  n.fatto=true;
  n.fattoIl=new Date().toISOString();
  const saved=await upsertOneReturning("noteComunicazioni",n);
  if(!saved) return;
  const i=state.noteComunicazioni.findIndex(x=>x.id===id);
  if(i>=0) state.noteComunicazioni[i]=saved;
  renderNote();
  showToast("Nota archiviata");
}
async function cleanupOldNoteComunicazioni(){
  const cutoff=Date.now()-(4*24*60*60*1000);
  const old=(state.noteComunicazioni||[]).filter(n=>n.fatto && n.fattoIl && new Date(n.fattoIl).getTime()<=cutoff);
  if(!old.length) return;

  const ids=old.map(n=>n.id);
  const {error}=await sb.from("note_comunicazioni").delete().in("id",ids);
  if(error){
    console.error("Errore pulizia note completate",error);
    return;
  }
  state.noteComunicazioni=state.noteComunicazioni.filter(n=>!ids.includes(n.id));
  if(currentView==="note") renderNote();
}

function orderPendingPickupRows(o){
  return getExternalLogisticsEntries(o).filter(e=>e.status==="DA RITIRARE");
}
function orderPendingPickupSuppliers(o){
  if(!orderPendingPickupRows(o).length) return [];
  return [...new Set((o?.righe||[]).filter(r=>r.categoria==="Lavorazioni Esterne").map(r=>String(r.fornitore||"").trim()).filter(Boolean))];
}
function orderCustomerStage(o){
  if(orderPendingPickupRows(o).length) return "DA RITIRARE";
  return o?.clienteAvvisato ? "AVVISATO" : "DA AVVISARE";
}
async function segnaRitiroCompletato(orderId){
  const o=findItem('orders',orderId);
  if(!o) return;
  const pending=orderPendingPickupRows(o);
  if(!pending.length) return;
  const pendingIds=new Set(pending.map(x=>x.id));
  let entries=(o.fasi||[]).filter(f=>f && f.key==="__ritiro_esterno__");
  if(entries.length){
    entries.forEach(e=>{ if(pendingIds.has(e.id)) e.status="RITIRATO"; });
  }
  (o.righe||[]).forEach(r=>{ if(r.categoria==="Lavorazioni Esterne" && r.ritiroEsterno==="DA RITIRARE") r.ritiroEsterno="RITIRATO"; });
  await saveState('orders');
  renderDashboard();
  showToast("Ritiro completato: ora il cliente è da avvisare");
}
async function consegnaOrdineAvvisato(orderId){
  const o=findItem("orders",orderId);
  if(!o || !o.clienteAvvisato) return;

  const oldState=o.stato;
  o.stato="Consegnato";

  const saved=await upsertOneReturning("orders",o);
  if(!saved){
    o.stato=oldState;
    showToast("Impossibile segnare come consegnato");
    return;
  }

  const i=state.orders.findIndex(x=>x.id===orderId);
  if(i>=0) state.orders[i]=saved;

  if(currentView==="dashboard") renderDashboard();
  if(currentView==="lavoriCompletati") renderLavoriCompletati();

  showToast("Ordine CONSEGNATO");
}

function completedOrderStageButton(o){
  const stage=orderCustomerStage(o);
  if(stage==="DA RITIRARE") return `<button class="btn btn-primary btn-sm" style="background:var(--teal);color:#fff;" onclick="segnaRitiroCompletato('${o.id}')">DA RITIRARE</button>`;
  if(stage==="DA AVVISARE") return `<button class="btn btn-primary btn-sm" style="background:var(--warn);color:#fff;" onclick="openAvvisaCliente('${o.id}')">DA AVVISARE</button>`;
  return `<button class="btn btn-outline btn-sm" style="border-color:var(--ok);color:var(--ok);" onclick="openAvvisaCliente('${o.id}')">AVVISATO</button>${o.avvisoMetodo ? `<div class="lr-sub" style="margin-top:4px;text-align:center;">${escapeHtml(o.avvisoMetodo)}</div>` : ``}`;

async function segnaFatturatoDaCompletati(orderId){
  const o=findItem('orders',orderId);
  if(!o) return;

  const oldDaFatturare=!!o.daFatturare;
  const oldFatturato=!!o.fatturato;

  o.daFatturare=true;
  o.fatturato=true;

  const saved=await upsertOneReturning('orders',o);
  if(!saved){
    o.daFatturare=oldDaFatturare;
    o.fatturato=oldFatturato;
    showToast("Modifica non salvata: riprova");
    return;
  }

  const i=state.orders.findIndex(x=>x.id===orderId);
  if(i>=0) state.orders[i]=saved;

  renderCurrentView();
  showToast("Ordine segnato come FATTURATO");
}

function orderInsertionSortValue(o){
  const ts=o?.createdAt ? Date.parse(o.createdAt) : NaN;
  if(Number.isFinite(ts)) return {hasDate:1, date:ts, numero:Number(o?.numero)||0};
  return {hasDate:0, date:0, numero:Number(o?.numero)||0};
}
function compareOrdersNewestFirst(a,b){
  const A=orderInsertionSortValue(a), B=orderInsertionSortValue(b);
  if(A.hasDate && B.hasDate && A.date!==B.date) return B.date-A.date;
  if(A.numero!==B.numero) return B.numero-A.numero;
  if(A.date!==B.date) return B.date-A.date;
  return String(b?.id||"").localeCompare(String(a?.id||""));
}
function creditiApertiRaggruppati(){
  const map = new Map();
  state.orders.filter(o=>o.stato==="Consegnato" && !o.daFatturare && !o.fatturato).forEach(o=>{
    const saldo = orderSaldo(o);
    if(saldo<=0.001) return;
    if(!map.has(o.clientId)) map.set(o.clientId, []);
    map.get(o.clientId).push({o, saldo});
  });
  return [...map.entries()]
    .map(([clientId, orders])=>{
      const ordinati = [...orders].sort((a,b)=>compareOrdersNewestFirst(a.o,b.o));
      return {
        clientId,
        orders: ordinati,
        totaleSaldo: ordinati.reduce((s,x)=>s+x.saldo,0),
        ultimoInserimentoOrdine: ordinati[0]?.o || null
      };
    })
    .sort((a,b)=>compareOrdersNewestFirst(a.ultimoInserimentoOrdine,b.ultimoInserimentoOrdine));
}

async function sendAvvisoClienteMail(orderId){
  const o=findItem('orders',orderId);
  const c=o ? state.clients.find(x=>x.id===o.clientId) : null;
  if(!o || !c) return;

  const to=String(document.getElementById("avviso-mail-to")?.value||c.email||"").trim();
  const subject=String(document.getElementById("avviso-mail-subject")?.value||"Lavoro pronto").trim();
  const bodyText=String(document.getElementById("avviso-mail-body")?.value||"").trim();
  const status=document.getElementById("avviso-mail-status");
  const btn=document.getElementById("avviso-mail-send");

  if(!to || !bodyText){
    showToast("Controlla email e messaggio");
    return;
  }

  if(btn) btn.disabled=true;
  if(status) status.textContent="Invio in corso…";

  try{
    const {data:sessionData}=await sb.auth.getSession();
    const session=sessionData?.session;
    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");

    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${session.access_token}`,
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        mode:"new",
        to,
        subject,
        bodyText,
        attachments:[]
      })
    });

    const raw=await response.text();
    let result={};
    try{ result=JSON.parse(raw); }catch(e){ result={}; }

    if(!response.ok){
      throw new Error(result?.error||result?.message||raw||`Errore HTTP ${response.status}`);
    }

    await markClienteAvvisato(orderId,"Mail");
    closeModal();
    showToast("Mail inviata · Cliente AVVISATO");
  }catch(err){
    console.error("Invio avviso cliente via Gmail",err);
    if(status) status.textContent=`Errore: ${err?.message||"invio non riuscito"}`;
    if(btn) btn.disabled=false;
  }
}

let globalSearchMap = {};
function positionGlobalSearchDropdown(){
  const input=document.getElementById('globalClientSearch');
  const dd=document.getElementById('globalSearchDropdown');
  if(!input||!dd) return;
  const r=input.getBoundingClientRect();
  dd.style.left=`${Math.round(r.left)}px`;
  dd.style.top=`${Math.round(r.bottom+6)}px`;
  dd.style.width=`${Math.round(r.width)}px`;
}
function updateGlobalClientSuggestions(value){
  const dd = document.getElementById('globalSearchDropdown');
  const v = value.trim();
  if(v.length < 2){ dd.style.display = "none"; dd.innerHTML = ""; globalSearchMap = {}; return; }
  const q = v.toLowerCase();
  const qCompact = q.replace(/[^a-z0-9àèéìòù]/gi, "");
  const qDigits = q.replace(/\D/g, "");
  const matches = state.clients.filter(c=>{
    const display = clientDisplayName(c).toLowerCase();
    const nome = (c.nome||c.refNome||"").toLowerCase();
    const cognome = (c.cognome||c.refCognome||"").toLowerCase();
    const ragione = (c.ragioneSociale||"").toLowerCase();
    const commerciale = (c.nomeCommerciale||"").toLowerCase();
    const email = (c.email||"").toLowerCase();
    const piva = (c.partitaIva||"").toLowerCase();
    const telefono = (c.telefono||"");
    const telefonoDigits = telefono.replace(/\D/g, "");
    const nameForward = `${nome} ${cognome}`.trim();
    const nameReverse = `${cognome} ${nome}`.trim();
    const searchable = [display,nome,cognome,ragione,commerciale,email,piva,nameForward,nameReverse].join(" ");
    return searchable.includes(q) ||
      searchable.replace(/[^a-z0-9àèéìòù]/gi, "").includes(qCompact) ||
      (qDigits.length >= 2 && telefonoDigits.includes(qDigits));
  }).slice(0,10);
  globalSearchMap = {};
  matches.forEach(c => { globalSearchMap[c.id] = c; });
  dd.innerHTML = matches.length
    ? matches.map(c=>`<div class="gsd-item" onmousedown="goToClientById('${c.id}')">
        <div>${clientDisplayName(c)}</div>
        ${(c.telefono||c.email) ? `<div style="font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px;">${[c.telefono,c.email].filter(Boolean).join(' · ')}</div>` : ''}
      </div>`).join("")
    : `<div class="gsd-empty">Nessun cliente trovato</div>`;
  positionGlobalSearchDropdown();
  dd.style.display = "block";
}
window.addEventListener('resize', ()=>{
  const dd=document.getElementById('globalSearchDropdown');
  if(dd && dd.style.display==='block') positionGlobalSearchDropdown();

/* Crea (o aggiorna, se existingId è passato) un cliente leggendo i campi con un dato prefisso.
   IMPORTANTE: ritorna l'id solo DOPO che Supabase ha confermato il salvataggio. */
async function createClientFromPrefix(prefix, existingId){
  const tipo = document.getElementById(`${prefix}-tipo`).value;
  const telefono = document.getElementById(`${prefix}-telefono`).value.trim();
  const email = document.getElementById(`${prefix}-email`).value.trim();
  if(!telefono && !email){ showToast("Inserisci almeno telefono o email"); return null; }

  const comuni = readCommonClientFields(prefix);
  let payload;

  if(tipo==="Business"){
    const ragioneSociale = document.getElementById(`${prefix}-ragsoc`).value.trim();
    const settore = document.getElementById(`${prefix}-settore`).value;
    if(!ragioneSociale){ showToast("Inserisci il nome dell'azienda"); return null; }
    if(!settore){ showToast("Il settore è obbligatorio per i clienti Business"); return null; }
    payload = {
      tipo, ragioneSociale,
      nomeCommerciale:document.getElementById(`${prefix}-nomecommerciale`)?.value.trim()||"",
      refNome:document.getElementById(`${prefix}-refnome`).value.trim(),
      refCognome:document.getElementById(`${prefix}-refcognome`).value.trim(),
      settore, richiesta:"", telefono, email, ...comuni
    };
  } else {
    const nome = document.getElementById(`${prefix}-nome`).value.trim();
    if(!nome){ showToast("Inserisci il nome della persona"); return null; }
    const richiesta = document.getElementById(`${prefix}-richiesta`)?.value || "";
    payload = {
      tipo, nome,
      cognome:document.getElementById(`${prefix}-cognome`).value.trim(),
      settore:"", richiesta, telefono, email, ...comuni
    };
  }

  if(existingId){
    const c = findItem('clients', existingId);
    if(!c) return null;
    const backup = {...c};
    Object.assign(c, payload);
    const ok = await upsertOne('clients', c);
    if(!ok){
      Object.keys(c).forEach(k=>delete c[k]);
      Object.assign(c, backup);
      return null;
    }
    return existingId;
  }

  const id = uid();
  const nuovo = {id, ...payload, archiviatoRecenti:false};
  const saved = await upsertOneReturning('clients', nuovo);
  if(!saved) return null;

  const existingIdx=state.clients.findIndex(c=>c.id===id);
  if(existingIdx>=0) state.clients[existingIdx]=saved;
  else state.clients.push(saved);
  return id;
}

      return Number(b.numero||0)-Number(a.numero||0);

  const c=findItem("clients",clientId);

  const saved=await upsertOneReturning("clients",c);

async function setClientDropboxFolder(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c) return;
  const current = String(c.dropboxFolderUrl||"");
  const value = window.prompt(
    "Incolla il link Dropbox della cartella di questo cliente.\n\nPer rimuovere il collegamento lascia il campo vuoto e conferma.",
    current
  );
  if(value===null) return;
  const url = value.trim();
  if(url && !/^https?:\/\//i.test(url)){
    showToast("Incolla un link Dropbox completo che inizi con https://");
    return;

/* ============ IMPORT CSV CLIENTI ============ */
function parseCsvLine(line){
  const out = []; let cur = ""; let inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
function parseClientsCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const rows = lines.map(parseCsvLine);
  const headerIdx = rows.findIndex(r => r.some(c=>c.trim().toLowerCase()==="ragione sociale"));
  if(headerIdx === -1){ showToast("Formato CSV non riconosciuto: manca la colonna 'Ragione sociale'"); return []; }
  const header = rows[headerIdx].map(h=>h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const cRagSoc=idx("ragione sociale"), cNome=idx("nome"), cCognome=idx("cognome"), cTipologia=idx("tipologia"),
        cIndirizzo=idx("indirizzo"), cComune=idx("comune"), cCap=idx("cap"), cProvincia=idx("provincia"),
        cPiva=idx("partita iva"), cCf=idx("codice fiscale"), cCell=idx("cellulare"), cTel=idx("telefono"),
        cEmail=idx("email"), cPec=idx("pec");
  const get = (r,i) => (i>=0 && r[i]!==undefined) ? r[i].trim() : "";
  const clients = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r.some(c=>c.trim())) continue;
    const ragsoc = get(r,cRagSoc).replace(/^:\s*/,"");
    const nome = get(r,cNome), cognome = get(r,cCognome);
    if(!ragsoc && !nome && !cognome) continue;
    const tipologia = get(r,cTipologia);
    const tipo = (tipologia==="Privato" || tipologia==="Persona fisica titolare di Partita IVA") ? "Family" : "Business";
    const common = {
      telefono: get(r,cCell) || get(r,cTel), email: get(r,cEmail), settore:"",
      indirizzo: get(r,cIndirizzo), citta: get(r,cComune), cap: get(r,cCap), provincia: get(r,cProvincia),
      partitaIva: get(r,cPiva), codiceFiscale: get(r,cCf), pec: get(r,cPec),
      _importBatch: "csv_" + today(),
      archiviatoRecenti: true
    };
    if(tipo==="Business"){
      clients.push({id:uid(), tipo, ragioneSociale: ragsoc || `${nome} ${cognome}`.trim(), refNome:nome, refCognome:cognome, ...common});
    } else {
      clients.push({id:uid(), tipo, nome: nome || ragsoc, cognome, ...common});
    }
  }
  return clients;
}
function handleClientCsvUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseClientsCsv(e.target.result);
    if(!parsed.length){ showToast("Nessun cliente valido trovato nel file"); return; }
    state.clients.push(...parsed);
    saveState('clients'); toggleForm('importForm'); renderClienti();
    showToast(`${parsed.length} clienti importati`);
  };
  reader.readAsText(file, "UTF-8");
}

function magazzinoAllowedCategorie(o){
  const set=new Set();

  (o.righe||[]).forEach(r=>{
    const prodotto=String(r.prodotto||"").trim();

    if(r.categoria==="Stampa"){
      if(!prodotto || prodotto==="Tessuto del cliente") return;
      if(prodotto==="Altro") set.add("Altro tessuto");
      else if(directMap.has(prodotto)) set.add(prodotto);
      else set.add("*");
    }

    // RICAMO: mostra Prodotto/Magazzino per TUTTI,
    // esclusivamente quando il prodotto è "Patch".
    if(r.categoria==="Ricamo"){
      if(!prodotto || prodotto==="Patch") return;
      if(prodotto==="Altro") set.add("Altro tessuto");
      else if(directMap.has(prodotto)) set.add(prodotto);
      else set.add("*");
    }
  });

  return set;
}

function magazzinoColoreDatalistOptions(codice){
  if(!codice) return "";
  const disponibiliRaw = magazzinoColoriDisponibili(codice);
  const disponibili = new Map();
  disponibiliRaw.forEach((qty,color)=>{
    const canonical = canonicalWarehouseColor(color);
    disponibili.set(canonical,(disponibili.get(canonical)||0)+qty);
  });
  const catalogo = catalogColorsForCode(codice).map(c=>canonicalWarehouseColor(c));
  const vals = [...new Set([...disponibili.keys(), ...catalogo])];
  vals.sort((a,b)=>{
    const qa=disponibili.get(a)||0, qb=disponibili.get(b)||0;
    if((qa>0)!==(qb>0)) return qa>0 ? -1 : 1;
    return compareWarehouseColors(a,b);
  });
  return vals.map(v=>{
    const q=disponibili.get(v)||0;
    return `<option value="${v}">${q>0?`Disponibile: ${q} pz`:"Catalogo — da ordinare"}</option>`;
  }).join("");
}
function magazzinoTagliaDatalistOptions(codice,colore){
  if(!codice || !colore) return "";
  const disponibili = magazzinoTaglieDisponibili(codice,colore);
  const catalogo = catalogSizesForCode(codice,colore);
  const vals = [...new Set([...disponibili.keys(), ...catalogo])];
  vals.sort((a,b)=>{
    const qa=disponibili.get(a)||0, qb=disponibili.get(b)||0;

    // Prima tutte le taglie realmente disponibili.
    if((qa>0)!==(qb>0)) return qa>0 ? -1 : 1;

    // Dentro ciascun gruppo: dalla taglia più piccola alla più grande.
    return compareWarehouseSizes(a,b);
  });
  return vals.map(v=>{
    const q=disponibili.get(v)||0;
    return `<option value="${v}">${q>0?`Disponibile: ${q} pz`:"Catalogo — da ordinare"}</option>`;
  }).join("");
}
async function restoreReservedStockDb(entry){
  if(!entry || !entry.articoloId || Number(entry._reservedQty)<=0) return true;
  const w=findItem('warehouse',entry.articoloId);
  if(!w){
    entry._reservedQty=0;
    entry.articoloId="";
    return true;
  }
  const saved=await updateWarehouseDirect(w,{quantita:Number(w.quantita||0)+Number(entry._reservedQty||0)});
  if(!saved) return false;
  const idx=state.warehouse.findIndex(x=>x.id===saved.id);
  if(idx>=0) state.warehouse[idx]=saved;
  entry._reservedQty=0;
  entry.articoloId="";
  return true;
}

async function reserveWarehouseForEntry(entry){
  entry.stornato=false;
  entry.daOrdinareQty=0;
  entry.ordineConfermato=false;
  entry.inCarrello=false;
  entry.inCarrelloAt=null;

  const richiesta=Math.max(
    0,
    Number(entry.quantitaRichiesta ?? entry.quantita) || 0
  );
  entry.quantitaRichiesta = richiesta;
  entry.quantita = richiesta;
  if(!entry.codice || !entry.colore || !entry.taglia || !richiesta) return true;

  const w=state.warehouse.find(x=>
    String(x.codice||"").toUpperCase()===String(entry.codice||"").toUpperCase() &&
    warehouseColorKey(x.colore)===warehouseColorKey(entry.colore) &&
    (String(x.taglia||"").toUpperCase()===String(entry.taglia||"").toUpperCase() ||
     (!String(x.taglia||"").trim() && String(entry.taglia||"").toUpperCase()==="UNICA"))
  );

  if(!w){
    entry.daOrdinareQty=richiesta;
    return true;
  }

  const disponibile=Math.max(0,Number(w.quantita)||0);
  const daStornare=Math.min(disponibile,richiesta);

  if(daStornare>0){
    const saved=await updateWarehouseDirect(w,{quantita:disponibile-daStornare});
    if(!saved) return false;
    const idx=state.warehouse.findIndex(x=>x.id===saved.id);
    if(idx>=0) state.warehouse[idx]=saved;
    entry._reservedQty=daStornare;
    entry.articoloId=saved.id;
  }

  entry.daOrdinareQty=Math.max(0,richiesta-daStornare);
  entry.stornato=entry.daOrdinareQty===0;
  return true;
}

async function updateMagazzinoField(orderId,rigaId,field,value){
  const o=findItem('orders',orderId); if(!o) return;
  const entry=(o.magazzino||[]).find(m=>m.id===rigaId); if(!entry) return;

  // Blocca doppi cambi mentre è in corso il collegamento con il database.
  if(entry._savingWarehouseLink) return;
  entry._savingWarehouseLink=true;

  try{
    // Prima rimettiamo a magazzino ciò che questa riga aveva già riservato.
    const restored=await restoreReservedStockDb(entry);
    if(!restored){ showToast("Impossibile ripristinare la quantità precedente"); return; }

    entry.stornato=false;
    entry.daOrdinareQty=0;
    entry.ordineConfermato=false;
    entry.inCarrello=false;
    entry.inCarrelloAt=null;

    if(field==='codice'){
      entry.codice=normalizeCatalogCode(value);
      const cp=catalogProduct(entry.codice);
      entry.nome=cp ? (cp.name||"") : catalogNameForCode(entry.codice);
      entry.colore="";
      entry.taglia="";
    }else if(field==='colore'){
      entry.colore=String(value||"").trim();
      entry.taglia="";
    }else if(field==='taglia'){
      entry.taglia=String(value||"").trim()||"UNICA";
    }else if(field==='quantita'){
      const nuovaQuantita=Math.max(0,Number(value)||0);
      entry.quantita=nuovaQuantita;
      entry.quantitaRichiesta=nuovaQuantita;
    }

    // Scala il magazzino solo quando la riga è completa.
    const reserved=await reserveWarehouseForEntry(entry);
    if(!reserved){ showToast("Quantità NON aggiornata nel magazzino"); return; }

    // Il flag è solo runtime e non deve finire nel JSON dell'ordine.
    delete entry._savingWarehouseLink;

    const orderSaved=await upsertOne('orders',o);
    if(!orderSaved){
      // Se l'ordine non si salva, restituiamo la quantità appena riservata.
      await restoreReservedStockDb(entry);
      return;
    }

    await reloadWarehouseFromDb();
    openJobCard(orderId);
    showToast(entry.articoloId ? `${entry._reservedQty} pz collegati e scalati dal magazzino` : "Prodotto collegato");
  }catch(err){
    console.error("Errore collegamento prodotto/magazzino",err);
    showToast(`Errore collegamento magazzino: ${err?.message||"riprova"}`);
  }finally{
    delete entry._savingWarehouseLink;
  }
}

function confermaOrdineMagazzino(orderId, rigaId){

  entry.quantitaRichiesta = Math.max(

}

function orderProductOptions(category, selected){
  if(category!=="Stampa" && category!=="Ricamo") return prodottoOptions(category, selected);
  const choices = category==="Stampa"
    ? [
        ["Tessuto del cliente","TESSUTO DEL CLIENTE"],
        ["T-shirt","TSHIRT"],
        ["Polo","POLO"],
        ["Felpa","FELPA"],
        ["Shopper","SHOPPER"],
        ["Cappello","CAPPELLO"],
        ["Altro","ALTRO"]

        ["Tessuto del cliente","TESSUTO DEL CLIENTE"],
        ["T-shirt","TSHIRT"],
        ["Polo","POLO"],
        ["Felpa","FELPA"],
        ["Shopper","SHOPPER"],
        ["Cappello","CAPPELLO"],
        ["Patch","PATCH"],
        ["Altro","ALTRO"]
      ];
  const allowedValues = choices.map(x=>x[0]);
  let html='';

function workPriceInputValue(v){

function moveWorkDescriptionOverflow(orderId, lineId, inputEl){
  const o=findItem("orders",orderId);
  if(!o || !inputEl) return;
  const r=(o.righe||[]).find(x=>x.id===lineId);
  if(!r) return;

  let value=String(inputEl.value||"");
  if(value.length>30){
    const extra=value.slice(30);
    value=value.slice(0,30);
    inputEl.value=value;

    const oldDetail=String(r.descrizione||"");
    r.descrizione=(oldDetail ? `${oldDetail} ${extra}` : extra).trim();

    const detail=document.getElementById(`work-detail-${lineId}`);
    if(detail) detail.value=r.descrizione;
  }

  r.prodotto=value;
  saveState("orders");
}

}
function removeRiga(collection, id, rigaId){

  saveState(collection);

function adjustWarehouseQty(articoloId, delta){
  if(!articoloId) return;
  const w = findItem('warehouse', articoloId);
  if(!w) return;
  w.quantita = Math.max(0, Number(w.quantita) + delta);
}
function updateRigaField(collection, id, rigaId, field, value){
  const item = findItem(collection, id);
  const riga = item.righe.find(r=>r.id===rigaId);
  riga[field] = (field==='quantita'||field==='prezzoUnitario') ? Number(value)||0 : value;
  if(collection==='orders' && field==='categoria'){
    recalcFasi(item);
    if(value!=="Lavorazioni Esterne"){
      delete riga.ritiroEsterno;
      delete riga.fornitore;
    }else{
      const existingSupplier=(item.righe||[]).find(x=>x.id!==riga.id && x.categoria==="Lavorazioni Esterne" && String(x.fornitore||"").trim())?.fornitore||"";
      if(existingSupplier) riga.fornitore=existingSupplier;
    }
  }
  saveState(collection);
  if(collection==='orders') openJobCard(id); else openQuoteDetail(id);
}

  let clientId = null;

  if(sel.value === "__new__"){
    clientId = await createClientFromPrefix("qfnc");
    if(!clientId) return;
  } else if(sel.value){
    clientId = sel.value;
  }

  const id = uid();
  const quote = {
    id,
    clientId: clientId || null,
    categoria:document.getElementById("qf-categoria").value,
    descrizione:"",
    righe:[],
    stato:"Bozza",
    data:today()
  };
  const ok = await upsertOne('quotes', quote);
  if(!ok) return;

  if(!state.quotes.some(q=>q.id===id)) state.quotes.push(quote);
  toggleForm('quoteForm');
  renderPreventivi();
  showToast(clientId ? "Preventivo creato" : "Preventivo creato senza cliente");

}
function setQuoteStatus(id, stato){ findItem('quotes',id).stato = stato; saveState('quotes'); renderPreventivi(); }
function deleteQuote(id){
  askConfirm("Eliminare questo preventivo?", ()=>{

}
async function convertToOrder(quoteId){
  const q = findItem('quotes', quoteId);
  if(!q) return;

  if(!q.clientId){
    openQuoteClientForConversion(quoteId);
    return;
  }
  await finalizeQuoteToOrder(quoteId, q.clientId);
}

    </div>
  `;

async function confirmQuoteClientAndConvert(quoteId){
  const sel = document.getElementById("qc-cliente");
  if(!sel || !sel.value){ showToast("Seleziona o crea un cliente"); return; }

  let clientId = sel.value;
  if(clientId === "__new__"){
    clientId = await createClientFromPrefix("qcnc");
    if(!clientId) return;
  }

  const q = findItem('quotes', quoteId);
  if(!q) return;
  q.clientId = clientId;
  const okQuote = await upsertOne('quotes', q);
  if(!okQuote) return;

  await finalizeQuoteToOrder(quoteId, clientId);
}

async function finalizeQuoteToOrder(quoteId, clientId){
  const q = findItem('quotes', quoteId);
  if(!q || !clientId) return;

  const righe = q.righe.map(r=>({
    id:uid(),
    descrizione:r.descrizione,
    categoria:q.categoria,
    prodotto:r.prodotto||"",
    stato:"Da fare",
    quantita:r.quantita,
    prezzoUnitario:r.prezzoUnitario
  }));

  const order = mkOrder(uid(), clientId, q.descrizione, "", "Da fare", "", righe);
  const okOrder = await upsertOne('orders', order);
  if(!okOrder) return;

  if(!state.orders.some(o=>o.id===order.id)) state.orders.push(order);

  q.clientId = clientId;
  q.convertito = true;
  const okQuote = await upsertOne('quotes', q);
  if(!okQuote) return;

  closeModal();
  renderPreventivi();
  showToast("Ordine creato dal preventivo");
}

let quoteMailAttachments=[];

}
function openQuoteMail(quoteId){

    <div id="quote-mail-status" class="helptext"></div>

}
async function handleQuoteMailFiles(fileList){
  const files=Array.from(fileList||[]);
  if(quoteMailAttachments.length+files.length>10){showToast('Puoi allegare al massimo 10 file');return;}
  try{
    for(const file of files){quoteMailAttachments.push({filename:file.name,mimeType:file.type||'application/octet-stream',size:file.size||0,dataBase64:await fileToBase64(file)});}
    renderQuoteMailAttachments();
  }catch(e){console.error(e);showToast('Errore lettura allegato');}
}
function renderQuoteMailAttachments(){
  const box=document.getElementById('quote-mail-attachments'); if(!box) return;
  box.innerHTML=quoteMailAttachments.length?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">${quoteMailAttachments.map((a,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;"><div><strong>📎 ${escapeHtml(a.filename)}</strong><div style="font-size:10.5px;color:var(--muted);">${mailFileSize(a.size)}</div></div><button class="btn btn-ghost btn-sm" onclick="quoteMailAttachments.splice(${i},1);renderQuoteMailAttachments()">Rimuovi</button></div>`).join('')}</div>`:'';
}
async function sendQuoteMail(quoteId){
  const q=findItem('quotes',quoteId); if(!q) return;
  const to=String(document.getElementById('quote-mail-to')?.value||'').trim();
  const subject=String(document.getElementById('quote-mail-subject')?.value||'').trim();
  const bodyText=String(document.getElementById('quote-mail-body')?.value||'').trim();
  const status=document.getElementById('quote-mail-status'); const btn=document.getElementById('quote-mail-send');
  if(!to||!bodyText){showToast('Controlla email e messaggio');return;}
  if(btn)btn.disabled=true; if(status)status.textContent='Invio in corso…';
  try{
    const {data:sessionData}=await sb.auth.getSession(); const session=sessionData?.session;
    if(!session?.access_token) throw new Error('Sessione del gestionale non disponibile.');
    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({mode:'new',to,subject,bodyText,attachments:quoteMailAttachments})});
    const raw=await response.text(); let result={}; try{result=JSON.parse(raw)}catch(e){}
    if(!response.ok) throw new Error(result?.error||result?.message||raw||`Errore HTTP ${response.status}`);
    quoteMailAttachments=[]; openQuoteDetail(quoteId); showToast('Preventivo inviato via Gmail');
  }catch(err){console.error('Invio preventivo Gmail',err); if(status)status.textContent=`Errore: ${err?.message||'invio non riuscito'}`; if(btn)btn.disabled=false;}
}
async function transformQuoteToLead(quoteId){
  const q=findItem('quotes',quoteId); if(!q) return;
  const existing=(state.leads||[]).find(l=>l.fonte===`preventivo:${quoteId}`);
  if(existing){showToast('Questo preventivo è già stato trasformato in Lead');return;}

/* ============ DROPBOX ============ */
const DROPBOX_APP_KEY_STORAGE = "gestionale_dropbox_app_key";
const DROPBOX_TOKEN_STORAGE = "gestionale_dropbox_access_token";
const DROPBOX_TOKEN_EXP_STORAGE = "gestionale_dropbox_access_token_exp";
const DROPBOX_PKCE_VERIFIER = "gestionale_dropbox_pkce_verifier";
const DROPBOX_OAUTH_STATE = "gestionale_dropbox_oauth_state";
let dropboxCurrentPath = "";

function dropboxRedirectUri(){
  return "https://gestionale.creativogroup.it/";
}
function dropboxAppKey(){
  const saved=(localStorage.getItem(DROPBOX_APP_KEY_STORAGE)||"").trim();
  return saved || "b28z7gce12tgzid";
}
function dropboxToken(){
  const token=sessionStorage.getItem(DROPBOX_TOKEN_STORAGE)||"";
  const exp=Number(sessionStorage.getItem(DROPBOX_TOKEN_EXP_STORAGE)||0);
  if(exp && Date.now()>exp){
    sessionStorage.removeItem(DROPBOX_TOKEN_STORAGE);
    sessionStorage.removeItem(DROPBOX_TOKEN_EXP_STORAGE);
    return "";
  }
  return token;
}
function dropboxIsConnected(){ return !!dropboxToken(); }

function dropboxBase64Url(bytes){
  let binary="";
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function dropboxRandomString(length=64){
  const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const bytes=new Uint8Array(length);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>alphabet[b%alphabet.length]).join("");
}
async function dropboxPkceChallenge(verifier){
  const data=new TextEncoder().encode(verifier);
  const digest=await crypto.subtle.digest("SHA-256",data);
  return dropboxBase64Url(new Uint8Array(digest));
}

async function connectDropbox(){
  const envWarning=dropboxEnvironmentWarning();
  if(envWarning){ showToast(envWarning); return; }
  const input=document.getElementById("dropboxAppKeyInput");
  const key=(input?.value||dropboxAppKey()).trim();
  const redirect=dropboxRedirectUri();

  if(!key){ showToast("Inserisci prima la Dropbox App Key"); return; }
  if(!redirect){
    showToast("Dropbox richiede il gestionale aperto da HTTPS o localhost");
    return;
  }
  if(!window.crypto?.subtle){
    showToast("Il browser non supporta il collegamento sicuro Dropbox");
    return;
  }

  localStorage.setItem(DROPBOX_APP_KEY_STORAGE,key || "b28z7gce12tgzid");

  const verifier=dropboxRandomString(96);
  const challenge=await dropboxPkceChallenge(verifier);
  const state=dropboxRandomString(48);
  sessionStorage.setItem(DROPBOX_PKCE_VERIFIER,verifier);
  sessionStorage.setItem(DROPBOX_OAUTH_STATE,state);

  const scopes=[
    "account_info.read",
    "files.metadata.read",
    "files.content.read",
    "files.content.write"
  ].join(" ");

  const url=new URL("https://www.dropbox.com/oauth2/authorize");
  url.searchParams.set("client_id",key);
  url.searchParams.set("response_type","code");
  url.searchParams.set("redirect_uri",redirect);
  url.searchParams.set("code_challenge",challenge);
  url.searchParams.set("code_challenge_method","S256");
  url.searchParams.set("token_access_type","online");
  url.searchParams.set("scope",scopes);
  url.searchParams.set("state",state);
  location.href=url.toString();
}

async function handleDropboxOAuthCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get("code");
  const state=params.get("state");
  if(!code) return false;

  const expected=sessionStorage.getItem(DROPBOX_OAUTH_STATE)||"";
  const verifier=sessionStorage.getItem(DROPBOX_PKCE_VERIFIER)||"";
  const key=dropboxAppKey();
  const redirect=dropboxRedirectUri();

  if(!expected || state!==expected || !verifier || !key || !redirect){
    showToast("Collegamento Dropbox non valido o scaduto");
    return false;
  }

  try{
    const body=new URLSearchParams();
    body.set("code",code);
    body.set("grant_type","authorization_code");
    body.set("client_id",key);
    body.set("redirect_uri",redirect);
    body.set("code_verifier",verifier);

    const res=await fetch("https://api.dropboxapi.com/oauth2/token",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data?.error_description||data?.error||"Errore OAuth Dropbox");

    sessionStorage.setItem(DROPBOX_TOKEN_STORAGE,data.access_token||"");
    if(data.expires_in){
      sessionStorage.setItem(DROPBOX_TOKEN_EXP_STORAGE,String(Date.now()+(Number(data.expires_in)*1000)-30000));
    }
    sessionStorage.removeItem(DROPBOX_PKCE_VERIFIER);
    sessionStorage.removeItem(DROPBOX_OAUTH_STATE);

    const clean=location.origin+location.pathname;
    history.replaceState({},document.title,clean);

    currentView="dropbox";
    document.querySelectorAll("section.view").forEach(s=>s.classList.remove("active"));
    document.getElementById("view-dropbox")?.classList.add("active");
    renderViewHeading(); renderNav(); renderTopbarActions(); renderDropbox();
    showToast("Dropbox collegato");
    return true;
  }catch(err){
    console.error("Dropbox OAuth",err);
    showToast("Errore collegamento Dropbox");
    return false;
  }
}

function disconnectDropbox(){
  sessionStorage.removeItem(DROPBOX_TOKEN_STORAGE);
  sessionStorage.removeItem(DROPBOX_TOKEN_EXP_STORAGE);
  dropboxCurrentPath="";
  renderDropbox();
  showToast("Dropbox scollegato da questa sessione");
}

async function dropboxApi(route, body={}){
  const token=dropboxToken();
  if(!token) throw new Error("Dropbox non collegato");
  const res=await fetch("https://api.dropboxapi.com/2/"+route,{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
  });
  const raw=await res.text();
  let data={};
  try{ data=raw?JSON.parse(raw):{}; }catch(e){ data={raw}; }
  if(!res.ok){
    if(res.status===401){
      sessionStorage.removeItem(DROPBOX_TOKEN_STORAGE);
      sessionStorage.removeItem(DROPBOX_TOKEN_EXP_STORAGE);
    }
    throw new Error(data?.error_summary||data?.error?.[".tag"]||raw||("Errore Dropbox "+res.status));
  }
  return data;
}

function dropboxFormatBytes(n){
  n=Number(n)||0;
  if(n<1024) return n+" B";
  if(n<1024*1024) return (n/1024).toFixed(1)+" KB";
  if(n<1024*1024*1024) return (n/(1024*1024)).toFixed(1)+" MB";
  return (n/(1024*1024*1024)).toFixed(1)+" GB";
}

async function dropboxLoadFolder(path=""){
  dropboxCurrentPath=path||"";
  const label=document.getElementById("dropboxPathLabel");
  const list=document.getElementById("dropboxFileList");
  if(label) label.textContent=dropboxCurrentPath||"/";
  if(list) list.innerHTML=`<div class="dropbox-empty">Caricamento…</div>`;

  try{
    const data=await dropboxApi("files/list_folder",{path:dropboxCurrentPath,recursive:false,include_deleted:false});
    const entries=(data.entries||[]).sort((a,b)=>{
      const af=a[".tag"]==="folder"?0:1, bf=b[".tag"]==="folder"?0:1;
      return af-bf || String(a.name||"").localeCompare(String(b.name||""),"it");
    });

    if(!entries.length){
      list.innerHTML=`<div class="dropbox-empty">Cartella vuota.</div>`;
      return;
    }

    list.innerHTML=entries.map(item=>{
      const isFolder=item[".tag"]==="folder";
      const pathLower=item.path_lower||item.path_display||"";
      return `
        <div class="dropbox-row" ${isFolder?`onclick="dropboxOpenFolder('${escapeHtml(pathLower).replace(/'/g,"&#39;")}')"`:""}>
          <div class="dropbox-file-main">
            <div class="dropbox-file-name">${isFolder?'📁':'📄'} ${escapeHtml(item.name||"")}</div>
            <div class="dropbox-file-meta">${isFolder?'Cartella':dropboxFormatBytes(item.size)}${item.client_modified?` · ${new Date(item.client_modified).toLocaleString("it-IT")}`:""}</div>
          </div>
          <div class="dropbox-file-actions">
            ${isFolder
              ? `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();dropboxOpenFolder('${escapeHtml(pathLower).replace(/'/g,"&#39;")}')">Apri</button>`
              : `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();dropboxDownloadFile('${escapeHtml(pathLower).replace(/'/g,"&#39;")}','${escapeHtml(item.name||"").replace(/'/g,"&#39;")}')">Scarica</button>`}
          </div>
        </div>`;
    }).join("");
  }catch(err){
    console.error("Dropbox list",err);
    if(list) list.innerHTML=`<div class="dropbox-empty" style="color:var(--danger);">Errore: ${escapeHtml(err.message||"Impossibile caricare Dropbox")}</div>`;
  }
}

async function dropboxUploadSelected(){

      },

function dropboxApiArgHeader(arg){
  // Dropbox riceve gli argomenti del Content API dentro un header HTTP.
  // Rendiamo il JSON ASCII-safe: evita problemi con accenti, emoji e caratteri
  // particolari presenti nei nomi dei file.
  return JSON.stringify(arg).replace(/[^\x20-\x7E]/g,ch=>{
    const code=ch.charCodeAt(0).toString(16).padStart(4,"0");
    return "\\u"+code;
  });
}

function dropboxFriendlyContentError(status,raw){
  let msg=String(raw||"").trim();
  try{
    const data=msg?JSON.parse(msg):{};
    msg=data?.error_summary || data?.error?.[".tag"] || data?.error_description || msg;
  }catch(e){}
  if(status===401) return "Sessione Dropbox scaduta. Ricollega Dropbox.";
  if(status===403 && /scope|permission|access/i.test(msg)) return "Dropbox non ha il permesso di leggere i file. Scollega e ricollega Dropbox una volta.";
  if(status===409 && /not_found/i.test(msg)) return "Il file non è più disponibile nel percorso Dropbox salvato.";
  return msg || ("Errore Dropbox "+status);
}

async function dropboxFetchContent(fileRef,route="files/download"){
  const token=dropboxToken();
  if(!token) throw new Error("Dropbox non collegato");
  const res=await fetch("https://content.dropboxapi.com/2/"+route,{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+token,
      "Dropbox-API-Arg":dropboxApiArgHeader({path:fileRef})
    }
  });
  if(!res.ok){
    const raw=await res.text();
    if(res.status===401){
      sessionStorage.removeItem(DROPBOX_TOKEN_STORAGE);
      sessionStorage.removeItem(DROPBOX_TOKEN_EXP_STORAGE);
    }
    throw new Error(dropboxFriendlyContentError(res.status,raw));
  }
  return await res.blob();
}

async function dropboxDownloadFile(fileRef,name){
  if(!dropboxToken()){ showToast("Dropbox non collegato"); return; }
  try{
    const blob=await dropboxFetchContent(fileRef,"files/download");
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=name||"file";
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      try{ a.remove(); }catch(e){}
      URL.revokeObjectURL(url);
    },60000);
    showToast("Download avviato");
  }catch(err){
    console.error("Dropbox download",err);
    showToast(err?.message||"Errore download Dropbox");
  }
}

/* ============ DROPBOX NELLA SCHEDA LAVORAZIONE ============ */
const DROPBOX_ARCHIVE_START_DATE = "2026-10-01";
const JOB_DROPBOX_SUBFOLDERS = ["FILE RICEVUTI","FILE DEFINITIVI","FILE DI STAMPA"];
const jobDropboxUiState = {};

function dropboxSafePathPart(value){
  return String(value||"")
    .replace(/[\/\\<>:"|?*\x00-\x1F]/g," ")
    .replace(/\s+/g," ")
    .trim()
    .replace(/[. ]+$/g,"")
    .slice(0,120) || "Senza nome";
}

function jobDropboxUsesChronologicalArchive(o){
  const created=String(o?.createdAt||"").slice(0,10);
  // Gli ordini storici restano dov'erano: il gestionale non crea nuove cartelle per loro.
  return !created || created>=DROPBOX_ARCHIVE_START_DATE;
}

function jobDropboxArchiveDate(o){
  const d=o?.createdAt ? new Date(o.createdAt) : new Date();
  return Number.isNaN(d.getTime()) ? new Date() : d;
}

function dropboxWorkYearFolderName(year){
  // La struttura storica mostra 2024=7, 2025=8, 2026=9.
  const progressive=Math.max(1,Number(year)-2017);
  return `${progressive}. lavori per data - ${year}`;
}

function jobDropboxBasePath(o){
  const c=state.clients.find(x=>x.id===o.clientId);
  const cliente=dropboxSafePathPart(c?clientDisplayName(c):"Cliente");
  const d=jobDropboxArchiveDate(o);
  const year=d.getFullYear();
  const month=String(d.getMonth()+1).padStart(2,"0");
  return `/${dropboxWorkYearFolderName(year)}/${year} - ${month}/CLIENTI/${cliente}`;
}

function jobDropboxCurrentFolder(orderId){
  return jobDropboxUiState[orderId]?.folder || "FILE RICEVUTI";
}

function jobDropboxFileName(o,originalName,descriptionHint=""){
  const numero=dropboxSafePathPart(o?.numero||o?.id||"Ordine");
  const categorie=typeof orderCategorie==="function" ? orderCategorie(o).join(" ") : "";
  const descrizione=dropboxSafePathPart(o?.descrizione||descriptionHint||categorie||"Lavorazione").slice(0,80);
  const originale=dropboxSafePathPart(originalName||"file");
  const prefix=`${numero} - ${descrizione} - `;
  const maxOriginal=Math.max(30,220-prefix.length);
  return `${prefix}${originale.slice(0,maxOriginal)}`;
}

function renderJobDropboxBlock(o,c){
  if(!dropboxIsConnected()){
    return `
      <div class="job-dropbox-shell">
        <div class="job-dropbox-status error">

  return `

async function jobDropboxEnsureFolder(path){
  try{
    await dropboxApi("files/create_folder_v2",{path,autorename:false});
  }catch(err){
    const msg=String(err?.message||err||"");
    if(!msg.includes("conflict")) throw err;
  }
}

async function jobDropboxEnsureStructure(orderId){
  const o=findItem("orders",orderId);
  if(!o) throw new Error("Ordine non trovato");

  if(!jobDropboxUsesChronologicalArchive(o)) return null;

  const c=state.clients.find(x=>x.id===o.clientId);
  const cliente=dropboxSafePathPart(c?clientDisplayName(c):"Cliente");
  const d=jobDropboxArchiveDate(o);
  const year=d.getFullYear();
  const month=String(d.getMonth()+1).padStart(2,"0");
  const yearBase=`/${dropboxWorkYearFolderName(year)}`;
  const monthBase=`${yearBase}/${year} - ${month}`;
  const clientsBase=`${monthBase}/CLIENTI`;
  const base=`${clientsBase}/${cliente}`;

  await jobDropboxEnsureFolder(yearBase);
  await jobDropboxEnsureFolder(monthBase);
  await jobDropboxEnsureFolder(clientsBase);
  await jobDropboxEnsureFolder(base);
  for(const sub of JOB_DROPBOX_SUBFOLDERS){
    await jobDropboxEnsureFolder(`${base}/${sub}`);
  }
  return base;
}

async function jobDropboxInit(orderId){
  const status=document.getElementById(`jobDropboxStatus-${orderId}`);
  if(status){
    status.className="job-dropbox-status";
    status.textContent="Preparazione cartella Dropbox…";
  }
  try{
    if(!jobDropboxUsesChronologicalArchive(findItem("orders",orderId))) return;
    await jobDropboxEnsureStructure(orderId);
    if(status){
      status.className="job-dropbox-status ok";
      status.textContent="Cartella Dropbox pronta.";
    }
    await jobDropboxLoad(orderId,jobDropboxCurrentFolder(orderId));
  }catch(err){
    console.error("Dropbox ordine init",err);
    if(status){
      status.className="job-dropbox-status error";
      status.textContent="Errore Dropbox: "+(err?.message||"impossibile preparare la cartella");
    }
  }
}

function jobDropboxSelectFolder(orderId,folder){
  jobDropboxUiState[orderId]={...(jobDropboxUiState[orderId]||{}),folder};
  document.querySelectorAll(`#jobDropboxFolders-${CSS.escape(orderId)} .job-dropbox-folder`).forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.jobDropboxFolder===folder);
  });
  const dest=document.getElementById(`jobDropboxDest-${orderId}`);
  if(dest) dest.value=folder;
  jobDropboxLoad(orderId,folder);
}

async function jobDropboxLoad(orderId,folder){
  const o=findItem("orders",orderId);
  const box=document.getElementById(`jobDropboxFiles-${orderId}`);
  if(!o || !box) return;

  const selected=folder||"FILE RICEVUTI";
  const path=`${jobDropboxBasePath(o)}/${selected}`;
  box.innerHTML=`<div class="job-dropbox-empty">Caricamento…</div>`;

  try{
    const data=await dropboxApi("files/list_folder",{path,recursive:false,include_deleted:false});
    const files=(data.entries||[]).filter(x=>x[".tag"]==="file")
      .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"it"));

    if(!files.length){
      box.innerHTML=`<div class="job-dropbox-empty">Nessun file in “${escapeHtml(selected)}”.</div>`;
      return;
    }

    box.innerHTML=files.map(file=>{
      const pathLower=file.path_lower||file.path_display||"";
      const fileRef=file.id||pathLower;
      const safePath=encodeURIComponent(fileRef);
      const safeName=encodeURIComponent(file.name||"file");
      return `
        <div class="job-dropbox-file">
          <div style="min-width:0;">
            <div class="job-dropbox-file-name">📄 ${escapeHtml(file.name||"")}</div>
            <div class="job-dropbox-file-meta">${dropboxFormatBytes(file.size)}${file.client_modified?` · ${new Date(file.client_modified).toLocaleString("it-IT")}`:""}</div>
          </div>
          <div>
            <button class="btn btn-outline btn-sm" onclick="completedSheetPreviewDropboxFile('${safePath}','${safeName}')">Visualizza</button>
            <button class="btn btn-outline btn-sm" onclick="jobDropboxDownloadEncoded('${safePath}','${safeName}')">Scarica</button>
          </div>
        </div>`;
    }).join("");
  }catch(err){
    console.error("Dropbox ordine list",err);
    box.innerHTML=`<div class="job-dropbox-empty" style="color:var(--danger);">Errore nel caricamento dei file.</div>`;
  }
}

function jobDropboxRefresh(orderId){
  jobDropboxLoad(orderId,jobDropboxCurrentFolder(orderId));
}

function jobDropboxToggleUpload(orderId){
  document.getElementById(`jobDropboxUpload-${orderId}`)?.classList.toggle("open");
}

async function jobDropboxUpload(orderId){
  const o=findItem("orders",orderId);
  const input=document.getElementById(`jobDropboxFile-${orderId}`);
  const dest=document.getElementById(`jobDropboxDest-${orderId}`);
  const file=input?.files?.[0];
  if(!o || !file){ showToast("Scegli un file da caricare"); return; }

  const folder=dest?.value||"FILE RICEVUTI";
  const token=dropboxToken();
  if(!token){ showToast("Dropbox non collegato"); return; }

  const finalName=jobDropboxFileName(o,file.name);
  const path=`${jobDropboxBasePath(o)}/${folder}/${finalName}`;
  try{
    const res=await fetch("https://content.dropboxapi.com/2/files/upload",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+token,
        "Content-Type":"application/octet-stream",
        "Dropbox-API-Arg":JSON.stringify({path,mode:"add",autorename:true,mute:false,strict_conflict:false})
      },
      body:file
    });
    const raw=await res.text();
    if(!res.ok) throw new Error(raw||"Upload non riuscito");

    input.value="";
    jobDropboxUiState[orderId]={...(jobDropboxUiState[orderId]||{}),folder};
    jobDropboxSelectFolder(orderId,folder);
    showToast(`File caricato in ${folder}`);
  }catch(err){
    console.error("Dropbox ordine upload",err);
    showToast("Errore upload Dropbox");
  }
}

function jobDropboxDownloadEncoded(pathEncoded,nameEncoded){
  dropboxDownloadFile(decodeURIComponent(pathEncoded),decodeURIComponent(nameEncoded));
}

function orderRecentArchiveTime(o){
  // Per gli ordini già consegnati usiamo il dato temporale più vicino alla chiusura
  // disponibile nel gestionale, senza aggiungere nuovi campi al database.
  const candidates = [o?.avvisatoIl, o?.dataConsegna, o?.createdAt].filter(Boolean);
  for(const raw of candidates){
    const t = Date.parse(raw);
    if(Number.isFinite(t)) return t;
  }
  return 0;
}
