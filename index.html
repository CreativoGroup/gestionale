<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale — Agenzia Grafica &amp; Stampa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1C2A4A; --paper:#F4F6F7; --card:#FFFFFF;
    --sidebar-bg:#FFFFFF; --sidebar-hover:#F1F3F5;
    --accent:#E8552F; --accent-dark:#C6431F; --teal:#1F7A8C; --text:#1C2430;
    --muted:#6B7280; --border:#DDE2E5; --ok:#2E7D4F; --warn:#B8860B; --danger:#C0392B;
    --radius-card:10px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  #app{display:flex;min-height:100vh;}
  aside.sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);color:var(--text);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-size:19px;font-weight:700;color:var(--text);padding:6px 8px 2px;}
  .brand small{display:block;font-family:'Inter';font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
  .brand-logo{padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .brand-logo img{width:100%;height:auto;display:block;}
  .brand-logo small{display:block;font-family:'Inter';font-weight:500;font-size:11.5px;color:var(--muted);margin-top:8px;letter-spacing:.2px;}
  .stat.clickable{cursor:pointer;transition:border-color .15s, transform .1s;}
  .stat.clickable:hover{border-color:var(--accent);}
  .stat.clickable:active{transform:scale(.99);}
  .modal-section{background:var(--paper);border-radius:10px;padding:20px 22px;margin:20px 0;border-left:4px solid var(--accent);}
  .modal-section h3{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--text);}
  .modal p, .modal .field label, .modal .ticket-meta{font-size:15px;}
  .modal{font-size:15.5px;line-height:1.55;}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;}
  .list-row:hover{border-color:var(--accent);}
  .list-row .lr-main{font-weight:600;font-size:13.5px;}
  .list-row .lr-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  nav.tabs{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
  nav.tabs button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;}
  nav.tabs button:hover{background:var(--sidebar-hover);color:var(--text);}
  nav.tabs button.active{background:var(--accent);color:#fff;}
  nav.tabs .icon{width:18px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--muted);line-height:1.5;}
  main{flex:1;min-width:0;padding:26px 30px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:22px;margin:0 0 4px;}
  .topbar p{margin:0;color:var(--muted);font-size:14px;}
  .btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--accent);}
  .btn-outline:hover{border-color:var(--accent);background:#FFF3EE;}
  .btn-ghost{color:var(--muted);padding:6px 8px;font-weight:500;}
  .btn-ghost:hover{color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  section.view{display:none;}
  section.view.active{display:block;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-auto{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;}
  .stat .stat-label{font-size:12.5px;color:var(--muted);margin:0 0 6px;}
  .stat .stat-value{font-size:24px;font-weight:700;font-family:'Space Grotesk';}
  .stat .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable-row{cursor:pointer;}
  tr.clickable-row:hover{background:var(--paper);}
  .star{cursor:pointer;font-size:16px;color:var(--border);user-select:none;}
  .star.active{color:#F1C40F;text-shadow:0 0 0 #F1C40F;}
  .star:hover{color:var(--accent);}
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);}
  .pill{display:inline-block;padding:3px 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;white-space:nowrap;}
  .pill-todo{background:#F2F2F0;color:#6B6B63;border:1px solid var(--border);}
  .pill-lavorazione{background:#FBE1DA;color:var(--danger);}
  .pill-produzione{background:#FCF3CF;color:#8A6D0B;}
  .pill-done{background:#DFF0E4;color:var(--ok);}
  .pill-delivered{background:#E3E7F0;color:#3D4A78;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.15);}
  .riga-dot{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--border);margin-right:4px;vertical-align:middle;font-size:10px;line-height:1;opacity:.45;transition:opacity .15s;}
  .riga-dot:hover{opacity:.8;}
  .riga-dot.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);opacity:1;}
  .pill-open{background:#FBE1DA;color:var(--danger);}
  .pill-accepted{background:#DFF0E4;color:var(--ok);}
  .pill-sent{background:#DDEAF3;color:var(--teal);}
  .pill-draft{background:#EDEDED;color:var(--muted);}
  .pill-refused{background:#FBE1DA;color:var(--danger);}
  .pill-business{background:#DCE7F5;color:#1D5A9E;}
  .pill-family{background:#FBE7CC;color:#B9660C;}
  .client-dot-business{background:#1D5A9E;}
  .client-dot-family{background:#D9820A;}
  .form-panel{background:var(--card);border:1px dashed var(--accent);border-radius:var(--radius-card);padding:18px;margin-bottom:18px;display:none;}
  .form-panel.open{display:block;}
  .form-panel h3{margin:0 0 14px;font-size:15px;}
  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:800px){.form-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field input, .field select, .field textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--paper);color:var(--text);}
  .field textarea{resize:vertical;min-height:56px;}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .checkfield{display:flex;align-items:center;gap:9px;font-size:15px;}
  .checkfield input{width:16px;height:16px;}
  .form-actions{margin-top:14px;display:flex;gap:10px;}
  select.inline{border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:12.5px;padding:5px 8px;border-radius:6px;font-family:inherit;}
  input.inline{border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:12.5px;padding:5px 8px;border-radius:6px;font-family:inherit;}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
  .kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;}
  @media(max-width:1100px){.kanban{grid-template-columns:repeat(5,260px);}}
  .kanban-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:10px;min-width:210px;}
  .kanban-col h4{margin:2px 6px 10px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;}
  .job-card{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;border-top:3px dashed var(--accent);font-size:12.5px;cursor:pointer;}
  .job-card:hover{border-color:var(--accent);}
  .job-card .jc-client{font-weight:700;font-size:13px;margin-bottom:2px;}
  .job-card .jc-cat{color:var(--teal);font-size:11.5px;font-weight:600;margin-bottom:6px;}
  .job-card .jc-lines{margin-bottom:6px;}
  .job-card .jc-line{color:var(--teal);font-size:11.5px;font-weight:600;line-height:1.5;}
  .job-card .jc-meta{color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;margin-top:6px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:50;overflow-y:auto;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;max-width:760px;width:100%;padding:30px;position:relative;margin-bottom:40px;}
  .modal h2{margin:0 0 4px;font-size:24px;font-weight:700;}
  .modal h3{font-size:17px;font-weight:700;margin:20px 0 10px;}
  .modal .close-x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:24px;background:none;border:none;}
  .modal .btn{font-size:14.5px;padding:11px 20px;}
  .modal .btn-sm{font-size:13px;padding:7px 13px;}
  .ticket-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin:16px 0 20px;font-size:15px;font-weight:600;}
  .ticket-meta div span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
  .steps{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .step-row{display:flex;align-items:center;gap:12px;font-size:15px;padding:9px 12px;border-radius:7px;background:var(--card);}
  .step-row input{width:16px;height:16px;}
  .step-row.done label{color:var(--muted);}
  .fasi-group-title{font-size:13.5px;font-weight:700;color:var(--teal);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.3px;}
  .fasi-group-title:first-child{margin-top:0;}
  .low-stock{color:var(--danger);font-weight:700;}
  .demo-tag{background:var(--accent);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:80;}
  .toast.show{opacity:1;transform:translateY(0);}
  a.link{color:var(--teal);text-decoration:none;font-weight:600;}
  .helptext{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:14px;line-height:1.5;}
  .lines-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  .lines-table th{font-size:12px;padding:6px 7px;}
  .lines-table td{padding:6px 7px;border-bottom:none;}
  .lines-table input{width:100%;padding:7px 8px;font-size:14px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .lines-table .num{width:78px;}
  .lines-table .desc-input{min-width:240px;}
  .totals-box{background:var(--card);border-radius:8px;padding:14px 18px;margin:12px 0 16px;font-size:15px;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:4px 0;}
  .totals-box .trow.grand{font-weight:700;font-size:19px;border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}
  .pay-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .pay-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:6px;padding:9px 12px;font-size:14.5px;}
</style>
</head>

let state = loadState();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function migrateState(data){
  if(!data.appuntamenti) data.appuntamenti = [];
  if(!data.expenses) data.expenses = [];
  if(!data.entrate) data.entrate = [];
  (data.clients||[]).forEach(c=>{
    ["indirizzo","citta","cap","provincia","partitaIva","codiceFiscale","pec"].forEach(k=>{ if(c[k]===undefined) c[k]=""; });
  });
  (data.orders||[]).forEach(o=>{
    if(o.worker === undefined) o.worker = "";
    if(o.worker === "Francesca") o.worker = "Francess";
    if(o.stato === "In revisione") o.stato = "In produzione";
    if(o.importante === undefined) o.importante = false;
    if(o.sconto === undefined) o.sconto = 0;
    if(o.costoSpedizione === undefined) o.costoSpedizione = 0;
    if(o.clienteAvvisato === undefined) o.clienteAvvisato = false;
    (o.righe||[]).forEach(r=>{
      if(r.stato === undefined) r.stato = "Da fare";
    });
    recalcFasi(o);
  });
  return data;
}
function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return migrateState(JSON.parse(raw)); }
  catch(e){ console.error("Errore lettura storage", e); }
  return seedDemoData();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("Errore salvataggio storage", e); showToast("Errore nel salvataggio dei dati"); }
}
function today(){ return new Date().toISOString().slice(0,10); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function currentMonth(){ return today().slice(0,7); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function fmtMoney(n){ return (Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"}); }

function clientDisplayName(c){ if(!c) return "—"; return c.tipo==="Business" ? c.ragioneSociale : `${c.nome||""} ${c.cognome||""}`.trim(); }

/* ============ HELPER RIGHE / TOTALI ============ */
function righeTotale(righe){ return (righe||[]).reduce((s,r)=> s + (Number(r.quantita)||0)*(Number(r.prezzoUnitario)||0), 0); }
function quoteImponibile(q){ return righeTotale(q.righe); }
function orderImponibile(o){ return righeTotale(o.righe); }
function orderSpedizioneCosto(o){ return o.consegnaTipo==="Spedizione" ? (Number(o.costoSpedizione)||0) : 0; }
function orderIva(o){ return o.ivaApplicata ? (orderImponibile(o) + orderSpedizioneCosto(o)) * 0.22 : 0; }
function orderTotale(o){ const base = orderImponibile(o) + orderSpedizioneCosto(o) + orderIva(o) - (Number(o.sconto)||0); return Math.max(0, base); }
function orderIncassato(o){ return state.payments.filter(p=>p.orderId===o.id).reduce((s,p)=>s+Number(p.importo),0); }
function orderSaldo(o){ return orderTotale(o) - orderIncassato(o); }
function paymentsTotaleMese(mese){ return state.payments.filter(p=>p.data.slice(0,7)===mese).reduce((s,p)=>s+Number(p.importo),0); }
function entrateTotaleMese(mese){ return (state.entrate||[]).filter(e=>e.data.slice(0,7)===mese).reduce((s,e)=>s+Number(e.importo),0); }
function speseTotaleMese(mese){ return state.expenses.filter(e=>e.data.slice(0,7)===mese).reduce((s,e)=>s+Number(e.importo),0); }

/* Ricalcola le fasi di lavorazione in base alle categorie presenti nelle righe, preservando lo stato delle spunte già fatte */
function recalcFasi(order){
  const cats = [...new Set((order.righe||[]).map(r=>r.categoria).filter(Boolean))];
  const existing = order.fasi || [];
  const fasi = [];
  cats.forEach(cat=>{
    (STEP_TEMPLATES[cat]||[]).forEach(nome=>{
      const key = cat+"__"+nome;
      const prev = existing.find(f=>f.key===key);
      fasi.push({key, categoria:cat, nome, completata: prev ? prev.completata : false});
    });
  });
  order.fasi = fasi;
}
function orderCategorie(o){ return [...new Set((o.righe||[]).map(r=>r.categoria).filter(Boolean))]; }
function orderCategorieLabel(o){ const c = orderCategorie(o); return c.length ? c.join(", ") : "—"; }
function orderWorkersList(o){ return o.worker ? [o.worker] : []; }
function orderWorkersLabel(o){ return o.worker || "non assegnato"; }

function mkOrder(id, clientId, descrizione, worker, stato, dataConsegna, righe, consegnaTipo){
  const order = {id, clientId, descrizione, worker, stato, dataConsegna,
    righe: (righe && righe.length) ? righe : [emptyRiga(true)],
    ivaApplicata:false, daFatturare:true, importante:false, sconto:0, costoSpedizione:0, clienteAvvisato:false,
    consegnaTipo: consegnaTipo || "Ritiro in sede", spedito:false,
    fasi: [], note:""};
  recalcFasi(order);
  return order;
}

  const action = _pendingConfirmAction;

function addAppuntamento(){
  const titolo = document.getElementById("af-titolo").value.trim();
  if(!titolo){ showToast("Inserisci un titolo per l'appuntamento"); return; }
  state.appuntamenti.push({
    id:uid(), titolo,
    clientId: document.getElementById("af-cliente").value || null,
    data: document.getElementById("af-data").value || today(),
    ora: document.getElementById("af-ora").value || "09:00",
    note:""
  });
  saveState(); toggleForm('apptForm'); renderDashboard(); showToast("Appuntamento salvato");
}
function deleteAppuntamento(id){
  askConfirm("Eliminare questo appuntamento?", ()=>{
    state.appuntamenti = state.appuntamenti.filter(a=>a.id!==id); saveState(); renderDashboard();
  });

function openDashboardList(type){
  const configs = {
    attivi: {title:"Ordini attivi", items: state.orders.filter(o=>o.stato!=="Consegnato" && o.stato!=="Completato")},
    completati: {title:"Completati da consegnare", items: state.orders.filter(o=>o.stato==="Completato")},
    spedire: {title:"Ordini da spedire", items: state.orders.filter(o=>o.consegnaTipo==="Spedizione" && !o.spedito && o.stato!=="Consegnato")},
    fatturare: {title:"Schede da fatturare", items: state.orders.filter(o=>o.daFatturare)},
    importanti: {title:"Ordini importanti", items: state.orders.filter(o=>o.importante && o.stato!=="Consegnato")},
    materiale: {title:"Materiale da ordinare", items: state.orders.filter(o=>o.stato!=="Consegnato" && o.fasi.some(f=>f.nome==="Materiale da ordinare" && !f.completata))},
    avvisare: {title:"Cliente da avvisare", items: state.orders.filter(o=>o.stato==="Completato" && !o.clienteAvvisato)},
    preventivi: {title:"Preventivi in attesa", items: state.quotes.filter(q=>q.stato==="Bozza"||q.stato==="Inviato"), isQuote:true},
    scorte: {title:"Articoli sotto scorta", items: state.warehouse.filter(w=>Number(w.quantita)<=Number(w.scortaMinima)), isStock:true}
  };
  const cfg = configs[type];
  let rows;
  if(cfg.isStock){
    rows = cfg.items.map(w=>`
      <div class="list-row" onclick="closeModal(); goTo('magazzino');">
        <div><div class="lr-main">${w.nome}</div><div class="lr-sub">${w.categoria}</div></div>
        <div class="lr-sub low-stock">${w.quantita} ${w.unita} (min. ${w.scortaMinima})</div>
      </div>`).join("");
  } else if(cfg.isQuote){
    rows = cfg.items.map(q=>`
      <div class="list-row" onclick="openQuoteDetail('${q.id}')">
        <div><div class="lr-main">${clientName(q.clientId)}</div><div class="lr-sub">${q.categoria} — ${fmtMoney(quoteImponibile(q))}</div></div>
        <span class="pill ${QUOTE_CLASS[q.stato]}">${q.stato}</span>
      </div>`).join("");
  } else {
    rows = cfg.items.map(o=>`
      <div class="list-row" onclick="openJobCard('${o.id}')">
        <div><div class="lr-main">${clientName(o.clientId)}</div><div class="lr-sub">${orderCategorieLabel(o)} — ${orderWorkersLabel(o)} — ${fmtDate(o.dataConsegna)}</div></div>
        <span class="pill ${STATUS_CLASS[o.stato]}">${statusDot(o.stato)}${o.stato}</span>
      </div>`).join("");
  }
  document.getElementById("modalBody").innerHTML = `
    <button class="close-x" onclick="closeModal()">×</button>
    <h2>${cfg.title}</h2>
    <p style="color:var(--muted);margin-top:0;">${cfg.items.length} elemento/i — clicca per aprire la scheda</p>
    <div style="margin-top:14px;">${rows || `<p class="empty">Nessun elemento.</p>`}</div>
  `;
  document.getElementById("modalBackdrop").classList.add("open");
}
function isDemo(text){ return typeof text === "string" && text.includes("[DEMO]"); }
function clearAllOrders(){
  askConfirm(`Eliminare TUTTI gli ordini e le schede di lavorazione (${state.orders.length} in totale)? Verranno rimossi anche gli incassi collegati. Clienti, preventivi, magazzino, spese ed entrate non vengono toccati.`, ()=>{
    state.orders = [];
    state.payments = [];
    saveState(); renderCurrentView();
    showToast("Tutti gli ordini sono stati eliminati");
  });
}
function removeDemoData(){
  askConfirm("Rimuovere tutti i clienti, ordini, preventivi, movimenti e appuntamenti demo (contrassegnati [DEMO])? I tuoi dati reali non verranno toccati.", ()=>{
    const demoClientIds = new Set(state.clients.filter(c=>isDemo(c.ragioneSociale)||isDemo(c.nome)||isDemo(c.cognome)).map(c=>c.id));
    state.clients = state.clients.filter(c=>!demoClientIds.has(c.id));
    state.quotes = state.quotes.filter(q=>!isDemo(q.descrizione) && !demoClientIds.has(q.clientId));
    state.orders = state.orders.filter(o=>!isDemo(o.descrizione) && !demoClientIds.has(o.clientId));
    const remainingOrderIds = new Set(state.orders.map(o=>o.id));
    state.payments = state.payments.filter(p=>remainingOrderIds.has(p.orderId));
    state.warehouse = state.warehouse.filter(w=>!isDemo(w.nome));
    state.expenses = state.expenses.filter(e=>!isDemo(e.descrizione));
    state.entrate = (state.entrate||[]).filter(e=>!isDemo(e.descrizione));
    state.appuntamenti = (state.appuntamenti||[]).filter(a=>!isDemo(a.titolo));
    saveState(); renderCurrentView();
    showToast("Dati demo rimossi");
  });
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `gestionale-backup-${today()}.json`; a.click(); URL.revokeObjectURL(url);
  showToast("Backup esportato");
}
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data.clients || !data.orders) throw new Error("formato non valido");
      state = migrateState(data); saveState(); renderCurrentView(); showToast("Backup importato");
    }catch(err){ showToast("File non valido"); }
  };
  reader.readAsText(file);
}

/* Legge i campi anagrafici comuni (indirizzo, città, piva, ecc.) da un dato prefisso */
function readCommonClientFields(prefix){
  return {
    indirizzo: document.getElementById(`${prefix}-indirizzo`).value.trim(),
    citta: document.getElementById(`${prefix}-citta`).value.trim(),
    cap: document.getElementById(`${prefix}-cap`).value.trim(),
    provincia: document.getElementById(`${prefix}-provincia`).value.trim().toUpperCase(),
    partitaIva: document.getElementById(`${prefix}-piva`).value.trim(),
    codiceFiscale: document.getElementById(`${prefix}-cf`).value.trim(),
    pec: document.getElementById(`${prefix}-pec`).value.trim()
  };
}
/* Crea (o aggiorna, se existingId è passato) un cliente leggendo i campi con un dato prefisso. Ritorna l'id o null se non valido. */
function createClientFromPrefix(prefix, existingId){
  const tipo = document.getElementById(`${prefix}-tipo`).value;
  const telefono = document.getElementById(`${prefix}-telefono`).value.trim();
  const email = document.getElementById(`${prefix}-email`).value.trim();
  if(!telefono && !email){ showToast("Inserisci almeno telefono o email"); return null; }
  const comuni = readCommonClientFields(prefix);
  let payload;
  if(tipo==="Business"){
    const ragioneSociale = document.getElementById(`${prefix}-ragsoc`).value.trim();
    const settore = document.getElementById(`${prefix}-settore`).value;
    if(!ragioneSociale){ showToast("Inserisci il nome dell'azienda"); return null; }
    if(!settore){ showToast("Il settore è obbligatorio per i clienti Business"); return null; }
    payload = {tipo, ragioneSociale, refNome:document.getElementById(`${prefix}-refnome`).value.trim(), refCognome:document.getElementById(`${prefix}-refcognome`).value.trim(), settore, telefono, email, ...comuni};
  } else {
    const nome = document.getElementById(`${prefix}-nome`).value.trim();
    if(!nome){ showToast("Inserisci il nome della persona"); return null; }
    payload = {tipo, nome, cognome:document.getElementById(`${prefix}-cognome`).value.trim(), telefono, email, ...comuni};
  }
  if(existingId){
    const c = findItem('clients', existingId);
    Object.assign(c, payload);
    saveState(); return existingId;
  } else {
    const id = uid();
    state.clients.push({id, ...payload});
    saveState(); return id;
  }
}

/* ============ IMPORT CSV CLIENTI ============ */
function parseCsvLine(line){
  const out = []; let cur = ""; let inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
function parseClientsCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const rows = lines.map(parseCsvLine);
  const headerIdx = rows.findIndex(r => r.some(c=>c.trim().toLowerCase()==="ragione sociale"));
  if(headerIdx === -1){ showToast("Formato CSV non riconosciuto: manca la colonna 'Ragione sociale'"); return []; }
  const header = rows[headerIdx].map(h=>h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const cRagSoc=idx("ragione sociale"), cNome=idx("nome"), cCognome=idx("cognome"), cTipologia=idx("tipologia"),
        cIndirizzo=idx("indirizzo"), cComune=idx("comune"), cCap=idx("cap"), cProvincia=idx("provincia"),
        cPiva=idx("partita iva"), cCf=idx("codice fiscale"), cCell=idx("cellulare"), cTel=idx("telefono"),
        cEmail=idx("email"), cPec=idx("pec");
  const get = (r,i) => (i>=0 && r[i]!==undefined) ? r[i].trim() : "";
  const clients = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r.some(c=>c.trim())) continue;
    const ragsoc = get(r,cRagSoc).replace(/^:\s*/,"");
    const nome = get(r,cNome), cognome = get(r,cCognome);
    if(!ragsoc && !nome && !cognome) continue;
    const tipologia = get(r,cTipologia);
    const tipo = (tipologia==="Privato" || tipologia==="Persona fisica titolare di Partita IVA") ? "Family" : "Business";
    const common = {
      telefono: get(r,cCell) || get(r,cTel), email: get(r,cEmail), settore:"",
      indirizzo: get(r,cIndirizzo), citta: get(r,cComune), cap: get(r,cCap), provincia: get(r,cProvincia),
      partitaIva: get(r,cPiva), codiceFiscale: get(r,cCf), pec: get(r,cPec),
      _importBatch: "csv_" + today()
    };
    if(tipo==="Business"){
      clients.push({id:uid(), tipo, ragioneSociale: ragsoc || `${nome} ${cognome}`.trim(), refNome:nome, refCognome:cognome, ...common});
    } else {
      clients.push({id:uid(), tipo, nome: nome || ragsoc, cognome, ...common});
    }
  }
  return clients;
}
function importProvidedClients(){
  const already = state.clients.some(c=>c._importBatch==="clienti_full_v1");
  if(already){ showToast("Questa lista è già stata importata"); return; }
  state.clients.push(...PROVIDED_CLIENTS.map(c=>({...c})));
  saveState(); toggleForm('importForm'); renderClienti();
  showToast(`${PROVIDED_CLIENTS.length} clienti importati`);
}
function handleClientCsvUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseClientsCsv(e.target.result);
    if(!parsed.length){ showToast("Nessun cliente valido trovato nel file"); return; }
    state.clients.push(...parsed);
    saveState(); toggleForm('importForm'); renderClienti();
    showToast(`${parsed.length} clienti importati`);
  };
  reader.readAsText(file, "UTF-8");
}

function duplicateOrder(orderId){
  const o = findItem('orders', orderId);
  const newRighe = o.righe.map(r=>({...r, id:uid()}));
  const clone = {
    ...JSON.parse(JSON.stringify(o)),
    id: uid(),
    righe: newRighe,
    stato: "Da fare",
    spedito: false,
    clienteAvvisato: false,
    note: o.note
  };
  clone.righe.forEach(r=>{ r.stato = "Da fare"; });
  clone.fasi = [];
  recalcFasi(clone);
  state.orders.push(clone);
  saveState();
  showToast("Scheda duplicata");
  openJobCard(clone.id);
}

/* ============ INCASSI / REPORT PAGAMENTI ============ */
let incassiFilters = {metodo:"", categoria:"", mese: currentMonth(), periodo:"mese"};
function periodKey(dateStr, period){
  if(period==='giorno') return dateStr;
  if(period==='settimana') return isoWeekKey(dateStr);
  if(period==='anno') return dateStr.slice(0,4);
  return dateStr.slice(0,7);
}
function isoWeekKey(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
  return `${d.getFullYear()}-W${String(weekNo).padStart(2,"0")}`;
}
const MESI_IT = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
function periodLabel(key, period){
  if(period==='mese'){ const [y,m] = key.split("-"); return `${MESI_IT[parseInt(m,10)-1]} ${y}`; }
  if(period==='giorno') return fmtDate(key);
  return key;
}
function orderOptionsForPayments(){ return state.orders.map(o=>`<option value="${o.id}">${clientName(o.clientId)} — ${orderCategorieLabel(o)} — ${fmtMoney(orderTotale(o))}</option>`).join(""); }
function paymentCategorieLabel(p){ const o = findItem('orders', p.orderId); return o ? orderCategorieLabel(o) : "—"; }
function paymentMatchesCategoria(p, cat){ if(!cat) return true; const o = findItem('orders', p.orderId); return o ? orderCategorie(o).includes(cat) : false; }
function renderIncassi(){

  const guadagnoStorico = totaleIncassato + totaleEntrateStorico - totaleSpeseStorico;
  const incassatoMeseCorrente = paymentsTotaleMese(currentMonth()) + entrateTotaleMese(currentMonth());
  const creditiAperti = state.orders.map(o=>({o, saldo:orderSaldo(o)})).filter(x=>x.saldo>0.001);
  const totaleCrediti = creditiAperti.reduce((s,x)=>s+x.saldo,0);

  const guadagno = (paymentsTotaleMese(f.mese) + entrateTotaleMese(f.mese)) - speseTotaleMese(f.mese);

  // Report aggregato per periodo (pagamenti ordine + entrate), filtrabile per modalità di pagamento
  const movimenti = [

  const gruppi = {};
  movimenti.forEach(m=>{ const k = periodKey(m.data, f.periodo); gruppi[k] = (gruppi[k]||0) + m.importo; });
  const righeReport = Object.keys(gruppi).sort((a,b)=>b.localeCompare(a)).map(k=>({key:k, totale:gruppi[k]}));

  document.getElementById("view-incassi").innerHTML = `

        </tbody>

        <thead><tr><th>Cliente</th><th>Categoria</th><th>Totale ordine</th><th>Saldo da incassare</th></tr></thead>
        <tbody>
          ${creditiAperti.length ? creditiAperti.map(x=>`<tr><td>${clientName(x.o.clientId)}</td><td>${orderCategorieLabel(x.o)}</td><td>${fmtMoney(orderTotale(x.o))}</td><td style="color:var(--danger);font-weight:600;">${fmtMoney(x.saldo)}</td></tr>`).join("") : `<tr><td colspan="4" class="empty">Nessun credito aperto.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function suggestPfImporto(){
  const o = findItem('orders', document.getElementById("pf-ordine").value);
  if(o) document.getElementById("pf-importo").value = Math.max(0, orderSaldo(o)).toFixed(2);
}
function addPayment(){
  const orderId = document.getElementById("pf-ordine").value;
  if(!orderId){ showToast("Crea prima almeno un ordine"); return; }
  const order = findItem('orders', orderId);
  const importo = Number(document.getElementById("pf-importo").value)||0;
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }
  state.payments.push({id:uid(), orderId, clientId:order.clientId,
    tipo:document.getElementById("pf-tipo").value, importo,
    data:document.getElementById("pf-data").value || today(), metodo:document.getElementById("pf-metodo").value});
  saveState(); toggleForm('paymentForm'); renderIncassi(); showToast("Incasso registrato");
}
function deletePayment(id){
  askConfirm("Eliminare questo incasso?", ()=>{
    state.payments = state.payments.filter(p=>p.id!==id); saveState(); renderIncassi();
  });
}

/* ============ SPESE ============ */
function renderSpese(){
  const totaleSpese = state.expenses.reduce((s,e)=>s+Number(e.importo),0);
  const speseMese = speseTotaleMese(currentMonth());
  const guadagnoMese = (paymentsTotaleMese(currentMonth()) + entrateTotaleMese(currentMonth())) - speseMese;
  document.getElementById("view-spese").innerHTML = `
    <div class="form-panel" id="expenseForm">
      <h3>Nuova spesa</h3>
      <div class="form-grid">
        <div class="field" style="grid-column:1/-1;"><label>Descrizione</label><input id="ef-descrizione" placeholder="Es. Acquisto materiale di consumo"></div>
        <div class="field"><label>Spesa sostenuta (€)</label><input id="ef-importo" type="number" min="0" step="0.01"></div>
        <div class="field"><label>Data</label><input id="ef-data" type="date" value="${today()}"></div>
        <div class="field"><label>Modalità di pagamento</label><select id="ef-metodo">${PAY_METHODS.map(m=>`<option>${m}</option>`).join("")}</select></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addExpense()">Salva spesa</button>
        <button class="btn btn-outline" onclick="toggleForm('expenseForm')">Annulla</button>
      </div>
    </div>
    <div class="grid grid-auto" style="margin-bottom:18px;">
      <div class="card stat"><p class="stat-label">Totale spese (storico)</p><p class="stat-value">${fmtMoney(totaleSpese)}</p></div>
      <div class="card stat"><p class="stat-label">Spese mese corrente</p><p class="stat-value">${fmtMoney(speseMese)}</p></div>
      <div class="card stat"><p class="stat-label">Guadagno netto mese corrente</p><p class="stat-value" style="${guadagnoMese<0?'color:var(--danger)':'color:var(--ok)'}">${fmtMoney(guadagnoMese)}</p><p class="stat-sub">incassi ordini + entrate − spese</p></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Descrizione</th><th>Importo</th><th>Metodo</th><th></th></tr></thead>
        <tbody>
          ${state.expenses.length ? [...state.expenses].sort((a,b)=>b.data.localeCompare(a.data)).map(e=>`
            <tr><td>${fmtDate(e.data)}</td><td>${e.descrizione}</td><td>${fmtMoney(e.importo)}</td><td>${e.metodo}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="deleteExpense('${e.id}')">Elimina</button></td></tr>
          `).join("") : `<tr><td colspan="5" class="empty">Nessuna spesa registrata.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function addExpense(){
  const descrizione = document.getElementById("ef-descrizione").value.trim();
  const importo = Number(document.getElementById("ef-importo").value)||0;
  if(!descrizione){ showToast("Inserisci una descrizione"); return; }
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }
  state.expenses.push({id:uid(), descrizione, importo, metodo:document.getElementById("ef-metodo").value, data:document.getElementById("ef-data").value||today()});
  saveState(); toggleForm('expenseForm'); renderSpese(); showToast("Spesa registrata");
}
function deleteExpense(id){
  askConfirm("Eliminare questa spesa?", ()=>{
    state.expenses = state.expenses.filter(e=>e.id!==id); saveState(); renderSpese();
  });
}

/* ============ ENTRATE ============ */
function renderEntrate(){
  const totaleEntrate = (state.entrate||[]).reduce((s,e)=>s+Number(e.importo),0);
  const entrateMese = entrateTotaleMese(currentMonth());
  document.getElementById("view-entrate").innerHTML = `
    <div class="form-panel" id="incomeForm">
      <h3>Nuova entrata</h3>
      <div class="form-grid">
        <div class="field" style="grid-column:1/-1;"><label>Descrizione</label><input id="if2-descrizione" placeholder="Es. Rimborso, vendita materiale usato..."></div>
        <div class="field"><label>Importo (€)</label><input id="if2-importo" type="number" min="0" step="0.01"></div>
        <div class="field"><label>Data</label><input id="if2-data" type="date" value="${today()}"></div>
        <div class="field"><label>Modalità di pagamento</label><select id="if2-metodo">${PAY_METHODS.map(m=>`<option>${m}</option>`).join("")}</select></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addEntrata()">Salva entrata</button>
        <button class="btn btn-outline" onclick="toggleForm('incomeForm')">Annulla</button>
      </div>
      <p class="helptext" style="margin-top:10px;">Le entrate qui registrate si sommano agli incassi degli ordini nel calcolo del guadagno netto.</p>
    </div>
    <div class="grid grid-auto" style="margin-bottom:18px;">
      <div class="card stat"><p class="stat-label">Totale entrate (storico)</p><p class="stat-value">${fmtMoney(totaleEntrate)}</p></div>
      <div class="card stat"><p class="stat-label">Entrate mese corrente</p><p class="stat-value">${fmtMoney(entrateMese)}</p></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Descrizione</th><th>Importo</th><th>Metodo</th><th></th></tr></thead>
        <tbody>
          ${(state.entrate||[]).length ? [...state.entrate].sort((a,b)=>b.data.localeCompare(a.data)).map(e=>`
            <tr><td>${fmtDate(e.data)}</td><td>${e.descrizione}</td><td style="color:var(--ok);font-weight:600;">+ ${fmtMoney(e.importo)}</td><td>${e.metodo}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="deleteEntrata('${e.id}')">Elimina</button></td></tr>
          `).join("") : `<tr><td colspan="5" class="empty">Nessuna entrata registrata.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function addEntrata(){
  const descrizione = document.getElementById("if2-descrizione").value.trim();
  const importo = Number(document.getElementById("if2-importo").value)||0;
  if(!descrizione){ showToast("Inserisci una descrizione"); return; }
  if(importo<=0){ showToast("Inserisci un importo valido"); return; }
  state.entrate.push({id:uid(), descrizione, importo, metodo:document.getElementById("if2-metodo").value, data:document.getElementById("if2-data").value||today()});
  saveState(); toggleForm('incomeForm'); renderEntrate(); showToast("Entrata registrata");
}
function deleteEntrata(id){
  askConfirm("Eliminare questa entrata?", ()=>{
    state.entrate = state.entrate.filter(e=>e.id!==id); saveState(); renderEntrate();
  });
}

/* ============ AVVIO ============ */
renderNav();
goTo("dashboard");
</script>
</body>
</html>
