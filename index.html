<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#E8552F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestionale">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Gestionale — Agenzia Grafica &amp; Stampa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1C2A4A; --paper:#F4F6F7; --card:#FFFFFF;
    --sidebar-bg:#FFFFFF; --sidebar-hover:#F1F3F5;
    --accent:#E8552F; --accent-dark:#C6431F; --teal:#1F7A8C; --text:#1C2430;
    --muted:#6B7280; --border:#DDE2E5; --ok:#2E7D4F; --warn:#B8860B; --danger:#C0392B;
    --radius-card:10px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  #app{display:flex;min-height:100vh;}
  aside.sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);color:var(--text);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-size:19px;font-weight:700;color:var(--text);padding:6px 8px 2px;}
  .brand small{display:block;font-family:'Inter';font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
  .brand-logo{padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .brand-logo img{width:100%;height:auto;display:block;}
  .brand-logo small{display:block;font-family:'Inter';font-weight:500;font-size:11.5px;color:var(--muted);margin-top:8px;letter-spacing:.2px;}
  .stat.clickable{cursor:pointer;transition:border-color .15s, transform .1s;}
  .stat.clickable:hover{border-color:var(--accent);}
  .stat.clickable:active{transform:scale(.99);}
  .modal-section{background:var(--paper);border-radius:10px;padding:20px 22px;margin:20px 0;border-left:4px solid var(--accent);}
  .modal-section h3{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--text);}
  .modal p, .modal .field label, .modal .ticket-meta{font-size:15px;}
  .modal{font-size:16.5px;line-height:1.6;}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;}
  .list-row:hover{border-color:var(--accent);}
  .list-row .lr-main{font-weight:600;font-size:13.5px;}
  .list-row .lr-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  nav.tabs{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
  nav.tabs button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;}
  nav.tabs button:hover{background:var(--sidebar-hover);color:var(--text);}
  nav.tabs button.active{background:var(--accent);color:#fff;}
  nav.tabs .icon{width:18px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--muted);line-height:1.5;}
  main{flex:1;min-width:0;padding:26px 30px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;position:relative;z-index:100;}
  .global-search{flex:1;max-width:320px;position:relative;z-index:110;}
  .global-search input{width:100%;padding:10px 14px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;}
  .global-search-dropdown{display:none;position:fixed;right:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 18px 45px rgba(20,29,43,.22);max-height:320px;overflow-y:auto;z-index:9999;}
  .gsd-item{padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);}
  .gsd-item:last-child{border-bottom:none;}
  .gsd-item:hover{background:var(--paper);color:var(--accent);}
  .gsd-empty{padding:12px 14px;font-size:13px;color:var(--muted);}
  .topbar h1{font-size:22px;margin:0 0 4px;}
  .topbar p{margin:0;color:var(--muted);font-size:14px;}
  .btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--accent);}
  .btn-outline:hover{border-color:var(--accent);background:#FFF3EE;}
  .btn-ghost{color:var(--muted);padding:6px 8px;font-weight:500;}
  .btn-ghost:hover{color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  section.view{display:none;}
  section.view.active{display:block;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-auto{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;}
  .stat .stat-label{font-size:12.5px;color:var(--muted);margin:0 0 6px;}
  .stat .stat-value{font-size:24px;font-weight:700;font-family:'Space Grotesk';}
  .stat .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable-row{cursor:pointer;}
  tr.clickable-row:hover{background:var(--paper);}
  .star{cursor:pointer;font-size:16px;color:var(--border);user-select:none;}
  .star.active{color:#F1C40F;text-shadow:0 0 0 #F1C40F;}
  .star:hover{color:var(--accent);}
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);}
  .pill{display:inline-block;padding:3px 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;white-space:nowrap;}
  .pill-todo{background:#F2F2F0;color:#6B6B63;border:1px solid var(--border);}
  .pill-lavorazione{background:#FBE1DA;color:var(--danger);}
  .pill-produzione{background:#FCF3CF;color:#8A6D0B;}
  .pill-done{background:#DFF0E4;color:var(--ok);}
  .pill-delivered{background:#E3E7F0;color:#3D4A78;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.15);}
  .riga-status-select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;min-width:130px;}
  .desc-lavoro{width:100%;min-height:280px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:16px;font-family:inherit;resize:vertical;}
  .desc-lavoro:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .pill-open{background:#FBE1DA;color:var(--danger);}
  .pill-accepted{background:#DFF0E4;color:var(--ok);}
  .pill-sent{background:#DDEAF3;color:var(--teal);}
  .pill-draft{background:#EDEDED;color:var(--muted);}
  .pill-refused{background:#FBE1DA;color:var(--danger);}
  .pill-business{background:#DCE7F5;color:#1D5A9E;}
  .pill-family{background:#FBE7CC;color:#B9660C;}
  .client-dot-business{background:#1D5A9E;}
  .client-dot-family{background:#D9820A;}
  .form-panel{background:var(--card);border:1px dashed var(--accent);border-radius:var(--radius-card);padding:18px;margin-bottom:18px;display:none;}
  .form-panel.open{display:block;}
  .form-panel h3{margin:0 0 14px;font-size:15px;}
  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:800px){.form-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field input, .field select, .field textarea{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--paper);color:var(--text);}
  #clientForm{padding:26px;}
  #clientForm h3{font-size:19px;margin-bottom:20px;}
  #clientForm .field label{font-size:14px;}
  #clientForm .field input, #clientForm .field select{font-size:16px;padding:12px 14px;}
  #clientForm .form-grid{gap:16px;}
  .field textarea{resize:vertical;min-height:56px;}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .checkfield{display:flex;align-items:center;gap:9px;font-size:15px;}
  .checkfield input{width:16px;height:16px;}
  .form-actions{margin-top:14px;display:flex;gap:10px;}
  select.inline{border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:12.5px;padding:5px 8px;border-radius:6px;font-family:inherit;}
  input.inline{border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:12.5px;padding:5px 8px;border-radius:6px;font-family:inherit;}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
  .kanban{display:grid;grid-template-columns:repeat(4,minmax(300px,1fr));gap:18px;overflow-x:auto;padding:6px 2px 18px;}
  @media(max-width:1100px){.kanban{grid-template-columns:repeat(4,340px);}}
  .kanban-col{background:#EEF2F6;border:1px solid #DDE4EC;border-radius:18px;padding:14px;min-width:280px;box-shadow:0 8px 24px rgba(31,41,55,.05);}
  .kanban-col h4{margin:2px 2px 14px;padding:10px 12px;border-radius:12px;font-size:14px;color:#243142;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.15px;background:#fff;border:1px solid #E2E8F0;}
  .kanban-col h4 span{background:#F1F5F9;color:#475569;border-radius:999px;padding:2px 8px;font-size:12px;}
  .kanban-col[data-stage="todo"] h4{border-left:5px solid #64748B;}
  .kanban-col[data-stage="grafica"] h4{border-left:5px solid #3B82F6;}
  .kanban-col[data-stage="production"] h4{border-left:5px solid #F59E0B;}
  .kanban-col[data-stage="external"] h4{border-left:5px solid #10B981;}
  .job-card{background:#FFFFFF;border:1px solid #D9E1EA;border-radius:14px;padding:17px 16px;margin-bottom:14px;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.07);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .job-card.job-card-business,.job-card.job-card-family{border-top:1px solid #D9E1EA;}
  .job-card.job-card-cat-stampa{background:#EEF7FF;border-color:#CFE6FA;}
  .job-card.job-card-cat-ricamo{background:#FFF1F6;border-color:#F8D3E2;}
  .job-card.job-card-cat-servizio{background:#EAF7F1;border-color:#BEDFCF;}
  .job-card.job-card-cat-esterna{background:#F1FAEE;border-color:#D4EBCB;}
  .job-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,23,42,.11);border-color:#B8C5D4;}
  .job-card.job-card-importante{border:2px solid #F2B705;box-shadow:0 6px 18px rgba(242,183,5,.16);}
  .job-card .jc-star{color:#9A6700;font-size:12px;font-weight:800;letter-spacing:.4px;margin-bottom:8px;}
  .job-card .jc-client{font-weight:800;font-size:17px;line-height:1.25;margin-bottom:8px;color:#172033;}
  .job-card .jc-cat{color:#0F766E;font-size:13.5px;font-weight:700;margin-bottom:7px;}
  .job-card .jc-lines{margin-bottom:10px;}
  .job-card .jc-line{color:#0F6F7A;font-size:14px;font-weight:700;line-height:1.55;}
  .job-card .jc-desc{font-size:14px;color:var(--text);margin-bottom:9px;}
  .job-card .jc-meta{color:#64748B;font-size:13px;display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-weight:700;}
  .job-card .jc-bozza-wrap{margin:11px 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .job-card .jc-bozza-title{font-size:10px;font-weight:900;letter-spacing:.55px;color:#64748B;}
  .job-card .jc-bozza-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:900;letter-spacing:.15px;border:1px solid transparent;}
  .jc-bozza-none{background:#F1F5F9;color:#64748B;border-color:#CBD5E1!important;}
  .jc-bozza-mail{background:#E8F2FF;color:#1D4ED8;border-color:#BFDBFE!important;}
  .jc-bozza-mattia{background:#F3E8FF;color:#7E22CE;border-color:#D8B4FE!important;}
  .jc-bozza-wait{background:#FFF3D6;color:#9A6700;border-color:#F5D77A!important;}
  .jc-bozza-ok{background:#EAF8EF;color:#187A44;border-color:#B7E4C7!important;}
  .embedded-warehouse{margin:18px 0;padding:16px;border:1px solid #DDE5EE;border-radius:14px;background:#F8FAFC;}
  .additional-work-lines{margin-top:18px;padding-top:16px;border-top:1px solid #E2E8F0;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:100000;overflow-y:auto;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;max-width:1080px;width:100%;padding:32px;position:relative;margin-bottom:40px;}
  .modal h2{margin:0 0 4px;font-size:26px;font-weight:800;}
  .jobcard-eyebrow{margin:0;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .jobcard-flags{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .jobcard-flags .checkfield{font-size:13px;white-space:nowrap;gap:6px;}
  .ticket-meta-big{grid-template-columns:1fr 1fr 1fr;}
  .inline-big{font-size:19px !important;padding:13px 14px !important;font-weight:700;}
  input[type="date"].inline-big{font-size:22px !important;padding:16px 16px !important;}
  input[type="date"].inline-big::-webkit-calendar-picker-indicator{transform:scale(1.5);margin-left:8px;cursor:pointer;}
  .status-select-big{border:none;border-radius:7px;}
  @media(max-width:700px){.ticket-meta-big{grid-template-columns:1fr;}}
  .modal h3{font-size:18.5px;font-weight:800;margin:22px 0 12px;}
  .modal .close-x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:24px;background:none;border:none;}
  .modal .btn{font-size:14.5px;padding:11px 20px;}
  .modal .btn-sm{font-size:13px;padding:7px 13px;}
  .ticket-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin:16px 0 20px;font-size:16.5px;font-weight:700;}
  .ticket-meta div span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
  .steps{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .step-row{display:flex;align-items:center;gap:12px;font-size:15px;padding:9px 12px;border-radius:7px;background:var(--card);}
  .step-row input{width:16px;height:16px;}
  .step-row.done label{color:var(--muted);}
  .fasi-group-title{font-size:13.5px;font-weight:700;color:var(--teal);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.3px;}
  .fasi-group-title:first-child{margin-top:0;}
  .low-stock{color:var(--danger);font-weight:700;}
  .demo-tag{background:var(--accent);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:80;}
  .toast.show{opacity:1;transform:translateY(0);}
  a.link{color:var(--teal);text-decoration:none;font-weight:600;}
  .helptext{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:14px;line-height:1.5;}
  .lines-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  .lines-table th{font-size:14px;padding:8px 10px;}
  .lines-table td{padding:10px 10px;border-bottom:none;}
  .lines-table input{width:100%;padding:9px 10px;font-size:15px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .lines-table .num{width:78px;}
  .lines-table .desc-input{min-width:260px;font-weight:600;}
  .riga-categoria-select{width:100%;min-width:190px;padding:14px 14px;font-size:19px;font-weight:700;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .totals-box{background:var(--card);border-radius:8px;padding:14px 18px;margin:12px 0 16px;font-size:15px;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:4px 0;}
  .totals-box .trow.grand{font-weight:700;font-size:19px;border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}
  .pay-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .pay-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:6px;padding:9px 12px;font-size:14.5px;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:360px;}

  /* ============ MOBILE APP / PWA ============ */
  @media(max-width:760px){
    html,body{min-height:100%;overscroll-behavior-y:none;}
    body{
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      background:var(--paper);
    }
    #app{flex-direction:column;min-height:100dvh;}
    aside.sidebar{
      width:100%;height:auto;position:sticky;top:0;z-index:40;
      padding:8px 10px;border-right:none;border-bottom:1px solid var(--border);
      overflow:visible;background:var(--card);
    }
    .brand-logo{display:none;}
    nav.tabs{
      margin-top:0;flex-direction:row;gap:6px;overflow-x:auto;
      -webkit-overflow-scrolling:touch;padding:2px 0 6px;scrollbar-width:none;
    }
    nav.tabs::-webkit-scrollbar{display:none;}
    nav.tabs button{
      flex:0 0 auto;padding:10px 12px;font-size:12.5px;white-space:nowrap;
    }
    .sidebar-footer{display:none;}
    main{padding:14px 12px 34px;width:100%;}
    .topbar{align-items:stretch;margin-bottom:14px;gap:10px;}
    .topbar>div:first-child{width:100%;}
    .topbar h1{font-size:20px;}
    .global-search{order:3;max-width:none;width:100%;}
    #topbarActions{width:100%;display:flex;gap:8px;flex-wrap:wrap;}
    #topbarActions .btn{flex:1;justify-content:center;min-width:120px;}
    .grid-2,.grid-auto{grid-template-columns:1fr;}
    .card{padding:14px;}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{min-width:720px;}
    .modal-backdrop{padding:8px;align-items:flex-start;}
    .modal{padding:18px 14px 28px;border-radius:12px;max-width:none;}
    .modal h2{font-size:22px;padding-right:28px;}
    .ticket-meta,.ticket-meta-big{grid-template-columns:1fr;}
    .lines-table{min-width:760px;}
    .form-grid{grid-template-columns:1fr;}
    .field input,.field select,.field textarea{font-size:16px;}
    input.inline,select.inline{font-size:16px;}
    .btn{min-height:42px;}
    .kanban{grid-template-columns:repeat(4,84vw);}
    .toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center;}
  }


  /* ============ APP STYLE REFRESH ============ */
  :root{
    --menuWeight: 700;
    --headingWeight: 800;
  }
  h1,h2,h3,.section-title,.stat-value,.brand-title{font-weight:var(--headingWeight);}
  .btn{font-weight:700; letter-spacing:.01em;}
  .pill{font-weight:700;}

  /* ============ PREMIUM APP UI ============ */
  :root{

    --text:#1F2937;
    --muted:#6B7280;
    --border:#E7EBF0;
    --accent:#E85A32;

    --radius-xl:24px;
    --radius-lg:18px;
    --radius-md:14px;
  }

  body{
    background:
      radial-gradient(circle at top left, rgba(232,90,50,.05), transparent 30%),
      radial-gradient(circle at top right, rgba(41,98,255,.04), transparent 25%),

  .modal,
  .table-wrap,
  .list-row{

    box-shadow:var(--shadowSoft);
    border-radius:var(--radius-xl);
  }

  .card{padding:20px;}
  .modal{box-shadow:0 20px 50px rgba(20,29,43,.12);}

  input.inline,select.inline{
    border-radius:16px;

    font-weight:850;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  @media(max-width:760px){
    .mail-shell{display:block;}
    .mail-side{
      display:flex;
      gap:6px;
      overflow-x:auto;
      padding:8px;
      margin-bottom:10px;
      border-radius:16px;
    }
    .mail-side-title{display:none;}
    .mail-filter-btn{
      flex:0 0 auto;
      width:auto;
      white-space:nowrap;
      padding:9px 12px;
      min-height:40px;
    }
    .mail-account-card{padding:14px !important;}
    .mail-row{
      grid-template-columns:1fr auto;
      gap:5px 10px;
      padding:13px 12px;
    }
    .mail-from{
      grid-column:1;
      grid-row:1;
      font-size:13px;
    }
    .mail-date{
      grid-column:2;
      grid-row:1;
      font-size:10.5px;
    }
    .mail-main{
      grid-column:1 / -1;
      grid-row:2;
    }
    .mail-subject{font-size:14px;}
    .mail-snippet{
      font-size:12px;
      -webkit-line-clamp:2;
    }

  /* ============ POSTA: LETTURA EMAIL IN PANNELLO ============ */
  .mail-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,46%);gap:14px;align-items:start;}
  .mail-layout.no-reader{grid-template-columns:1fr;}
  .mail-reader{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadowTiny);min-height:420px;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:16px;}
  .mail-reader-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--border);padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .mail-reader-subject{font-size:18px;font-weight:900;line-height:1.25;margin-bottom:6px;}
  .mail-reader-meta{font-size:12px;color:var(--muted);line-height:1.55;}
  .mail-reader-close{border:0;background:#F5F6F8;width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:20px;flex:0 0 auto;}
  .mail-reader-body{padding:16px;}
  .mail-reader-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .mail-reader-actions .btn{min-height:38px;}
  .mail-body-mode{display:flex;gap:8px;margin-bottom:12px;}
  .mail-body-box{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff;line-height:1.55;overflow-wrap:anywhere;}
  .mail-body-html{width:100%;min-height:300px;border:0;background:#fff;}
  .mail-body-text{white-space:pre-wrap;font-family:inherit;font-size:14px;}
  .mail-attachments{margin-top:16px;}
  .mail-attachments h4{margin:0 0 10px;font-size:14px;}
  .mail-attachment{border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;background:#FAFBFC;}
  .mail-attachment-name{min-width:0;font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mail-attachment-meta{color:var(--muted);font-size:11px;margin-top:2px;}
  .mail-reader-loading,.mail-reader-error{padding:34px 20px;text-align:center;color:var(--muted);}
  .mail-reader-error{color:var(--danger);}
  .mail-row.selected{background:#FFF0EB !important;box-shadow:inset 4px 0 0 var(--accent);}
  @media(max-width:980px){
    .mail-layout{grid-template-columns:1fr;}
    .mail-reader{position:fixed;inset:0;z-index:180;max-height:none;border-radius:0;border:0;overflow:auto;}
    .mail-reader-head{padding-top:max(16px,env(safe-area-inset-top));}
    .mail-reader-body{padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  }


  /* ============ POSTA: RISPOSTA EMAIL ============ */
  .mail-reply-box{
    margin:14px 0 16px;
    border:1px solid var(--border);
    border-radius:16px;
    background:#FAFBFC;
    padding:14px;
  }
  .mail-reply-title{
    font-weight:900;
    font-size:14px;
    margin-bottom:10px;
  }
  .mail-reply-textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    border:1px solid #DDE3EA;
    border-radius:14px;
    background:#fff;
    padding:12px 14px;
    font:inherit;
    font-size:14px;
    line-height:1.5;
  }
  .mail-reply-textarea:focus,
  .mail-reply-option input:focus{
    outline:none;
    border-color:#F09B84;
    box-shadow:0 0 0 4px rgba(232,90,50,.10);

  .mail-reply-toolbar{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-top:10px;
  }
  .mail-reply-options{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .mail-reply-option{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .mail-reply-option.full{grid-column:1 / -1;}
  .mail-reply-option label{
    font-size:11.5px;
    color:var(--muted);
    font-weight:800;
  }
  .mail-reply-option input{
    width:100%;
    min-height:42px;
    border:1px solid #DDE3EA;
    border-radius:12px;
    background:#fff;
    padding:8px 10px;
    font:inherit;
    font-size:13px;
  }
  .mail-signature-note{
    margin-top:10px;
    font-size:11.5px;
    color:var(--muted);
  }
  .mail-send-status{
    margin-top:10px;
    font-size:12px;
    font-weight:750;
  }
  @media(max-width:760px){
    .mail-reply-options{grid-template-columns:1fr;}
    .mail-reply-option.full{grid-column:auto;}
  }


  #gmail-reply-file-input{
    width:100%;
    min-height:44px;
    border:1px solid #DDE3EA;
    border-radius:12px;
    font:inherit;
    font-size:12.5px;
  }


  /* ============ POSTA: CREA LEAD ============ */
  .lead-modal-backdrop{
    position:fixed; inset:0; z-index:9999;
    background:rgba(18,24,32,.48);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .lead-modal{
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.22);
    border:1px solid var(--border);
  }
  .lead-modal-head{
    display:flex; justify-content:space-between; gap:14px; align-items:flex-start;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:#fff; z-index:2;
  }
  .lead-modal-title{font-size:20px;font-weight:900;}
  .lead-modal-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .lead-modal-close{
    border:0;background:#F2F4F7;border-radius:10px;
    width:36px;height:36px;font-size:22px;cursor:pointer;
  }
  .lead-modal-body{padding:18px 20px 20px;}
  .lead-form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .lead-field{display:flex;flex-direction:column;gap:5px;}
  .lead-field.full{grid-column:1 / -1;}
  .lead-field label{
    font-size:11.5px;color:var(--muted);font-weight:800;
  }
  .lead-field input,.lead-field select,.lead-field textarea{
    width:100%;
    border:1px solid #DDE3EA;
    border-radius:12px;
    padding:10px 11px;
    font:inherit;
    font-size:13px;
    background:#fff;
  }
  .lead-field textarea{min-height:130px;resize:vertical;line-height:1.45;}
  .lead-field input:focus,.lead-field select:focus,.lead-field textarea:focus{
    outline:none;border-color:#F09B84;box-shadow:0 0 0 4px rgba(232,90,50,.10);
  }
  .lead-modal-actions{
    display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  }
  .lead-client-warning{
    margin-bottom:14px;
    padding:10px 12px;
    border-radius:12px;
    background:#FFF7E8;
    border:1px solid #F3D49A;
    font-size:12.5px;
  }
  @media(max-width:700px){
    .lead-modal-backdrop{padding:0;align-items:stretch;}
    .lead-modal{width:100%;max-height:none;height:100%;border-radius:0;}
    .lead-form-grid{grid-template-columns:1fr;}
    .lead-field.full{grid-column:auto;}
  }


  /* ============ SEZIONE LEAD ============ */
  .lead-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .lead-stat{padding:14px 16px;border:1px solid var(--border);border-radius:16px;background:#fff;}
  .lead-stat strong{display:block;font-size:26px;line-height:1.1;margin-top:4px;}
  .lead-stat span{font-size:11.5px;color:var(--muted);font-weight:800;}
  .lead-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .lead-toolbar input,.lead-toolbar select{
    min-height:42px;border:1px solid #DDE3EA;border-radius:12px;padding:8px 11px;background:#fff;font:inherit;font-size:13px;
  }
  .lead-toolbar input{flex:1;min-width:220px;}
  .lead-status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;background:#F2F4F7;}
  .lead-status-nuovo{background:#FFF0EA;color:#B94724;}
  .lead-status-ok{background:#EAF8F0;color:#24764A;}
  .lead-status-wait{background:#FFF7E8;color:#936319;}
  .lead-status-lost{background:#F3F4F6;color:#69707A;}
  .lead-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .lead-table-wrap{overflow:auto;}
  .lead-table{width:100%;min-width:900px;border-collapse:collapse;}
  .lead-table th,.lead-table td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;font-size:12.5px;}
  .lead-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .lead-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .lead-detail-box{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:11px 12px;}
  .lead-detail-box small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px;}
  .lead-detail-request{white-space:pre-wrap;line-height:1.5;max-height:300px;overflow:auto;}
  .dashboard-lead-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .dashboard-lead-row:last-child{border-bottom:0;}
  @media(max-width:850px){.lead-stats{grid-template-columns:1fr 1fr;}.lead-detail-grid{grid-template-columns:1fr;}}


  .lead-table select.inline{
    min-height:36px;
    padding:5px 8px;
    border-radius:10px;
    border:1px solid #DDE3EA;
    background:#fff;
    font-size:12px;
  }


  /* ============ MENU PER MACRO AREE ============ */
  .nav-group{margin:0 0 12px;}
  .nav-group-title,
  .sidebar-system-title{
    margin:10px 12px 6px;
    font-size:10px;

  /* ============ MOBILE: MENU / DASHBOARD ============ */

  /* ============ POSTA: LETTE NORMALI, NON LETTE IN GRASSETTO ============ */

  .mail-action-status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:900;margin-top:6px;margin-left:5px;letter-spacing:.02em;}

  .mail-reader-actions .mail-action-done{

/* ===== SCHEDA DI LAVORAZIONE 2026 ===== */
.job-v2{display:flex;flex-direction:column;gap:14px;}
.job-v2-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:4px 2px 2px;}
.job-v2-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.job-v2-title h2{margin:0;font-size:28px;letter-spacing:-.03em;}
.job-v2-sub{margin:5px 0 0;color:var(--muted);font-size:12px;}
.job-v2-card{background:#fff;border:1px solid #e7ebf0;border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(25,35,50,.045);position:relative;overflow:hidden;}
.job-v2-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--job-accent,#2f80ed);}
.job-v2-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.job-v2-section-title h3{margin:0;font-size:17px;display:flex;align-items:center;gap:9px;}
.job-v2-num{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:9px;background:color-mix(in srgb,var(--job-accent,#2f80ed) 12%,white);color:var(--job-accent,#2f80ed);font-size:13px;font-weight:900;}
.job-v2-info-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:0;border:1px solid #edf0f4;border-radius:13px;overflow:hidden;background:#fbfcfd;}
.job-v2-info-cell{padding:14px 16px;border-right:1px solid #edf0f4;min-width:0;}
.job-v2-info-cell:last-child{border-right:0;}
.job-v2-info-cell label{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px;}
.job-v2-info-main{font-weight:800;font-size:14px;}
.job-v2-info-sub{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;}
.job-v2-table-wrap{overflow-x:auto;border:1px solid #edf0f4;border-radius:13px;}
.job-v2-table{width:100%;border-collapse:collapse;min-width:900px;}
.job-v2-table th{background:#f7f9fb;color:#687386;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:10px 11px;text-align:left;white-space:nowrap;}
.job-v2-table td{padding:10px 11px;border-top:1px solid #edf0f4;vertical-align:top;}
.job-v2-table input,.job-v2-table select,.job-v2-table textarea{width:100%;box-sizing:border-box;}
.job-v2-product{min-width:250px;}
.job-v2-desc-toggle{margin-top:7px;border-top:1px dashed #e5e9ee;padding-top:6px;}
.job-v2-desc-toggle summary{cursor:pointer;color:#647084;font-size:11px;font-weight:800;list-style:none;display:flex;align-items:center;gap:6px;}
.job-v2-desc-toggle summary::-webkit-details-marker{display:none;}
.job-v2-desc-toggle summary:before{content:"›";display:inline-block;font-size:17px;line-height:1;transition:.18s transform;}
.job-v2-desc-toggle[open] summary:before{transform:rotate(90deg);}
.job-v2-desc-toggle textarea{margin-top:8px;min-height:88px;resize:vertical;}
.job-v2-two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;}
.job-v2-three{display:grid;grid-template-columns:1fr .8fr 1.25fr;gap:14px;}
.job-v2-soft{background:#fbfcfd;border:1px solid #edf0f4;border-radius:13px;padding:14px;}
.job-v2-soft h4{margin:0 0 10px;font-size:13px;}
.job-v2-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:start;}
.job-v2-step{text-align:center;position:relative;}
.job-v2-step:not(:last-child):after{content:"→";position:absolute;right:-10px;top:8px;color:#a8b0bb;}
.job-v2-step-dot{width:24px;height:24px;border-radius:50%;border:2px solid #d9dfe7;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:#fff;}
.job-v2-step.done .job-v2-step-dot{background:#26a65b;border-color:#26a65b;color:#fff;}
.job-v2-step.active .job-v2-step-dot{border-color:#f0a000;color:#f0a000;}
.job-v2-step-label{font-size:11px;font-weight:800;}
.job-v2-step-date{font-size:10px;color:var(--muted);margin-top:3px;}
.job-v2-money-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0f4;font-size:12px;}
.job-v2-money-row:last-child{border-bottom:0;}
.job-v2-money-row.total{font-size:17px;font-weight:900;padding-top:12px;}
.job-v2-money-row.balance{font-size:16px;font-weight:900;color:var(--danger);}
.job-v2-pay-table{width:100%;border-collapse:collapse;font-size:12px;}
.job-v2-pay-table th{color:var(--muted);font-size:10px;text-transform:uppercase;text-align:left;padding:7px;}
.job-v2-pay-table td{border-top:1px solid #edf0f4;padding:8px 7px;}
.job-v2-bottom-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding-top:2px;}
.job-v2-pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;}
.job-v2-muted-label{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:6px;}
.job-v2-start{font-weight:900;color:#1e6bb8;}
.job-v2-note{width:100%;min-height:110px;resize:vertical;}
@media(max-width:900px){
  .job-v2-info-grid,.job-v2-two,.job-v2-three{grid-template-columns:1fr;}
  .job-v2-info-cell{border-right:0;border-bottom:1px solid #edf0f4;}
  .job-v2-info-cell:last-child{border-bottom:0;}
  .job-v2-progress{grid-template-columns:repeat(2,1fr);}
}


/* ===== STATO LAVORAZIONE + COMUNICAZIONI ===== */
.job-v2-status-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch;}
.job-v2-stage{border:1px solid #e7ebf0;border-radius:14px;background:#fff;padding:14px;min-height:170px;display:flex;flex-direction:column;gap:9px;position:relative;}
.job-v2-stage.current{border-color:#f2b24a;background:#fffaf0;box-shadow:0 5px 16px rgba(242,178,74,.13);}
.job-v2-stage.done{background:#f8fcf9;border-color:#cfe9d7;}
.job-v2-stage-head{display:flex;align-items:center;gap:8px;}
.job-v2-stage-num{width:25px;height:25px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eef2f7;color:#536173;font-size:11px;font-weight:900;flex:0 0 auto;}
.job-v2-stage.done .job-v2-stage-num{background:#20a857;color:#fff;}
.job-v2-stage.current .job-v2-stage-num{background:#f5b400;color:#fff;}
.job-v2-stage-title{font-size:12px;font-weight:900;}
.job-v2-stage-copy{font-size:11px;color:var(--muted);line-height:1.45;min-height:34px;}
.job-v2-stage-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
.job-v2-stage-actions .btn{width:100%;justify-content:center;}
.job-v2-stage-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px;padding-top:4px;border-top:1px dashed #e6ebf1;}
.job-v2-stage-nav.single-next{justify-content:flex-end;}
.job-v2-nav-link{appearance:none;border:0;background:transparent;padding:0;font-size:12px;font-weight:800;letter-spacing:.01em;color:#7b8898;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.16s ease;}
.job-v2-nav-link:hover{color:#ef5b2f;transform:translateX(1px);}
.job-v2-nav-link.back:hover{transform:translateX(-1px);}
.job-v2-nav-link.next{color:#ef5b2f;}
.job-v2-nav-link.complete{color:#21834c;}
.job-v2-nav-link:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.job-v2-wa-btn{border-color:#38a169!important;color:#21834c!important;background:#f4fff8!important;}
.job-v2-mail-btn{border-color:#93b8ff!important;color:#2468d4!important;background:#f7faff!important;}
.job-v2-stage-disabled{opacity:.5;pointer-events:none;}
.job-v2-admin-details{border:1px solid #e7ebf0;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 5px 18px rgba(25,35,50,.045);}
.job-v2-admin-details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 19px;border-left:4px solid #ef5b4a;font-weight:900;}
.job-v2-admin-details>summary::-webkit-details-marker{display:none;}
.job-v2-admin-details>summary:after{content:"⌄";font-size:18px;color:var(--muted);transition:.18s transform;}
.job-v2-admin-details[open]>summary:after{transform:rotate(180deg);}
.job-v2-admin-body{padding:0 18px 18px;}
@media(max-width:1000px){.job-v2-status-flow{grid-template-columns:1fr 1fr;}}
@media(max-width:620px){.job-v2-status-flow{grid-template-columns:1fr;}}


/* ===== OPERATORI A CHIP ===== */
.worker-chip-wrap{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;}
.worker-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid #d9e0e8;background:#fff;color:#4f5b6b;font-size:12px;font-weight:800;cursor:pointer;transition:.16s ease;user-select:none;}
.worker-chip:hover{border-color:#9fb7d9;background:#f7faff;transform:translateY(-1px);}
.worker-chip.selected{background:#eef5ff;border-color:#7ca7e8;color:#2468d4;box-shadow:0 3px 10px rgba(36,104,212,.08);}
.worker-chip-dot{width:8px;height:8px;border-radius:50%;background:#c3cad3;flex:0 0 auto;}
.worker-chip.selected .worker-chip-dot{background:#2f80ed;}
.worker-chip input{position:absolute;opacity:0;pointer-events:none;}
.worker-summary{margin-top:9px;font-size:11px;color:var(--muted);}


/* ===== STATO SINGOLO / TIMELINE ===== */
.job-stage-single-wrap{display:flex;flex-direction:column;gap:18px;}
.job-stage-timeline{display:grid;grid-template-columns:repeat(5,1fr);align-items:start;gap:0;padding:2px 18px 4px;}
.job-stage-point{position:relative;text-align:center;min-width:0;}
.job-stage-point:not(:last-child):after{content:"";position:absolute;top:17px;left:56%;right:-44%;height:2px;background:#dce3eb;z-index:0;}
.job-stage-point.done:not(:last-child):after{background:#35a866;}
.job-stage-dot{position:relative;z-index:1;width:36px;height:36px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #cad3de;background:#fff;color:#7b8796;font-size:14px;font-weight:900;}
.job-stage-point.done .job-stage-dot{background:#20a857;border-color:#20a857;color:#fff;}
.job-stage-point.current .job-stage-dot{background:#f5a900;border-color:#f5a900;color:#fff;box-shadow:0 0 0 5px rgba(245,169,0,.12);}
.job-stage-label{font-size:13px;font-weight:800;color:#6b7787;white-space:normal;line-height:1.25;}
.job-stage-point.current .job-stage-label{color:#202b3b;font-weight:900;}
.job-stage-current-shell{display:grid;grid-template-columns:145px minmax(0,1fr) 145px;gap:18px;align-items:center;}
.job-stage-arrow-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:190px;}
.job-stage-arrow{appearance:none;width:52px;height:52px;border-radius:50%;border:1px solid #d9e1ea;background:#fff;color:#667487;font-size:28px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s ease;box-shadow:0 2px 8px rgba(20,30,45,.04);}
.job-stage-arrow:hover{border-color:#f0a66c;color:#ef5b2f;transform:scale(1.04);}
.job-stage-arrow:disabled{opacity:.25;cursor:not-allowed;transform:none;}
.job-stage-arrow-caption{font-size:12px;font-weight:800;color:#526071;}
.job-stage-arrow-sub{font-size:11px;color:var(--muted);line-height:1.25;}
.job-stage-current-card{border:1px solid #f0cf8c;background:#fffaf0;border-radius:18px;padding:22px 24px;box-shadow:0 7px 20px rgba(60,45,15,.06);min-height:210px;}
.job-stage-current-kicker{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff0c7;color:#a66c00;font-size:11px;font-weight:900;margin-bottom:8px;}
.job-stage-current-title{font-size:22px;font-weight:900;color:#202b3b;margin-bottom:8px;}
.job-stage-current-copy{font-size:15px;line-height:1.55;color:#657184;margin-bottom:16px;}
.job-stage-current-card .job-v2-muted-label{font-size:13px;}
.job-stage-current-card .job-v2-start{font-size:18px;}
.job-stage-current-card select.inline{font-size:15px;padding:10px 12px;}
.job-stage-current-actions{display:flex;flex-direction:column;gap:10px;}
.job-stage-current-actions .btn{font-size:15px;padding:12px 16px;}
.job-stage-note{font-size:13px;color:var(--muted);line-height:1.5;}
.job-stage-final{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#f4fbf6;border:1px solid #cae9d2;border-radius:13px;color:#267348;font-size:15px;font-weight:800;}
.job-stage-final-icon{width:34px;height:34px;border-radius:50%;background:#20a857;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto;}
@media(max-width:900px){
  .job-stage-current-shell{grid-template-columns:1fr;}
  .job-stage-arrow-zone{min-height:auto;flex-direction:row;justify-content:center;padding:2px 0;}
  .job-stage-arrow-caption,.job-stage-arrow-sub{display:none;}
  .job-stage-timeline{padding-left:0;padding-right:0;}
  .job-stage-label{font-size:11px;}
  .job-stage-dot{width:30px;height:30px;}
  .job-stage-point:not(:last-child):after{top:14px;}
}


/* ===== LAYOUT FINALE SCHEDA LAVORAZIONE ===== */
.job-v2-info-grid{grid-template-columns:.9fr .85fr .95fr .9fr;}
.job-v2-info-cell{padding:16px 18px;}
.job-v2-info-cell label{font-size:12px;}
.job-v2-info-main{font-size:18px;line-height:1.25;}
.job-v2-info-sub{font-size:14px;line-height:1.4;}
.job-v2-date-box{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:18px;font-weight:900;margin-top:6px;}
.job-v2-date-box.start{background:#eef5ff;color:#2468d4;border:1px solid #d4e4fb;}
.job-v2-date-box.delivery{background:#eefaf1;color:#267348;border:1px solid #d4edd9;}
.job-v2-date-icon{font-size:18px;}
.job-v2-state-select{font-size:15px!important;font-weight:900!important;padding:11px 12px!important;}
.job-v2-delivery-select{font-size:15px!important;padding:10px 12px!important;}

.job-v2-table th{font-size:13px;padding:13px 14px;}
.job-v2-table td{padding:14px;}
.job-v2-table select,.job-v2-table input,.job-v2-table textarea{font-size:16px;}
.job-v2-product input.desc-input{font-size:17px;font-weight:700;padding:10px 12px;}
.job-v2-desc-toggle{margin-top:9px;padding-top:8px;}
.job-v2-desc-toggle summary{font-size:14px;}
.job-v2-desc-toggle textarea{font-size:16px;line-height:1.5;min-height:120px;padding:12px;}
.job-v2-table td.num input{font-size:16px;padding:10px;}
.job-v2-table td.num{font-size:16px;}
.job-v2-table td:nth-child(1){min-width:210px;}
.job-v2-table td:nth-child(2){min-width:420px;}

.worker-picker{position:relative;}
.worker-picker-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border:1px solid #d7dee8;border-radius:12px;background:#fff;font-size:15px;font-weight:800;cursor:pointer;color:#2c3747;}
.worker-picker-summary:hover{border-color:#9fb7d9;background:#f8fbff;}
.worker-picker-panel{display:none;position:static;z-index:30;margin-top:8px;width:100%;box-sizing:border-box;background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:10px;box-shadow:0 8px 20px rgba(22,35,55,.08);}
.worker-picker.open .worker-picker-panel{display:block;}
.worker-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:800;color:#4f5b6b;}
.worker-option:hover{background:#f5f8fc;}
.worker-option.selected{background:#eef5ff;color:#2468d4;}
.worker-option-mark{width:20px;height:20px;border-radius:50%;border:1px solid #cdd6e0;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff;}
.worker-option.selected .worker-option-mark{background:#2f80ed;color:#fff;border-color:#2f80ed;}
.worker-selected-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.worker-selected-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#f3f6fa;border:1px solid #dde4ec;font-size:12px;font-weight:800;color:#566172;}

.job-stage-current-card.stage-da-fare{background:#f8fbf9;border-color:#d7e8dc;}
.job-stage-current-card.stage-preparazione{background:#fff7eb;border-color:#efbd6a;}
.job-stage-current-card.stage-produzione{background:#fff8cf;border-color:#e6c94d;}
.job-stage-current-card.stage-completato{background:#eef9f1;border-color:#a9d6b3;}
.job-stage-current-card.stage-consegnato{background:#f1f3f8;border-color:#c8cfdb;}

.job-stage-current-card.stage-preparazione .job-stage-current-kicker{background:#ffe7c2;color:#b66000;}
.job-stage-current-card.stage-produzione .job-stage-current-kicker{background:#fff0a6;color:#8b6d00;}
.job-stage-current-card.stage-completato .job-stage-current-kicker{background:#dff2e4;color:#267348;}
.job-stage-current-card.stage-consegnato .job-stage-current-kicker{background:#e7eaf1;color:#4d5870;}

@media(max-width:1050px){
  .job-v2-info-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:700px){
  .job-v2-info-grid{grid-template-columns:1fr;}
  .job-v2-table td:nth-child(1),.job-v2-table td:nth-child(2){min-width:unset;}
}


/* ===== FIX LAVORAZIONI: DESCRIZIONE 30, PREZZI, LAYOUT ===== */
.job-v2-product input.desc-input{
  font-weight:400 !important;
  font-size:16px !important;
}
.job-v2-table{
  min-width:0 !important;
  table-layout:fixed;
  width:100%;
}

}

/* ===== FLUSSO DI LAVORO RINNOVATO ===== */
.flow-toolbar{
  display:grid;
  grid-template-columns:minmax(240px,1.5fr) minmax(180px,.8fr) minmax(170px,.8fr) auto auto;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}
.flow-control{
  width:100%;
  min-height:44px;
  border:1px solid #dce3eb;
  border-radius:12px;
  background:#fff;
  color:#243142;
  padding:10px 12px;
  font-size:14px;
  font-family:inherit;
  box-sizing:border-box;
}
.flow-toggle{
  min-height:44px;
  border:1px solid #dce3eb;
  border-radius:12px;
  background:#fff;
  color:#526071;
  padding:9px 13px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.flow-toggle.active{
  background:#fff4df;
  border-color:#efbd6a;
  color:#a55b00;
}
.flow-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:18px;
}
.flow-stat{
  border:1px solid #e1e7ee;
  border-radius:15px;
  padding:15px 16px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:72px;
  box-shadow:0 4px 14px rgba(20,32,50,.035);
}
.flow-stat-icon{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;font-weight:900;font-size:17px;
}
.flow-stat-label{font-size:12px;color:#687586;font-weight:800;margin-bottom:3px;}
.flow-stat-value{font-size:24px;font-weight:900;color:#172033;line-height:1;}
.flow-stat.start .flow-stat-icon{background:#eaf3ff;color:#2f80ed;}
.flow-stat.deadline{background:#fff8f7;border-color:#f2d7d2;}
.flow-stat.deadline .flow-stat-icon{background:#ffe3df;color:#df3d31;}
.flow-stat.wait .flow-stat-icon{background:#f1eaff;color:#7950d5;}
.flow-stat.external .flow-stat-icon{background:#e7f6ff;color:#2579ad;}

.flow-board{
  display:grid;
  grid-template-columns:repeat(4,minmax(270px,1fr));
  gap:14px;
  align-items:start;
  overflow-x:auto;
  padding:2px 1px 18px;
}
.flow-col{
  border-radius:18px;
  padding:12px;
  min-width:265px;
  border:1px solid #dfe5ec;
  min-height:240px;
}
.flow-col[data-stage="todo"]{background:#f3f5f7;border-color:#e0e5eb;}
.flow-col[data-stage="grafica"]{background:#fff0ee;border-color:#f2d2cc;}
.flow-col[data-stage="production"]{background:#fff7cf;border-color:#eadc8a;}
.flow-col[data-stage="external"]{background:#eaf7ff;border-color:#cfe7f5;}
.flow-col-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:5px 4px 12px;
}
.flow-col-title{
  font-size:14px;font-weight:900;color:#172033;letter-spacing:.1px;
}
.flow-col-count{
  min-width:27px;height:27px;padding:0 8px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.82);border:1px solid rgba(100,115,135,.15);
  font-size:12px;font-weight:900;color:#4d5969;
}
.flow-job{
  background:#fff;
  border:1px solid #dfe5ec;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 4px 12px rgba(25,35,50,.055);
  cursor:pointer;
  transition:.16s ease;
}
.flow-job:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(25,35,50,.09);}
.flow-job.important{border:2px solid #efb334;}
.flow-job.overdue{border-color:#e25b52;box-shadow:0 0 0 1px rgba(226,91,82,.08);}
.flow-job-top{display:flex;justify-content:space-between;gap:9px;align-items:flex-start;}
.flow-job-client{font-size:15px;font-weight:900;color:#172033;line-height:1.25;}
.flow-job-num{font-size:10px;color:#8995a5;font-weight:700;white-space:nowrap;}
.flow-job-desc{font-size:13px;color:#536174;margin-top:5px;line-height:1.35;}
.flow-job-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:11px;}
.flow-worker{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:800;color:#4d5968;
  background:#f1f4f8;border-radius:999px;padding:5px 8px;
}
.flow-worker-dot{
  width:22px;height:22px;border-radius:50%;background:#dce4ee;
  display:flex;align-items:center;justify-content:center;
  color:#425064;font-size:9px;font-weight:900;
}
.flow-date{font-size:11.5px;font-weight:800;color:#536174;}
.flow-date.today,.flow-date.overdue{color:#d83a31;}
.flow-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.flow-badge{
  display:inline-flex;align-items:center;border-radius:999px;
  padding:5px 8px;font-size:10.5px;font-weight:900;
}
.flow-badge.external{background:#e6f4ff;color:#2375aa;}
.flow-badge.wait{background:#f1e9ff;color:#7045ca;}
.flow-badge.soon{background:#fff0b8;color:#906b00;}
.flow-badge.overdue{background:#ffe0dd;color:#c9362e;}
.flow-badge.important{background:#fff0c7;color:#9c6800;}
.flow-empty{padding:28px 8px;text-align:center;color:#8793a3;font-size:13px;}

@media(max-width:1180px){
  .flow-toolbar{grid-template-columns:1fr 1fr 1fr;}
  .flow-summary{grid-template-columns:1fr 1fr;}
  .flow-board{grid-template-columns:repeat(4,315px);}
}
@media(max-width:720px){
  .flow-toolbar{grid-template-columns:1fr;}
  .flow-summary{grid-template-columns:1fr 1fr;}
}


/* ===== PERSONALIZZAZIONI DATA / SERVIZI / RITIRO ESTERNO ===== */
.job-v2-service-row .riga-categoria-select,
.job-v2-service-row .job-v2-product input,
.job-v2-service-row .job-v2-product textarea,
.job-v2-service-row .job-v2-desc-toggle summary,
.job-v2-service-row td.num,
.job-v2-service-row td.num input{

function canonicalWarehouseColor(v){
  const raw = String(v||"").trim();
  if(!raw) return "";
  const key = raw.toUpperCase().replace(/\s+/g," ");
  return WAREHOUSE_COLOR_MAP[key] || raw.replace(/\b\w/g, c=>c.toUpperCase());
}
function warehouseColorKey(v){ return canonicalWarehouseColor(v).toLowerCase(); }
function warehouseColorRank(v){
  const c = warehouseColorKey(v);
  if(c==="white") return 0;
  if(c==="black") return 1;
  return 2;
}
function compareWarehouseColors(a,b){
  const ra=warehouseColorRank(a), rb=warehouseColorRank(b);
  if(ra!==rb) return ra-rb;
  return canonicalWarehouseColor(a).localeCompare(canonicalWarehouseColor(b),"en",{sensitivity:"base"});
}
function normalizeStockColor(v){ return String(v||"").trim().toUpperCase(); }
function minimoDefaultMagazzino(w){
  const code=String(w.codice||"").trim().toUpperCase();
  const color=normalizeStockColor(w.colore);
  const size=String(w.taglia||"").trim().toUpperCase();
  const rule=STOCK_ALERT_RULES.find(r=>r.codice===code && r.colori.includes(color) && r.taglie.includes(size));
  return rule ? rule.minimo : 0;
}
function minimoRichiestoMagazzino(w){
  if(w && w.scortaMinima!==null && w.scortaMinima!==undefined && !Number.isNaN(Number(w.scortaMinima))){
    return Math.max(0, Number(w.scortaMinima)||0);
  }
  return minimoDefaultMagazzino(w);
}
function computeScorteMonitorate(){
  return state.warehouse
    .filter(w=>{
      const minimo = minimoRichiestoMagazzino(w);
      return minimo>0 && Number(w.quantita||0) <= minimo;
    })
    .map(w=>({
      ...w,
      quantita:Number(w.quantita)||0,
      scortaMinima:minimoRichiestoMagazzino(w),
      virtuale:false
    }))
    .sort((a,b)=>
      String(a.codice||a.nome||"").localeCompare(String(b.codice||b.nome||"")) ||
      String(a.colore||"").localeCompare(String(b.colore||"")) ||
      String(a.taglia||"").localeCompare(String(b.taglia||""))
    );
}

/* ---- Caricamento iniziale da Supabase (tutte le tabelle in parallelo) ---- */
async function loadAllFromSupabase(){
  const collections = Object.keys(TABLES);
  const results = await Promise.all(collections.map(c => c==="warehouse" ? sb.from(TABLES[c]).select("*").gt("quantita",0) : sb.from(TABLES[c]).select("*")));
  collections.forEach((c, i) => {
    const { data, error } = results[i];
    if(error){ console.error("Errore caricamento", c, error); state[c] = []; return; }
    state[c] = (data||[]).map(r => fromDbRow(c, r));
  });
  // Le fasi vanno ricalcolate se qualche categoria non ha più il template previsto, preservando le spunte già fatte
  state.orders.forEach(o => recalcFasi(o));
  // Le scorte minime vengono lette dal database e possono essere modificate manualmente.
  // Per le vecchie varianti monitorate resta solo un valore iniziale di sicurezza se manca del tutto.
  state.warehouse.forEach(w=>{
    if(w.scortaMinima===null || w.scortaMinima===undefined || Number.isNaN(Number(w.scortaMinima))){
      w.scortaMinima = minimoDefaultMagazzino(w);
    } else {
      w.scortaMinima = Math.max(0, Number(w.scortaMinima)||0);
    }
  });
  snapshotAllCollections();
}

/* ---- Scrittura sicura: salva SOLO le righe cambiate su questo dispositivo.
   In questo modo un computer con dati vecchi non può riscrivere tutti gli ordini degli altri. ---- */
async function syncCollection(name){
  const previous = syncSnapshots[name] || new Map();
  const changedObjects = (state[name]||[]).filter(o => previous.get(o.id) !== rowFingerprint(name,o));
  if(!changedObjects.length) return true;
  const rows = changedObjects.map(o => toDbRow(name, o));
  activeDbWrites++;
  try{
    const { error } = await sb.from(TABLES[name]).upsert(rows);
    if(error){
      console.error("Errore salvataggio", name, error);
      showToast(`Errore salvataggio ${name}: ${error.message || "riprova"}`);
      return false;
    }
    if(!syncSnapshots[name]) syncSnapshots[name]=new Map();
    changedObjects.forEach(o=>syncSnapshots[name].set(o.id,rowFingerprint(name,o)));
    return true;
  } finally {
    activeDbWrites=Math.max(0,activeDbWrites-1);
  }
}

/* Salvataggio mirato di una sola riga: usato nei flussi nuovo cliente -> nuovo ordine,
   così l'ordine non può essere creato prima che il cliente esista davvero su Supabase. */
async function upsertOne(collection, obj){
  const row = toDbRow(collection, obj);
  activeDbWrites++;
  try{
    const { error } = await sb.from(TABLES[collection]).upsert(row);
    if(error){
      console.error("Errore salvataggio", collection, error);
      showToast(`Errore salvataggio ${collection}: ${error.message || "riprova"}`);
      return false;
    }
    if(!syncSnapshots[collection]) syncSnapshots[collection]=new Map();
    syncSnapshots[collection].set(obj.id,rowFingerprint(collection,obj));
    return true;
  } finally { activeDbWrites=Math.max(0,activeDbWrites-1); }
}
async function upsertOneReturning(collection, obj){
  const row = toDbRow(collection, obj);
  activeDbWrites++;
  try{
    const { data, error } = await sb.from(TABLES[collection]).upsert(row).select("*").single();
    if(error){
      console.error("Errore salvataggio", collection, error);
      showToast(`Errore salvataggio ${collection}: ${error.message || "riprova"}`);
      return null;
    }
    const saved = data ? fromDbRow(collection, data) : obj;
    if(!syncSnapshots[collection]) syncSnapshots[collection]=new Map();
    syncSnapshots[collection].set(saved.id,rowFingerprint(collection,saved));
    return saved;
  } finally { activeDbWrites=Math.max(0,activeDbWrites-1); }
}
/* ---- Cancellazione mirata ---- */
async function dbDelete(name, id){
  activeDbWrites++;
  try{
    const { error } = await sb.from(TABLES[name]).delete().eq("id", id);
    if(error){ console.error("Errore eliminazione", name, error); showToast("Errore nell'eliminazione: riprova"); return; }
    syncSnapshots[name]?.delete(id);
  } finally { activeDbWrites=Math.max(0,activeDbWrites-1); }
}
async function dbDeleteMany(name, ids){
  if(!ids.length) return;
  activeDbWrites++;
  try{
    const { error } = await sb.from(TABLES[name]).delete().in("id", ids);
    if(error){ console.error("Errore eliminazione multipla", name, error); showToast("Errore nell'eliminazione: riprova"); return; }
    ids.forEach(id=>syncSnapshots[name]?.delete(id));
  } finally { activeDbWrites=Math.max(0,activeDbWrites-1); }
}
/* Compatibilità: chiamate rimaste generiche vengono instradate sulla collezione giusta quando possibile */
function saveState(name){
  if(name) { syncCollection(name); return; }
  console.warn("saveState() chiamato senza indicare la collezione: nessuna sincronizzazione effettuata.");

/* ---- Aggiornamenti in tempo reale da altri dispositivi ---- */
function subscribeRealtime(){
  Object.keys(TABLES).forEach(name=>{
    sb.channel(`${name}-changes`)
      .on("postgres_changes", {event:"*", schema:"public", table:TABLES[name]}, payload => {
        if(payload.eventType === "DELETE"){
          state[name] = state[name].filter(x=>x.id !== payload.old.id);
        } else {
          const row = fromDbRow(name, payload.new);
          const idx = state[name].findIndex(x=>x.id===row.id);
          if(name==="warehouse" && Number(row.quantita)<=0){
            if(idx>=0) state[name].splice(idx,1);
          } else {
            if(idx>=0) state[name][idx] = row; else state[name].push(row);
          }
          if(name==="orders") recalcFasi(state[name].find(x=>x.id===row.id));
          if(!syncSnapshots[name]) syncSnapshots[name]=new Map();
          const actual=state[name].find(x=>x.id===row.id);
          if(actual) syncSnapshots[name].set(row.id,rowFingerprint(name,actual));
        }
        if(payload.eventType === "DELETE") syncSnapshots[name]?.delete(payload.old.id);
        requestSafeCurrentViewRender();
      })
      .subscribe();
  });
}

/* Sincronizzazione di sicurezza: funziona anche se Realtime non è abilitato nel progetto Supabase. */
async function refreshSharedDataFromSupabase(render=true){
  if(!currentUser || dataSyncBusy || activeDbWrites>0) return;
  dataSyncBusy=true;
  try{
    const collections = currentUser.role==="admin"
      ? Object.keys(TABLES)
      : Object.keys(TABLES).filter(c=>!["expenses","fixedCosts","entrate"].includes(c));
    const results = await Promise.all(collections.map(c => c==="warehouse" ? sb.from(TABLES[c]).select("*").gt("quantita",0) : sb.from(TABLES[c]).select("*")));
    collections.forEach((c,i)=>{
      const {data,error}=results[i];
      if(error){ console.warn("Sync lettura",c,error); return; }
      state[c]=(data||[]).map(r=>fromDbRow(c,r));
      if(c==="orders") state[c].forEach(o=>recalcFasi(o));
      snapshotCollection(c);
    });
    if(render){
      const modalOpen=document.getElementById("modalBackdrop")?.classList.contains("open");
      if(!modalOpen) requestSafeCurrentViewRender();
    }
  } finally { dataSyncBusy=false; }
}

function warehouseSizeSortKey(v){
  const raw=String(v||"").trim().toUpperCase();
  if(!raw) return [99,999,999,""];

  // Taglie bambino / età: 1/2, 3-4, 5/6, 9-11, 12, 14-15...
  if(/^\d+(?:\s*[-/]\s*\d+)?$/.test(raw)){
    const nums=raw.split(/[-/]/).map(n=>Number(n.trim()));
    return [0,nums[0]||0,nums[1] ?? nums[0] ?? 0,raw];
  }

  // Taglie adulto: XXS, XS, S, M, L, XL, XXL, 3XL, 4XL...
  const adultOrder={
    "XXXS":0,
    "XXS":1,
    "XS":2,
    "S":3,
    "M":4,
    "L":5,
    "XL":6,
    "XXL":7,
    "2XL":7,
    "3XL":8,
    "XXXL":8,
    "4XL":9,
    "5XL":10,
    "6XL":11,
    "7XL":12,
    "8XL":13
  };
  if(Object.prototype.hasOwnProperty.call(adultOrder,raw)){
    return [1,adultOrder[raw],0,raw];
  }

  // UNICA sempre in fondo.
  if(raw==="UNICA" || raw==="ONE SIZE" || raw==="ONESIZE"){
    return [3,999,999,raw];
  }

  // Eventuali taglie non standard dopo quelle note.
  return [2,500,500,raw];
}

function compareWarehouseSizes(a,b){
  const ka=warehouseSizeSortKey(a);
  const kb=warehouseSizeSortKey(b);
  for(let i=0;i<3;i++){
    if(ka[i]!==kb[i]) return ka[i]-kb[i];
  }
  return String(ka[3]).localeCompare(String(kb[3]),"it",{numeric:true,sensitivity:"base"});
}

function sortWarehouseSizes(values){
  return [...values].sort(compareWarehouseSizes);
}

function catalogSizesForCode(code, colore=""){
  const normalized = String(code||"").trim().toUpperCase();

  // Fruit of the Loom Kids Premium Set-In Sweat 62-031-0 / FR620310:
  // il catalogo precedente accorpava erroneamente le taglie in "3-4-14-15".
  if(normalized==="FR620310" || normalized==="620310" || normalized==="62-031-0"){
    return sortWarehouseSizes(["3-4","5-6","7-8","9-11","12-13","14-15"]);
  }

  const p = catalogProduct(code);
  if(p && colore && p.colorSizes && typeof p.colorSizes==="object"){
    const target = warehouseColorKey(colore);
    const matchedKey = Object.keys(p.colorSizes).find(k=>warehouseColorKey(k)===target);
    if(matchedKey && Array.isArray(p.colorSizes[matchedKey]) && p.colorSizes[matchedKey].length) return sortWarehouseSizes(p.colorSizes[matchedKey]);
  }
  if(p && Array.isArray(p.sizes) && p.sizes.length) return sortWarehouseSizes(p.sizes);
  return p ? ["UNICA"] : [];
}

/* Ricalcola le fasi di lavorazione in base alle categorie presenti nelle righe, preservando lo stato delle spunte già fatte */
function recalcFasi(order){
  // Manteniamo gestione bozza, comunicazioni ordine e collegamenti esterni ai file.
  // I file veri NON vengono salvati nel gestionale.
  const marker = (order.fasi||[]).find(f=>f && f.key==="__bozza__");
  const presaCarico = (order.fasi||[]).find(f=>f && f.key==="__presa_carico__");
  const allegati = (order.fasi||[]).filter(f=>f && f.key==="__allegato__");
  order.fasi = [...(marker ? [marker] : []), ...(presaCarico ? [presaCarico] : []), ...allegati];
}

function externalFileUrl(url, download=false){
  let u=String(url||"").trim();
  if(!u) return "";
  if(/dropbox\.com/i.test(u)){
    try{
      const obj=new URL(u);
      obj.searchParams.delete("raw");
      obj.searchParams.set("dl", download ? "1" : "0");
      return obj.toString();
    }catch(e){}
  }
  return u;
}

async function handleBozzaMailFiles(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length) return;
  if(bozzaMailAttachments.length + files.length > 10){
    showToast("Puoi allegare al massimo 10 file");
    const input=document.getElementById("bozza-mail-files"); if(input) input.value="";
    return;
  }
  try{
    for(const file of files){
      const dataBase64=await fileToBase64(file);
      bozzaMailAttachments.push({
        filename:file.name,
        mimeType:file.type||"application/octet-stream",
        size:file.size||0,
        dataBase64
      });
    }
    renderBozzaMailAttachments();
  }catch(err){
    console.error("Allegato bozza Gmail error",err);
    showToast("Errore durante la lettura di un allegato");
  }

async function sendBozzaMail(orderId){
  const o=findItem('orders',orderId); if(!o) return;
  const c=state.clients.find(x=>x.id===o.clientId);
  if(!c) return;
  const to=String(document.getElementById("bozza-mail-to")?.value||c.email||"").trim();
  const subject=String(document.getElementById("bozza-mail-subject")?.value||"").trim();
  const bodyText=String(document.getElementById("bozza-mail-body")?.value||"").trim();
  const status=document.getElementById("bozza-mail-status");
  const btn=document.getElementById("bozza-mail-send");
  if(!to || !bodyText){ showToast("Controlla email e messaggio"); return; }
  if(btn) btn.disabled=true;
  if(status) status.textContent="Invio in corso…";
  try{
    const {data:sessionData}=await sb.auth.getSession();
    const session=sessionData?.session;
    if(!session?.access_token) throw new Error("Sessione del gestionale non disponibile.");
    const response=await fetch(`${SUPABASE_URL}/functions/v1/gmail-send`,{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${session.access_token}`,
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({mode:"new",to,subject,bodyText,attachments:bozzaMailAttachments})
    });
    const raw=await response.text();
    let result={}; try{result=JSON.parse(raw)}catch(e){}
    if(!response.ok) throw new Error(result?.error||result?.message||raw||`Errore HTTP ${response.status}`);
    bozzaMailAttachments=[];
    setBozzaInAttesa(orderId);
    showToast("Bozza inviata via Gmail");
  }catch(err){
    console.error("Invio bozza Gmail",err);
    if(status) status.textContent=`Errore: ${err?.message||"invio non riuscito"}`;
    if(btn) btn.disabled=false;
  }
}

  if(currentView === "preventivi" && quoteFormOpen) return true;
  if(currentView === "ordini" && orderFormOpen) return true;
  // Protezione generale: se QUALSIASI pannello modulo è aperto
  // (es. Nuova Entrata, Spesa, Incasso, ecc.) la sincronizzazione
  // aggiorna i dati ma non ricostruisce la pagina e non chiude il modulo.
  if(document.querySelector(".form-panel.open")) return true;
  if(currentView==="magazzino" && quickWarehouseDraftHasData()) return true;
  return userIsEditingAnyField();
}
function requestSafeCurrentViewRender(){
  if(shouldDeferCurrentViewRender()){
    deferredViewRenderPending = true;
    return;
  }
  deferredViewRenderPending = false;
  renderCurrentView();
}
if(!window._globalEditingRenderGuardInstalled){
  window._globalEditingRenderGuardInstalled=true;
  document.addEventListener('focusout',()=>{
    setTimeout(()=>{
      if(deferredViewRenderPending && !shouldDeferCurrentViewRender()){
        deferredViewRenderPending=false;
        renderCurrentView();
      }
    },80);
  },true);
}
function toggleForm(id){
  if(id==="clientForm") clientFormOpen = !clientFormOpen;
  if(id==="quoteForm") quoteFormOpen = !quoteFormOpen;
  if(id==="orderForm") orderFormOpen = !orderFormOpen;
  const el = document.getElementById(id);
  if(el) el.classList.toggle("open");
}
function closeClientForm(){
  clientFormOpen = false;
  const el=document.getElementById("clientForm");
  if(el) el.classList.remove("open");
}
/* Ridisegna una vista preservando il focus e la posizione del cursore sul campo attivo (usato dalle ricerche, che altrimenti perdono il focus a ogni lettera) */
function rerenderKeepingFocus(renderFn){
  const active = document.activeElement;
  const id = active && active.id;
  const canSelect = active && typeof active.selectionStart === "number";
  const selStart = canSelect ? active.selectionStart : null;
  const selEnd = canSelect ? active.selectionEnd : null;
  renderFn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* Conferma personalizzata (window.confirm può non funzionare in ambienti sandboxed) */
let _pendingConfirmAction = null;
function askConfirm(message, action, options={}){
  _pendingConfirmAction = action;
  const destructive = /^(Eliminare|Rimuovere)/i.test(String(message||"").trim());
  const title = options.title || (destructive ? "Conferma eliminazione" : "Conferma operazione");
  const confirmText = options.confirmText || (destructive ? "Sì, elimina" : "Conferma");
  document.getElementById("modalBody").innerHTML = `
    <button class="close-x" onclick="closeModal()">×</button>
    <h2>${title}</h2>
    <p style="color:var(--muted);">${message}</p>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="_runPendingConfirm()">${confirmText}</button>
      <button class="btn btn-outline" onclick="closeModal()">Annulla</button>
    </div>
  `;
  document.getElementById("modalBackdrop").classList.add("open");
}
function _runPendingConfirm(){
  const action = _pendingConfirmAction;
  _pendingConfirmAction = null;
  document.getElementById("modalBackdrop").classList.remove("open");
  if(action) action();
}
function showToast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2200); }

let leadSearch = "";

function leadDisplayName(l){
  return String(l?.azienda||l?.nome||l?.email||"Lead").trim();

function leadStatusClass(stato){
  if(stato==="Nuovo") return "lead-status-nuovo";
  if(stato==="Accettato") return "lead-status-ok";
  if(stato==="Perso") return "lead-status-lost";
  return "lead-status-wait";
}
function fmtLeadDate(value){
  if(!value) return "—";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

async function saveManualLead(fonte='manuale'){
  const btn=document.getElementById('manual-lead-save');
  if(btn){btn.disabled=true;btn.textContent='Salvataggio…';}
  const lead={
    id:uuid(),
    nome:String(document.getElementById('manual-lead-nome')?.value||'').trim(),
    azienda:String(document.getElementById('manual-lead-azienda')?.value||'').trim(),
    email:String(document.getElementById('manual-lead-email')?.value||'').trim().toLowerCase(),
    telefono:String(document.getElementById('manual-lead-telefono')?.value||'').trim(),
    oggettoRichiesta:String(document.getElementById('manual-lead-oggetto')?.value||'').trim(),
    richiesta:String(document.getElementById('manual-lead-richiesta')?.value||'').trim(),
    stato:String(document.getElementById('manual-lead-stato')?.value||'Nuovo'),
    fonte:fonte||'manuale',
    creatoIl:new Date().toISOString(),
    aggiornatoIl:new Date().toISOString()
  };
  if(!lead.nome && !lead.azienda && !lead.email && !lead.telefono){
    showToast('Inserisci almeno nome, azienda, email o telefono');
    if(btn){btn.disabled=false;btn.textContent='Salva Lead';}
    return;
  }
  const ok=await upsertOne('leads',lead);
  if(!ok){if(btn){btn.disabled=false;btn.textContent='Salva Lead';}return;}
  if(!state.leads.some(x=>x.id===lead.id)) state.leads.unshift(lead);

  // Se il Lead nasce da una Nota, la Nota viene archiviata automaticamente.
  if(String(fonte||"").startsWith("nota:")){
    const noteId=String(fonte).slice(5);
    const n=findItem("noteComunicazioni",noteId);
    if(n){
      n.fatto=true;
      n.fattoIl=new Date().toISOString();
      const savedNote=await upsertOneReturning("noteComunicazioni",n);
      if(savedNote){
        const ni=state.noteComunicazioni.findIndex(x=>x.id===noteId);
        if(ni>=0) state.noteComunicazioni[ni]=savedNote;
      }
    }
  }

  closeModal();
  if(currentView==="note") renderNote();
  else renderLeads();

  showToast('Lead creato');
  setTimeout(()=>openLeadDetail(lead.id),80);
}

async function completeNewCustomerOrderWithClient(recordId, clientId){
  const l=(state.leads||[]).find(x=>x.id===recordId);
  if(!l || !clientId) return;

  // Se il cliente è stato creato in precedenza ma il record non era stato collegato,
  // salviamo ora il collegamento. La voce resta nella coda finché l'ordine non viene creato.
  if(!l.clientId){
    const linked=await markLeadLinkedToClient(recordId, clientId);
    if(!linked) return;
  }

  closeModal();
  newOrderForClient(clientId, recordId);
}

async function saveLeadEdit(id){

  if(!l) return;

  const before=JSON.parse(JSON.stringify(l));

  l.nome=String(document.getElementById("edit-lead-nome")?.value||"").trim();
  l.azienda=String(document.getElementById("edit-lead-azienda")?.value||"").trim();
  l.email=String(document.getElementById("edit-lead-email")?.value||"").trim().toLowerCase();
  l.telefono=String(document.getElementById("edit-lead-telefono")?.value||"").trim();
  l.oggettoRichiesta=String(document.getElementById("edit-lead-oggetto")?.value||"").trim();
  l.richiesta=String(document.getElementById("edit-lead-richiesta")?.value||"").trim();

  if(!l.clientId && !l.convertedOrderId){
    l.stato=String(document.getElementById("edit-lead-stato")?.value||l.stato||"Nuovo");
  }

  l.aggiornatoIl=new Date().toISOString();

  const saved=await upsertOneReturning("leads",l);
  if(!saved){
    const i=state.leads.findIndex(x=>x.id===id);
    if(i>=0) state.leads[i]=before;
    showToast("Errore salvataggio Lead");
    return;
  }

  const i=state.leads.findIndex(x=>x.id===id);
  if(i>=0) state.leads[i]=saved;

  if(currentView==="leads") renderLeads();
  if(currentView==="leadOrdine") renderLeadOrdine();
  if(currentView==="dashboard") renderDashboard();

  showToast("Lead aggiornato");
  openLeadDetail(id);
}

function leadClientPrefill(l){
  const fullName=String(l?.nome||"").trim();
  const parts=fullName.split(/\s+/).filter(Boolean);
  const nome=parts.length ? parts[0] : "";
  const cognome=parts.length>1 ? parts.slice(1).join(" ") : "";

  if(String(l?.azienda||"").trim()){
    return {
      tipo:"Business",
      ragioneSociale:String(l.azienda||"").trim(),
      refNome:nome,
      refCognome:cognome,
      email:String(l.email||"").trim(),
      telefono:String(l.telefono||"").trim()
    };
  }

  return {
    tipo:"Family",
    nome:nome || fullName,
    cognome,
    email:String(l.email||"").trim(),
    telefono:String(l.telefono||"").trim()
  };
}

async function expireStaleWaitingLeads(){
  const now=Date.now();
  const sevenDays=7*24*60*60*1000;
  const stale=(state.leads||[]).filter(l=>{
    if(l.stato!=="In attesa di conferma") return false;
    const ts=new Date(l.aggiornatoIl||l.creatoIl||0).getTime();
    return ts && (now-ts)>=sevenDays;
  });

  if(!stale.length) return;

  const nowIso=new Date().toISOString();
  for(const l of stale){
    const {error}=await sb.from("leads")
      .update({stato:"Perso",aggiornato_il:nowIso})
      .eq("id",l.id);

    if(!error){
      l.stato="Perso";
      l.aggiornatoIl=nowIso;
    }else{
      console.error("Errore scadenza automatica Lead",l.id,error);
    }
  }

  if(currentView==="leads") renderLeads();
  if(currentView==="leadOrdine") renderLeadOrdine();
  if(currentView==="dashboard") renderDashboard();
}

function normalizeWaPhone(v){
  let s=String(v||"").replace(/\D/g,"");
  if(s.startsWith("00")) s=s.slice(2);
  return s;
}
function localWaPhone(v){
  let s=normalizeWaPhone(v);
  if(s.startsWith("39") && s.length>=11) s=s.slice(2);
  return s;
}
function findClientByWhatsappPhone(phone){
  const full=normalizeWaPhone(phone), local=localWaPhone(phone);
  return (state.clients||[]).find(c=>{
    const cf=normalizeWaPhone(c.telefono), cl=localWaPhone(c.telefono);
    return !!cf && (cf===full || cf===local || cl===full || cl===local);
  }) || null;
}
